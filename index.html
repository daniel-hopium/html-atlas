 measure:st=>{const h=$('#ha-hidden-until-found-p',st).getAttribute('hidden'),ok='onbeforematch' in document.body;return `${h===null?tx('kein hidden – sichtbar','no hidden – visible'):h===''?'hidden':'hidden="until-found"'} · beforematch: ${st.dataset.haBm||0}×${ok?'':' · '+tx('Dein Browser kennt until-found nicht – es wirkt wie hidden.','Your browser doesn’t know until-found – it acts like hidden.')}`},
 tip:tx('CSS-Resets mit <code>[hidden] { display: none !important }</code> machen <code>until-found</code> kaputt – diese Seite hat so eine Regel und hebt sie für die Vorschau wieder auf. Außerdem bleibt das Element selbst als leere Box stehen (<code>content-visibility: hidden</code>): Rahmen und Innenabstand gehören aufs innere Element.','CSS resets with <code>[hidden] { display: none !important }</code> break <code>until-found</code> – this page has such a rule and overrides it for the preview. Also, the element itself stays as an empty box (<code>content-visibility: hidden</code>): borders and padding belong on the inner element.')});

/* ============================== tables ============================== */
const dbHours=(cap,extra='')=>`<table class="table"${extra}>${cap}<thead><tr><th scope="col">${tx('Tag','Day')}</th><th scope="col">${tx('von','from')}</th><th scope="col">${tx('bis','to')}</th></tr></thead><tbody><tr><td>${tx('Mo–Fr','Mon–Fri')}</td><td>8:00</td><td>18:00</td></tr><tr><td>${tx('Sa','Sat')}</td><td>9:00</td><td>13:00</td></tr></tbody></table>`;
HTMLA.push({id:'table-caption',cat:'tables',name:'<caption>',sub:tx('Der Name der Tabelle','The table’s name'),mdn:'Elements/caption',keys:'tabelle table titel beschriftung name überschrift',
 desc:tx('<code>&lt;caption&gt;</code> ist die Beschriftung einer Tabelle und gleichzeitig ihr zugänglicher Name. Springt man im Screenreader mit <kbd>T</kbd> von Tabelle zu Tabelle, hört man genau diesen Text. Es muss das erste Kind von <code>&lt;table&gt;</code> sein.','<code>&lt;caption&gt;</code> is a table’s title and at the same time its accessible name. When you jump from table to table with <kbd>T</kbd> in a screen reader, this is the text you hear. It must be the first child of <code>&lt;table&gt;</code>.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[['<caption>',dbHours(`<caption>${tx('Öffnungszeiten','Opening hours')}</caption>`,' data-ha-hl'),tx('Name aus dem <code>&lt;caption&gt;</code> – sichtbar und für den Screenreader derselbe Text.','Name from the <code>&lt;caption&gt;</code> – visible and the same text for the screen reader.')],
  [tx('Überschrift davor','heading before'),`<h3 class="ha-table-caption-title">${tx('Öffnungszeiten','Opening hours')}</h3>`+dbHours('',' data-ha-hl'),tx('Die Überschrift steht zwar davor, gehört aber nicht zur Tabelle: kein Name. In der Tabellenliste des Screenreaders steht nur „Tabelle“.','The heading sits right above, but doesn’t belong to the table: no name. The screen reader’s list of tables just says “table”.')],
  ['aria-labelledby',`<h3 class="ha-table-caption-title" id="ha-table-caption-title">${tx('Öffnungszeiten','Opening hours')}</h3>`+dbHours('',' aria-labelledby="ha-table-caption-title" data-ha-hl'),tx('Rettet eine vorhandene Überschrift: Die Tabelle holt sich ihren Namen per ID. Gut, wenn das Design eine Überschrift statt einer Caption verlangt.','Rescues an existing heading: the table takes its name via the ID. Good when the design calls for a heading rather than a caption.')]],
 tip:tx('Soll die Caption nicht sichtbar sein, versteck sie mit einer <code>.sr-only</code>-Klasse – nie mit <code>display: none</code>, das nimmt sie auch dem Screenreader. Steht die Tabelle in einer <code>&lt;figure&gt;</code>, reicht eines von beiden: <code>&lt;caption&gt;</code> oder <code>&lt;figcaption&gt;</code>.','If the caption shouldn’t be visible, hide it with an <code>.sr-only</code> class – never with <code>display: none</code>, which takes it from the screen reader too. If the table sits in a <code>&lt;figure&gt;</code>, one of the two is enough: <code>&lt;caption&gt;</code> or <code>&lt;figcaption&gt;</code>.')});

const dbDrinks=(head,rowCell)=>`<table class="table"><caption>${tx('Kaffeekarte','Coffee menu')}</caption>${head}<tbody><tr>${rowCell(tx('Espresso','Espresso'),true)}<td>${EUR(2.4)}</td><td>${EUR(3.2)}</td></tr><tr>${rowCell(tx('Cappuccino','Cappuccino'))}<td>${EUR(3.5)}</td><td>${EUR(4.3)}</td></tr></tbody></table>`;
const dbDrinkHead=cell=>`<thead><tr>${cell(tx('Getränk','Drink'))}${cell(tx('Klein','Small'),true)}${cell(tx('Groß','Large'))}</tr></thead>`;
HTMLA.push({id:'th-scope',cat:'tables',name:'<th scope>',sub:tx('Kopfzellen für Spalten und Zeilen','Header cells for columns and rows'),mdn:'Elements/th#scope',keys:'th td kopfzelle header spalte zeile column row screenreader tabelle',
 desc:tx('<code>&lt;th&gt;</code> ist eine Kopfzelle, <code>scope</code> sagt, wofür sie gilt: <code>col</code> für die Spalte darunter, <code>row</code> für die Zeile daneben. Screenreader lesen beim Wechsel in eine andere Spalte oder Zeile diese Überschrift mit – nur Fettschrift reicht dafür nicht.','<code>&lt;th&gt;</code> is a header cell, <code>scope</code> says what it applies to: <code>col</code> for the column below, <code>row</code> for the row beside it. Screen readers read this header along when moving to another column or row – bold text alone doesn’t do that.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[[tx('nur <td>','only <td>'),dbDrinks(`<thead><tr>${[tx('Getränk','Drink'),tx('Klein','Small'),tx('Groß','Large')].map((x,i)=>`<td class="bold"${i===1?' data-ha-hl':''}>${x}</td>`).join('')}</tr></thead>`,x=>`<td>${x}</td>`),tx('Sieht aus wie eine Überschrift, ist aber eine normale Zelle (<code>cell</code>). Springt man mit <kbd>Strg</kbd>+<kbd>Alt</kbd>+<kbd>→</kbd> zu „3,20 €“, sagt der Screenreader nur den Preis – nicht „Groß“.','Looks like a header but is an ordinary cell (<code>cell</code>). Jumping to “€3.20” with <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>→</kbd>, the screen reader only says the price – not “Large”.')],
  ['scope="col"',dbDrinks(dbDrinkHead((x,hl)=>`<th scope="col"${hl?' data-ha-hl':''}>${x}</th>`),x=>`<td>${x}</td>`),tx('Rolle <code>columnheader</code>. Beim Spaltenwechsel sagt NVDA jetzt „Groß, 3,20 €“.','Role <code>columnheader</code>. When changing columns NVDA now says “Large, €3.20”.')],
  ['+ scope="row"',dbDrinks(dbDrinkHead(x=>`<th scope="col">${x}</th>`),(x,hl)=>`<th scope="row"${hl?' data-ha-hl':''}>${x}</th>`),tx('Rolle <code>rowheader</code>. Auch beim Zeilenwechsel kommt die Überschrift mit: „Cappuccino, 4,30 €“.','Role <code>rowheader</code>. The header now also comes along when changing rows: “Cappuccino, €4.30”.')]],
 tip:tx('Ohne <code>scope</code> raten Browser anhand der Position, ob ein <code>&lt;th&gt;</code> für Spalte oder Zeile gilt – meist richtig, aber nicht immer. <code>scope</code> kostet ein Wort und macht es eindeutig. Für die Zelle links oben (über den Zeilenköpfen) ist ein leeres <code>&lt;td&gt;</code> oder ein <code>&lt;th&gt;</code> mit Text wie „Getränk“ richtig.','Without <code>scope</code> browsers guess from the position whether a <code>&lt;th&gt;</code> applies to a column or a row – usually right, but not always. <code>scope</code> costs one word and makes it unambiguous. For the top-left cell (above the row headers) use an empty <code>&lt;td&gt;</code> or a <code>&lt;th&gt;</code> with text like “Drink”.')});

const dbOrderRows=`<tr><td>${tx('Notizbuch','Notebook')}</td><td>2</td><td>${EUR(9.8)}</td></tr><tr><td>${tx('Füller','Fountain pen')}</td><td>1</td><td>${EUR(24)}</td></tr>`,dbOrderFoot=`<tr><th scope="row" colspan="2">${tx('Summe','Total')}</th><td>${EUR(33.8)}</td></tr>`;
const dbOrderHead=`<tr><th scope="col">${tx('Artikel','Item')}</th><th scope="col">${tx('Menge','Qty')}</th><th scope="col">${tx('Preis','Price')}</th></tr>`;
HTMLA.push({id:'thead-tbody-tfoot',cat:'tables',name:'<thead> <tbody> <tfoot>',sub:tx('Kopf, Körper und Fuß einer Tabelle','Head, body and foot of a table'),mdn:'Elements/tbody',keys:'tabelle zeilengruppe row group summe total kopfzeile fußzeile sticky drucken',
 desc:tx('Die drei Zeilengruppen teilen eine Tabelle in Kopf, Daten und Fuß (etwa eine Summe). Das hilft beim Stylen (<code>thead th { position: sticky }</code>), beim Drucken (viele Browser wiederholen den Kopf auf jeder Seite) und Screenreadern beim Einordnen.','The three row groups split a table into head, data and foot (such as a total). That helps with styling (<code>thead th { position: sticky }</code>), printing (many browsers repeat the head on every page) and helps screen readers make sense of it.'),
 mode:'html',
 vals:[[tx('nur <tr>','only <tr>'),`<table class="table">${dbOrderHead}${dbOrderRows}${dbOrderFoot}</table>`,tx('Geschrieben ohne Gruppen – aber im Code (der aus dem Live-DOM kommt) steht ein <code>&lt;tbody&gt;</code>: Der Parser fügt es selbst ein. Deshalb trifft <code>table &gt; tr</code> in CSS nie.','Written without groups – yet the code (which comes from the live DOM) shows a <code>&lt;tbody&gt;</code>: the parser inserts it by itself. That’s why <code>table &gt; tr</code> never matches in CSS.')],
  ['thead tbody tfoot',`<table class="table"><thead>${dbOrderHead}</thead><tbody>${dbOrderRows}</tbody><tfoot>${dbOrderFoot}</tfoot></table>`,tx('Drei Gruppen, jede für sich stylebar – hier ist der Fuß mit einer Linie abgesetzt.','Three groups, each styleable on its own – here the foot is set off with a line.')],
  [tx('<tfoot> zuerst','<tfoot> first'),`<table class="table"><thead>${dbOrderHead}</thead><tfoot>${dbOrderFoot}</tfoot><tbody>${dbOrderRows}</tbody></table>`,tx('Im Code steht <code>&lt;tfoot&gt;</code> vor <code>&lt;tbody&gt;</code>, angezeigt wird es trotzdem unten. HTML 4 verlangte diese Reihenfolge, heute gehört <code>&lt;tfoot&gt;</code> ans Ende – sonst hören Screenreader die Summe vor den Daten.','In the code <code>&lt;tfoot&gt;</code> comes before <code>&lt;tbody&gt;</code>, yet it’s still shown at the bottom. HTML 4 required this order; today <code>&lt;tfoot&gt;</code> belongs at the end – otherwise screen readers hear the total before the data.')]],
 tip:tx('Mehrere <code>&lt;tbody&gt;</code> sind erlaubt und praktisch, um Abschnitte zu gruppieren (etwa pro Monat). Aber nur ein <code>&lt;thead&gt;</code> und ein <code>&lt;tfoot&gt;</code>. In Angular mit <code>@for</code> gehört die Schleife in <code>&lt;tbody&gt;</code>, nicht um die ganze Tabelle.','Several <code>&lt;tbody&gt;</code> elements are allowed and handy for grouping sections (e.g. per month). But only one <code>&lt;thead&gt;</code> and one <code>&lt;tfoot&gt;</code>. In Angular with <code>@for</code> the loop goes inside <code>&lt;tbody&gt;</code>, not around the whole table.')});

const dbPlan=(r1,r2)=>`<table class="table"><caption>${tx('Kursplan','Class schedule')}</caption><thead><tr><th scope="col">${tx('Zeit','Time')}</th><th scope="col">${tx('Mo','Mon')}</th><th scope="col">${tx('Di','Tue')}</th><th scope="col">${tx('Mi','Wed')}</th></tr></thead><tbody><tr><th scope="row">9:00</th>${r1}</tr><tr><th scope="row">10:00</th>${r2}</tr></tbody></table>`;
const WS=tx('Workshop','Workshop'),YO='Yoga',PI='Pilates';
HTMLA.push({id:'colspan-rowspan',cat:'tables',name:'colspan / rowspan',sub:tx('Zellen verbinden','Merging cells'),mdn:'Elements/td#colspan',keys:'zellen verbinden merge span spalten zeilen tabelle',
 desc:tx('<code>colspan</code> lässt eine Zelle über mehrere Spalten laufen, <code>rowspan</code> über mehrere Zeilen. Wichtig: Jede Zelle, die überdeckt wird, muss aus dem Markup verschwinden – sonst verrutscht die Tabelle.','<code>colspan</code> makes a cell run across several columns, <code>rowspan</code> across several rows. Important: every cell that gets covered must disappear from the markup – otherwise the table shifts.'),
 mode:'html',
 vals:[[tx('ohne','none'),dbPlan(`<td>${WS}</td><td>${WS}</td><td>${YO}</td>`,`<td>${PI}</td><td>${PI}</td><td>${YO}</td>`),tx('Jede Stunde eine eigene Zelle – der Workshop steht zweimal da.','One cell per slot – the workshop appears twice.')],
  ['colspan="2"',dbPlan(`<td colspan="2" data-ha-hl>${WS}</td><td>${YO}</td>`,`<td>${PI}</td><td>${PI}</td><td>${YO}</td>`),tx('Eine Zelle über Mo und Di, dafür ist die Di-Zelle der 9-Uhr-Zeile weg.','One cell across Mon and Tue, and the Tue cell of the 9:00 row is gone.')],
  ['rowspan="2"',dbPlan(`<td rowspan="2" data-ha-hl>${WS}</td><td>${PI}</td><td>${YO}</td>`,`<td>${PI}</td><td>${YO}</td>`),tx('Der Workshop läuft am Montag von 9 bis 11. Die 10-Uhr-Zeile hat eine Zelle weniger – ihre erste <code>&lt;td&gt;</code> landet automatisch unter „Di“.','The workshop runs on Monday from 9 to 11. The 10:00 row has one cell fewer – its first <code>&lt;td&gt;</code> automatically lands under “Tue”.')],
  [tx('colspan, Zelle vergessen','colspan, cell left in'),dbPlan(`<td colspan="2" data-ha-hl>${WS}</td><td>${WS}</td><td>${YO}</td>`,`<td>${PI}</td><td>${PI}</td><td>${YO}</td>`),tx('Der typische Fehler: <code>colspan</code> gesetzt, die überdeckte Zelle aber drin gelassen. Die Zeile hat jetzt fünf Spalten und ragt rechts heraus.','The classic mistake: <code>colspan</code> set, but the covered cell left in. The row now has five columns and sticks out on the right.')]],
 tip:tx('Verbundene Zellen sind für Screenreader schwerer zu verstehen – nutze sie für echte Überschneidungen, nicht fürs Layout. Und zähl nach: Jede Zeile muss (inklusive <code>colspan</code> und hereinragender <code>rowspan</code>) dieselbe Spaltenzahl ergeben.','Merged cells are harder to follow for screen readers – use them for real overlaps, not for layout. And count: every row must add up to the same number of columns (including <code>colspan</code> and <code>rowspan</code> reaching in from above).')});

const hid=s=>'ha-headers-id-'+s;
const dbTemps=[['mo',tx('Mo','Mon'),[8,14,6,13]],['di',tx('Di','Tue'),[9,17,7,15]]];
HTMLA.push({id:'headers-id',cat:'tables',name:'headers',sub:tx('Kopfzellen für komplexe Tabellen','Header cells for complex tables'),mdn:'Elements/td#headers',keys:'headers id komplexe tabelle mehrstufig kopfzeile colgroup screenreader',
 desc:tx('Hat eine Tabelle mehrstufige Köpfe (hier Stadt, dann Min/Max), reicht <code>scope</code> oft nicht mehr. Dann listet <code>headers</code> an jeder Datenzelle die IDs aller Kopfzellen auf, die zu ihr gehören.','When a table has multi-level headers (here city, then min/max), <code>scope</code> often isn’t enough. Then <code>headers</code> on each data cell lists the IDs of all header cells that belong to it.'),
 stage:`<table class="table"><caption>${tx('Temperatur in °C','Temperature in °C')}</caption><thead><tr><td></td><th id="${hid('wien')}" colspan="2">${tx('Wien','Vienna')}</th><th id="${hid('graz')}" colspan="2">Graz</th></tr><tr><td></td><th id="${hid('wmin')}">Min</th><th id="${hid('wmax')}">Max</th><th id="${hid('gmin')}">Min</th><th id="${hid('gmax')}">Max</th></tr></thead><tbody>${dbTemps.map(([k,d,n])=>`<tr><th id="${hid(k)}">${d}</th>${n.map((x,i)=>`<td data-ha-h="${hid(i<2?'wien':'graz')} ${hid(['wmin','wmax','gmin','gmax'][i])} ${hid(k)}"${k==='di'&&i===1?' data-ha-ex':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`,
 t:'td[data-ha-h]',attr:'headers',fresh:true,show:'table',
 vals:[[tx('ohne headers','no headers'),null,tx('Der Browser muss selbst herausfinden, welche Köpfe zur markierten Zelle gehören. Bei verbundenen Kopfzellen klappt das nicht in jedem Screenreader zuverlässig.','The browser has to work out which headers belong to the highlighted cell. With merged header cells that isn’t reliable in every screen reader.')],
  ['headers','…',tx('Jede Datenzelle nennt ihre Köpfe ausdrücklich. Der Screenreader sagt bei der markierten Zelle „Wien, Max, Di, 17“.','Every data cell names its headers explicitly. For the highlighted cell the screen reader says “Vienna, Max, Tue, 17”.')]],
 init(st,v){if(v.attrs.headers)$$('td[data-ha-h]',st).forEach(td=>td.setAttribute('headers',td.dataset.haH))},
 measure:st=>{const td=$('[data-ha-ex]',st),h=td.getAttribute('headers');return h?tx(`Markierte Zelle „${td.textContent}“ – Köpfe laut headers: ${h.split(' ').map(id=>document.getElementById(id)?.textContent).join(', ')}`,`Highlighted cell “${td.textContent}” – headers per headers: ${h.split(' ').map(id=>document.getElementById(id)?.textContent).join(', ')}`):tx(`Markierte Zelle „${td.textContent}“ – kein headers, die Zuordnung bleibt der Heuristik des Browsers überlassen.`,`Highlighted cell “${td.textContent}” – no headers, the mapping is left to the browser’s heuristics.`)},
 tip:tx('<code>headers</code> ist mühsam und fehleranfällig – jede ID muss stimmen. Oft ist die bessere Lösung, die Tabelle zu vereinfachen: zwei Tabellen (eine pro Stadt) mit einfachem <code>scope</code> sind für alle leichter zu lesen.','<code>headers</code> is tedious and error-prone – every ID has to be right. Often the better fix is simplifying the table: two tables (one per city) with plain <code>scope</code> are easier for everyone to read.')});

HTMLA.push({id:'table-presentation',cat:'tables',name:'role="presentation"',sub:tx('Layout-Tabellen stummschalten','Silencing layout tables'),mdn:'https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/presentation_role',keys:'layout tabelle e-mail newsletter role none presentation',
 desc:tx('Tabellen nur fürs Layout gibt es heute fast nur noch in HTML-E-Mails. <code>role="presentation"</code> (oder gleichbedeutend <code>role="none"</code>) nimmt ihnen die Tabellen-Semantik: Der Screenreader liest nur den Inhalt, ohne „Tabelle mit 1 Zeile und 2 Spalten“.','Tables used purely for layout are almost only found in HTML emails today. <code>role="presentation"</code> (or the equivalent <code>role="none"</code>) removes their table semantics: the screen reader reads just the content, without “table with 1 row and 2 columns”.'),
 stage:`<table class="ha-table-presentation-t"><tr><td><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7" cy="17" r="2" fill="currentColor"/><circle cx="17" cy="17" r="2" fill="currentColor"/></svg></td><td><strong>${tx('Dein Paket ist unterwegs','Your parcel is on its way')}</strong><br>${tx('Zustellung am Donnerstag zwischen 9 und 12 Uhr.','Delivery on Thursday between 9 and 12.')}</td></tr></table>`,
 t:'table',attr:'role',
 vals:[[tx('ohne role','no role'),null,tx('Für den Screenreader eine Datentabelle: „Tabelle mit 1 Zeile und 2 Spalten“, dann Zelle für Zelle – bei jeder Mail aufs Neue.','A data table to the screen reader: “table with 1 row and 2 columns”, then cell by cell – in every single email.')],
  ['presentation','presentation',tx('Nur noch der Inhalt kommt an: „Dein Paket ist unterwegs …“. Die Rolle wirkt auch auf die Zeilen und Zellen.','Only the content arrives: “Your parcel is on its way …”. The role also applies to the rows and cells.')],
  ['none','none',tx('Dasselbe wie <code>presentation</code>, nur der neuere, klarere Name. Beide werden überall verstanden.','The same as <code>presentation</code>, just the newer, clearer name. Both are understood everywhere.')]],
 tip:tx('In einer Layout-Tabelle haben <code>&lt;th&gt;</code>, <code>&lt;caption&gt;</code>, <code>scope</code> und <code>summary</code> nichts verloren – und umgekehrt gehört <code>role="presentation"</code> nie auf eine echte Datentabelle. Auf Webseiten nimm fürs Layout CSS Grid oder Flexbox.','<code>&lt;th&gt;</code>, <code>&lt;caption&gt;</code>, <code>scope</code> and <code>summary</code> have no place in a layout table – and conversely <code>role="presentation"</code> never goes on a real data table. On web pages, use CSS grid or flexbox for layout.')});

HTMLA.push({id:'colgroup-col',cat:'tables',name:'<colgroup> <col>',sub:tx('Ganze Spalten stylen – mit Grenzen','Styling whole columns – with limits'),mdn:'Elements/col',keys:'spalte column stylen breite hintergrund width background span',
 desc:tx('<code>&lt;col&gt;</code> in einem <code>&lt;colgroup&gt;</code> steht für eine Spalte (mit <code>span</code> für mehrere). Die Zellen liegen aber nicht <em>in</em> der Spalte – darum wirken dort nur vier CSS-Eigenschaften: <code>background</code>, <code>border</code>, <code>width</code> und <code>visibility</code>.','<code>&lt;col&gt;</code> inside a <code>&lt;colgroup&gt;</code> stands for one column (with <code>span</code> for several). But the cells don’t live <em>inside</em> the column – so only four CSS properties work there: <code>background</code>, <code>border</code>, <code>width</code> and <code>visibility</code>.'),
 stage:`<table class="table"><caption>${tx('Umsatz in Tsd. €','Revenue in k€')}</caption><colgroup><col><col></colgroup><thead><tr><th scope="col">${tx('Region','Region')}</th><th scope="col">Q1</th><th scope="col">Q2</th><th scope="col">Q3</th></tr></thead><tbody><tr><th scope="row">${tx('Nord','North')}</th><td>120</td><td>135</td><td>128</td></tr><tr><th scope="row">${tx('Süd','South')}</th><td>98</td><td>104</td><td>117</td></tr></tbody></table>`,
 t:'col + col',show:'colgroup',
 vals:[['background',{style:'background: var(--brand-soft)'},tx('Die ganze Q1-Spalte bekommt eine Hintergrundfarbe – ohne eine Klasse an jeder Zelle.','The whole Q1 column gets a background colour – without a class on every cell.')],

/* Serialisiert wie das Code-Panel, aber als Klartext: data-ha-as-src="x" wird als src="x" gezeigt,

function emSer(n,ind=''){

  if(n.nodeType!==1||n.hasAttribute('data-ha-hide'))return '';
  const tag=n.localName,at=[];
  for(const a of n.attributes){
    let k=a.name,v=a.value;
    if(k.startsWith('data-ha-as-'))k=k.slice(11);
    else if(k.startsWith('data-ha-')||n.hasAttribute('data-ha-as-'+k))continue;
    else v=emAlias(v);
    at.push(v===''&&k!=='alt'?k:`${k}="${v}"`);
  }
  const open=`<${tag}${at.length?' '+at.join(' '):''}>`;
  if(VOID.has(tag))return ind+open;
  const kids=[...n.childNodes].filter(c=>c.nodeType===1?!c.hasAttribute('data-ha-hide'):c.nodeType===3&&c.textContent.trim());
  if(tag==='svg'){const t=kids.filter(c=>c.nodeType===1&&/^(title|desc)$/.test(c.localName));return t.length?`${ind}${open}\n${t.map(c=>emSer(c,ind+'  ')).join('\n')}\n${ind}  …\n${ind}</svg>`:`${ind}${open}…</svg>`}
  if(!kids.length)return `${ind}${open}</${tag}>`;
  if(kids.every(c=>c.nodeType===3||(INLINE.has(c.localName)&&!c.children.length))){
    const inner=[...n.childNodes].map(c=>c.nodeType===3?c.textContent.replace(/\s+/g,' '):c.nodeType===1&&!c.hasAttribute('data-ha-hide')?emSer(c):'').join('').trim();
    if(inner.length<=90)return `${ind}${open}${inner}</${tag}>`;

function emWire(root,only){

function emBlobFrame(st,frame,bytes,onMsg){

 vals:[
  [tx('ohne','none'),{width:null,height:null,'data-ha-noauto':null},tx('Beim Laden ist das Bild 0 px hoch – dann schiebt es den Text nach unten. Stell dir vor, du wolltest gerade auf etwas darunter klicken.','While loading the image is 0 px tall – then it pushes the text down. Imagine you were just about to click something below it.')],
  ['width + height',{width:'640',height:'360','data-ha-noauto':null},tx('Der Platz ist von Anfang an da. Die Zahlen sind die echten Pixelmaße der Datei; die angezeigte Größe regelt das CSS.','The space is there from the start. The numbers are the file’s real pixel size; CSS controls the displayed size.')],
  [tx('ohne height: auto','no height: auto'),{width:'640',height:'360','data-ha-noauto':true},tx('Klassiker: <code>max-width: 100%</code> macht das Bild schmaler, aber <code>height="360"</code> gilt weiter als Höhe – das Bild wird verzerrt.','Classic mistake: <code>max-width: 100%</code> makes the image narrower but <code>height="360"</code> still applies as its height – the image gets distorted.')]
 ],
 measure:st=>{const img=$('img',st),s=st.dataset.haShift;
   if(s==null)return tx(`Bild lädt noch … reservierte Höhe: ${Math.round(img.getBoundingClientRect().height)} px`,`Image still loading … reserved height: ${Math.round(img.getBoundingClientRect().height)} px`);
   const r=img.getBoundingClientRect(),dist=Math.abs(r.width/r.height-16/9)>.05;
   return (+s?tx(`Der Text ist um ${s} px gesprungen`,`The text jumped by ${s} px`):tx('Der Text ist nicht gesprungen','The text did not jump'))+(dist?tx(` · verzerrt: ${Math.round(r.width)} × ${Math.round(r.height)} px statt 16 : 9`,` · distorted: ${Math.round(r.width)} × ${Math.round(r.height)} px instead of 16 : 9`):'');},
 init(st){
   const img=$('img',st),p=$('p',st);let t=0,free=()=>{};
   const run=()=>{
     clearTimeout(t);free();img.removeAttribute('src');delete st.dataset.haShift;
     const y0=p.offsetTop;
     t=setTimeout(()=>{img.addEventListener('load',()=>{st.dataset.haShift=p.offsetTop-y0},{once:true});free=emWire(st)},1200);
   };
   $('.ha-img-size-again',st).addEventListener('click',run);run();
   return ()=>{clearTimeout(t);free()};
 },
 code:st=>emSer($('img',st))+(`\n\n/* CSS */\nimg {\n  max-width: 100%;${$('img',st).hasAttribute('data-ha-noauto')?'':'\n  height: auto;'}\n}`),
 tip:tx('Die Attribute sind kein Widerspruch zu responsiven Bildern: Mit <code>height: auto</code> im CSS rechnet der Browser nur das Seitenverhältnis daraus (<code>aspect-ratio: 640 / 360</code>). Wo du die Maße nicht kennst, geht auch direkt <code>aspect-ratio</code> im CSS. Dasselbe gilt für <code>&lt;video&gt;</code> und <code>&lt;iframe&gt;</code>.','The attributes don’t fight responsive images: with <code>height: auto</code> in CSS the browser only derives the aspect ratio from them (<code>aspect-ratio: 640 / 360</code>). If you don’t know the size, use <code>aspect-ratio</code> in CSS directly. The same goes for <code>&lt;video&gt;</code> and <code>&lt;iframe&gt;</code>.')});

const EM_PH=emData('platzhalter',`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270"><rect width="480" height="270" fill="#E5E7EB"/><text x="240" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#374151">${tx('nicht geladen','not loaded')}</text></svg>`);
HTMLA.push({id:'img-loading',cat:'media',name:'loading',sub:tx('Bilder erst laden, wenn sie gebraucht werden','Load images only when they’re needed'),mdn:'Elements/img#loading',keys:'lazy loading eager faul später laden performance lcp scroll',
 desc:tx('<code>loading="lazy"</code> lädt ein Bild erst, wenn es in die Nähe des sichtbaren Bereichs kommt. Das spart Daten bei langen Seiten. Scroll in der Beispielseite (Maus, Touch oder mit Tab hinein und Pfeiltasten). <b>Simulation</b>: Der Atlas hat keine echten Bilddateien, darum zeigt die Vorschau nach, was der Browser tut – hier mit kleinem Vorlauf.','<code>loading="lazy"</code> only loads an image when it gets close to the visible area. That saves data on long pages. Scroll in the sample page (mouse, touch, or Tab into it and use the arrow keys). <b>Simulation</b>: the atlas has no real image files, so the preview replays what the browser does – here with a small look-ahead.'),
 stage:`<div class="ha-img-loading-view" tabindex="0" role="region" aria-label="${tx('Beispielseite zum Scrollen','Sample page to scroll')}"><p><b>${tx('Reisebericht: Drei Tage am Dachstein','Travel diary: three days in the Alps')}</b></p>${[1,2,3,4,5].map(i=>`<img src="${EM_PH}" width="480" height="270" data-ha-as-src="bild-${i}.jpg" alt="${[tx('Blick vom Gipfel ins Tal','View from the summit into the valley'),tx('Hütte im Nebel','Hut in the fog'),tx('Gletscher am Morgen','Glacier in the morning'),tx('Steig mit Seilsicherung','Path with fixed ropes'),tx('Sonnenuntergang über dem See','Sunset over the lake')][i-1]}"><p>${tx(`Tag ${Math.ceil(i/2)}: Weiter geht’s – noch ein Stück Text zwischen den Bildern.`,`Day ${Math.ceil(i/2)}: on we go – a bit more text between the images.`)}</p>`).join('')}</div>`,
 t:'.ha-img-loading-view img',fresh:true,
 vals:[[tx('ohne (eager)','none (eager)'),null,tx('Standard: Alle Bilder werden sofort geladen, auch die, die niemand je sieht.','Default: all images load right away, even the ones nobody ever sees.')],['lazy','lazy',tx('Nur die ersten Bilder kommen sofort. Scroll nach unten – die anderen laden kurz bevor sie sichtbar werden.','Only the first images come right away. Scroll down – the others load just before they become visible.')]],
 measure:st=>{const n=$$('img',st).filter(i=>i.dataset.haDone).length;return tx(`Geladen: ${n} von 5 Bildern · ${n*180} von 900 KB (Beispielwerte)`,`Loaded: ${n} of 5 images · ${n*180} of 900 KB (sample values)`)},
 init(st){
   const view=$('.ha-img-loading-view',st),frees=[];
   const load=img=>{if(img.dataset.haDone)return;img.dataset.haDone='1';frees.push(emWire(st,img))};
   const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){load(e.target);io.unobserve(e.target)}}),{root:view,rootMargin:'0px 0px 40px 0px'});
   $$('img',view).forEach(img=>img.getAttribute('loading')==='lazy'?io.observe(img):load(img));
   return ()=>{io.disconnect();frees.forEach(f=>f())};
 },
 code:st=>$$('img',st).slice(0,3).map(i=>emSer(i)).join('\n')+'\n…',
 tip:tx('Nie das erste große Bild (Hero, LCP-Element) lazy laden – der Browser wartet dann erst aufs Layout und das wichtigste Bild kommt später. Echte Browser laden mit großem Vorlauf: Chrome je nach Verbindung schon 1250–2500 px vor dem sichtbaren Bereich. <code>width</code>/<code>height</code> gehören dazu, sonst springt beim Nachladen alles. Gibt es auch für <code>&lt;iframe&gt;</code>.','Never lazy-load the first large image (hero, the LCP element) – the browser then waits for layout and the most important image arrives later. Real browsers load well ahead: Chrome starts 1250–2500 px before the visible area, depending on the connection. Add <code>width</code>/<code>height</code>, or everything jumps as images arrive. Also works on <code>&lt;iframe&gt;</code>.')});

HTMLA.push({id:'img-decoding',cat:'media',name:'decoding',sub:tx('Bild mit dem Text zeigen oder danach','Show the image with the text or after it'),mdn:'Elements/img#decoding',keys:'dekodieren decode async sync rendering frame flackern',
 desc:tx('Eine Bilddatei muss erst dekodiert (in Pixel entpackt) werden. <code>decoding</code> ist ein Hinweis, ob der Browser darauf warten soll, bevor er den Rest der Änderung zeigt. <b>Simulation</b> der zwei Frames nach dem Einfügen – der echte Unterschied liegt meist bei Millisekunden.','An image file has to be decoded (unpacked into pixels) first. <code>decoding</code> is a hint whether the browser should wait for that before showing the rest of the update. <b>Simulation</b> of the two frames after inserting – the real difference is usually milliseconds.'),
 stage:`<div class="ha-img-decoding"><img alt="${tx('Berge im Abendlicht','Mountains in the evening light')}" width="640" height="360" data-ha-as-src="foto-deko.jpg"><div class="ha-img-decoding-frames" data-ha-hide></div></div>`,
 t:'img',fresh:true,
 vals:[[tx('ohne (auto)','none (auto)'),null,tx('Der Browser entscheidet selbst. Für fast alle Bilder richtig.','The browser decides by itself. Right for almost every image.')],['async','async',tx('Text und Layout erscheinen sofort, das Bild einen Moment später.','Text and layout appear right away, the image a moment later.')],['sync','sync',tx('Der Browser zeigt Text und Bild gemeinsam – dafür erscheint die ganze Änderung etwas später.','The browser shows text and image together – so the whole update appears a little later.')]],
 measure:st=>tx(`img.decoding = "${$('img',st).decoding}"`,`img.decoding = "${$('img',st).decoding}"`),
 init(st){
   const d=$('img',st).getAttribute('decoding')||'auto',free=emWire(st);
   const fr=(n,txt,img)=>`<div class="ha-img-decoding-frame"><span class="ha-em-cap">Frame ${n}</span><div class="ha-img-decoding-mini">${txt?'<i></i><i></i><i class="s"></i>':'<b>…</b>'}${img===1?'<em class="on"></em>':img===0?'<em></em>':''}</div></div>`;
   $('.ha-img-decoding-frames',st).innerHTML=d==='sync'?fr(1,false)+fr(2,true,1):d==='async'?fr(1,true,0)+fr(2,true,1):`<p class="ha-em-cap">${tx('auto: je nach Bild und Browser wie async oder sync','auto: like async or sync, depending on image and browser')}</p>`;
   return free;
 },
 code:st=>emSer($('img',st)),
 tip:tx('Für normale Bilder im HTML kannst du das Attribut weglassen. Nützlich ist die JavaScript-Variante: <code>await img.decode()</code> vor dem Einfügen verhindert, dass ein großes Bild kurz leer oder halb gezeichnet erscheint – etwa bei Galerien oder beim Tauschen eines Vorschaubilds.','For normal images in HTML you can leave the attribute out. The JavaScript variant is the useful one: <code>await img.decode()</code> before inserting prevents a large image from appearing briefly empty or half drawn – e.g. in galleries or when swapping a thumbnail.')});

const EM_FP={
  auto:[[[2,5,'low','Low'],[5,9,'dl','High']],[[2,8,'low']],[[2,9,'low']],9],
  high:[[[2,7,'dl','High']],[[2,9,'low']],[[2,10,'low']],7],

};
HTMLA.push({id:'img-fetchpriority',cat:'media',name:'fetchpriority',sub:tx('Das wichtigste Bild zuerst','The most important image first'),mdn:'Elements/img#fetchpriority',keys:'priorität priority lcp hero laden high low wasserfall waterfall',
 desc:tx('Bilder starten mit niedriger Priorität – der Browser weiß erst nach dem Layout, welches sichtbar ist. <code>fetchpriority="high"</code> sagt ihm vorher: Dieses Bild ist das große, wichtige (meist das LCP-Element). In allen großen Browsern seit 2024. <b>Simulation</b> mit erfundenen Zeiten.','Images start at low priority – the browser only knows after layout which ones are visible. <code>fetchpriority="high"</code> tells it up front: this image is the big, important one (usually the LCP element). In all major browsers since 2024. <b>Simulation</b> with made-up timings.'),
 stage:`<div class="ha-img-fp"><img alt="${tx('Neue Kaffeesorte: Hochland-Röstung','New coffee: highland roast')}" width="480" height="200" data-ha-as-src="hero.jpg"><div class="ha-em-sim" data-ha-hide></div></div>`,
 t:'img',fresh:true,
 vals:[[tx('ohne (auto)','none (auto)'),null,tx('Das Hero-Bild teilt sich die Leitung mit den kleinen Bildern und wird erst nach dem Layout hochgestuft.','The hero image shares the connection with the small images and is only upgraded after layout.')],['high','high',tx('Das Hero-Bild bekommt von Anfang an Vorrang – das wichtigste Bild ist früher da.','The hero image gets priority from the start – the most important image arrives sooner.')],['low','low',tx('Für Bilder, die nicht zählen, etwa in einem noch geschlossenen Karussell. Beim Hero-Bild falsch.','For images that don’t matter, e.g. in a carousel that isn’t open yet. Wrong for the hero image.')]],
 measure:st=>{const k=$('img',st).getAttribute('fetchpriority')||'auto';return tx(`Hero-Bild (LCP) fertig bei t = ${EM_FP[k][3]} (Simulation)`,`Hero image (LCP) done at t = ${EM_FP[k][3]} (simulation)`)},
 init(st){
   const f=EM_FP[$('img',st).getAttribute('fetchpriority')||'auto'],free=emWire(st);
   emPlay(st,emTimeline(12,[['index.html',[[0,2,'dl']]],['style.css',[[2,5,'dl']]],['hero.jpg',f[0]],['thumb-1.jpg',f[1]],['thumb-2.jpg',f[2]]],[[f[3],'LCP']],[['dl',EM_LEG.dl],['low',EM_LEG.low]]));
   return free;
 },
 code:st=>emSer($('img',st))+'\n<img src="thumb-1.jpg" alt="…" loading="lazy">\n<img src="thumb-2.jpg" alt="…" loading="lazy">',
 tip:tx('Sparsam einsetzen: Wenn alles <code>high</code> ist, ist nichts mehr wichtig. Meist genau ein Bild pro Seite. Kombiniert mit <code>loading="lazy"</code> ergibt es keinen Sinn. <code>fetchpriority</code> gibt es auch auf <code>&lt;link rel="preload"&gt;</code>, <code>&lt;script&gt;</code> und in <code>fetch()</code>. Angular: <code>NgOptimizedImage</code> mit <code>priority</code> setzt es für dich.','Use sparingly: if everything is <code>high</code>, nothing is important any more. Usually exactly one image per page. Combining it with <code>loading="lazy"</code> makes no sense. <code>fetchpriority</code> also exists on <code>&lt;link rel="preload"&gt;</code>, <code>&lt;script&gt;</code> and in <code>fetch()</code>. Angular: <code>NgOptimizedImage</code> with <code>priority</code> sets it for you.')});

const emImgMeasure=st=>{const i=$('img',st),f=EM_NAMES[i.currentSrc];if(!f)return tx('Bild lädt …','Image loading …');

HTMLA.push({id:'img-srcset-x',cat:'media',name:'srcset (x)',sub:tx('Schärfere Bilder für hochauflösende Displays','Sharper images for high-density screens'),mdn:'Elements/img#srcset',keys:'retina hidpi pixeldichte density 2x responsive bilder',
 desc:tx('Mit <code>x</code>-Angaben bietest du dasselbe Bild in mehreren Pixeldichten an. Der Browser nimmt die, die zu <code>devicePixelRatio</code> passt – bei festen Anzeigegrößen wie Logos oder Avataren. Die Demo-Bilder sind beschriftet, damit du siehst, welche Datei gewählt wurde.','With <code>x</code> descriptors you offer the same image in several pixel densities. The browser picks the one that matches <code>devicePixelRatio</code> – for fixed display sizes like logos or avatars. The demo images are labelled so you can see which file was chosen.'),
 stage:`<div class="ha-em-box"><img alt="${tx('Kaffeerösterei Bergblick','Bergblick coffee roasters')}" width="200" height="100"></div>`,

 vals:[
  ['src',{'data-ha-as-src':'logo-200.png','data-ha-as-srcset':null},tx('Eine Datei für alle. Auf einem Display mit doppelter Pixeldichte wird sie hochgerechnet und wirkt unscharf.','One file for everyone. On a double-density display it gets upscaled and looks blurry.')],
  ['srcset 2x',{'data-ha-as-src':'logo-200.png','data-ha-as-srcset':'logo-400.png 2x'},tx('<code>src</code> zählt automatisch als <code>1x</code>. Bei <code>devicePixelRatio</code> 2 (die meisten Handys, Retina) kommt die 400-px-Datei.','<code>src</code> automatically counts as <code>1x</code>. At <code>devicePixelRatio</code> 2 (most phones, Retina) the 400 px file is used.')],
  ['1x, 2x, 3x',{'data-ha-as-src':'logo-200.png','data-ha-as-srcset':'logo-200.png 1x, logo-400.png 2x, logo-600.png 3x'},tx('Probier es aus: Browser-Zoom auf 200 % stellen und neu laden – dann ist <code>devicePixelRatio</code> 2 und die Messung zeigt die 2x-Datei.','Try it: set the browser zoom to 200 % and reload – then <code>devicePixelRatio</code> is 2 and the measurement shows the 2x file.')]
 ],
 measure:emImgMeasure,
 init:st=>emWire(st),
 code:st=>emSer($('img',st)),
 tip:tx('Die angezeigte Größe bleibt gleich (hier 200 px), nur die Datei ist schärfer. Hat der Browser eine größere Datei schon im Cache, darf er auch die nehmen. Für Bilder, die mit dem Layout breiter und schmaler werden, sind <code>w</code>-Angaben mit <code>sizes</code> besser.','The displayed size stays the same (200 px here), only the file is sharper. If the browser already has a larger file cached, it may use that instead. For images that grow and shrink with the layout, <code>w</code> descriptors with <code>sizes</code> are the better tool.')});

const EM_SET='foto-400.jpg 400w, foto-800.jpg 800w, foto-1600.jpg 1600w';
HTMLA.push({id:'img-srcset-w',cat:'media',name:'srcset + sizes',sub:tx('Die passende Bildgröße für jedes Layout','The right image size for every layout'),mdn:'Elements/img#sizes',keys:'responsive images breite width descriptor w sizes auto viewport datenmenge',
 desc:tx('Mit <code>w</code>-Angaben nennst du die echte Breite jeder Datei, mit <code>sizes</code>, wie breit das Bild im Layout wird. Daraus und aus der Pixeldichte rechnet der Browser, welche Datei reicht – bevor er das CSS kennt.','With <code>w</code> descriptors you state each file’s real width, with <code>sizes</code> how wide the image will be in the layout. From that and the pixel density the browser works out which file is enough – before it knows the CSS.'),
 stage:`<div class="ha-em-box"><img alt="${tx('Kaffeebohnen in der Röstmaschine','Coffee beans in the roaster')}" width="1600" height="800"></div>`,
 t:'img',fresh:true,
 vals:[
  [tx('ohne sizes','no sizes'),{'data-ha-as-src':'foto-800.jpg','data-ha-as-srcset':EM_SET,sizes:null,loading:null},tx('Ohne <code>sizes</code> nimmt der Browser an: so breit wie das ganze Fenster (<code>100vw</code>). Bei breitem Fenster lädt er die größte Datei – für ein Bild, das nur 280 px breit ist.','Without <code>sizes</code> the browser assumes: as wide as the whole window (<code>100vw</code>). With a wide window it loads the largest file – for an image that is only 280 px wide.')],
  ['sizes="280px"',{'data-ha-as-src':'foto-800.jpg','data-ha-as-srcset':EM_SET,sizes:'280px',loading:null},tx('Jetzt weiß der Browser: 280 px reichen. Bei Pixeldichte 1 nimmt er die 400w-Datei, bei 2 die 800w-Datei.','Now the browser knows: 280 px is enough. At pixel density 1 it takes the 400w file, at 2 the 800w file.')],
  [tx('sizes mit Media','sizes with media'),{'data-ha-as-src':'foto-800.jpg','data-ha-as-srcset':EM_SET,sizes:'(max-width: 600px) 100vw, 50vw',loading:null},tx('Die erste passende Bedingung zählt: bis 600 px Fensterbreite volle Breite, sonst halbe. Zieh das Fenster schmaler und wieder breiter.','The first matching condition wins: up to 600 px window width full width, otherwise half. Make the window narrower and wider again.')],
  ['sizes="auto"',{'data-ha-as-src':'foto-800.jpg','data-ha-as-srcset':EM_SET,sizes:'auto, 280px',loading:'lazy'},tx('Neu (Chromium seit 2024, noch nicht überall): Bei <code>loading="lazy"</code> kennt der Browser das Layout schon und misst selbst. Ältere Browser überspringen <code>auto</code> und nehmen den Wert danach.','New (Chromium since 2024, not everywhere yet): with <code>loading="lazy"</code> the browser already knows the layout and measures itself. Older browsers skip <code>auto</code> and use the value after it.')]
 ],
 measure:emImgMeasure,
 init:st=>emWire(st),
 code:st=>emSer($('img',st)),
 tip:tx('<code>sizes</code> ist eine Schätzung vor dem CSS – sie muss nicht aufs Pixel stimmen, aber grob. Wird das Bild wieder breiter, lädt der Browser nach; wird es schmaler, behält er meist die größere Datei. Angular: <code>NgOptimizedImage</code> erzeugt <code>srcset</code> automatisch, <code>sizes</code> musst du selbst angeben.','<code>sizes</code> is an estimate made before CSS – it doesn’t have to be pixel-perfect, but roughly right. If the image gets wider, the browser loads more; if it gets narrower, it usually keeps the larger file. Angular: <code>NgOptimizedImage</code> generates <code>srcset</code> automatically, you still set <code>sizes</code> yourself.')});

HTMLA.push({id:'picture',cat:'media',name:'<picture> / <source>',sub:tx('Anderer Bildausschnitt, anderes Format','Different crop, different format'),mdn:'Elements/picture',keys:'art direction bildausschnitt avif webp format media dark mode reduced motion fallback',

   return tx(`document.compatMode = "${m}" → ${m==='BackCompat'?'Quirks-Modus':'Standardmodus'} · Tabellenschrift ${td}`,`document.compatMode = "${m}" → ${m==='BackCompat'?'quirks mode':'standards mode'} · table font ${td}`)},
 init(st){
   delete st.dataset.haRes;const k=$('.ha-em-cfg',st).getAttribute('data-ha-dt');
   const doc=EM_DT[k]+EM_DT_BODY()+`<\x73cript>parent.postMessage({em:1,m:document.compatMode,td:getComputedStyle(td).fontSize},'*')<\/script></html>`;
   return emBlobFrame(st,$('iframe',st),doc,d=>{st.dataset.haRes=d.m+'|'+d.td});
 },
 code:st=>{const k=$('.ha-em-cfg',st).getAttribute('data-ha-dt');return (EM_DT[k]?EM_DT[k]+'\n':'')+'<html lang="'+LANG+'">\n<head>\n  <meta charset="utf-8">\n  <style>\n    body { font-size: 20px }\n    .brand { color: c2410c }  /* '+tx('ohne # – ungültig','no # – invalid')+' */\n  </style>\n</head>\n…'},
 tip:tx('Quirks-Modus ändert mehr als diese zwei Dinge: Höhenangaben in Prozent, Zeilenhöhen, Box-Modell mancher Formularelemente. Moderne Frameworks (auch Angulars <code>index.html</code>) haben den Doctype drin – er fehlt eher in handgebauten Seiten, E-Mails und generierten Berichten. <code>&lt;iframe srcdoc&gt;</code>-Dokumente sind übrigens immer im Standardmodus.','Quirks mode changes more than these two things: percentage heights, line heights, the box model of some form controls. Modern frameworks (Angular’s <code>index.html</code> too) include the doctype – it tends to be missing in hand-built pages, emails and generated reports. <code>&lt;iframe srcdoc&gt;</code> documents, by the way, are always in standards mode.')});

HTMLA.push({id:'meta-charset',cat:'head',name:'<meta charset>',sub:tx('Umlaute ohne Zeichensalat','Umlauts without mojibake'),mdn:'Elements/meta#charset',keys:'charset utf-8 encoding zeichensatz kodierung umlaute mojibake zeichensalat windows-1252',
 desc:tx('Sagt dem Browser, wie er die Bytes der Datei in Zeichen übersetzt. Die Datei in der Vorschau ist immer als UTF-8 gespeichert – wird sie anders gelesen, wird aus „ü“ „Ã¼“. Die Vorschau ist echt: ein Dokument aus echten Bytes im iframe.','Tells the browser how to turn the file’s bytes into characters. The file in the preview is always saved as UTF-8 – read any other way, “ü” becomes “Ã¼”. The preview is real: a document made of real bytes in an iframe.'),
 stage:`<div class="ha-em-cfg" hidden></div><iframe class="ha-em-frame ha-meta-charset-frame" sandbox="allow-scripts" title="${tx('Beispieldokument','Sample document')}"></iframe>`,
 t:'.ha-em-cfg',attr:'data-ha-cs',fresh:true,
 vals:[
  ['utf-8','utf-8',tx('Passt zur Datei: Umlaute, ß, € und Emoji kommen richtig an.','Matches the file: umlauts, ß, € and emoji come through correctly.')],
  ['windows-1252','windows-1252',tx('Falsche Angabe: Jedes Zeichen außerhalb von ASCII wird zu zwei oder drei falschen Zeichen.','Wrong declaration: every character outside ASCII turns into two or three wrong characters.')],
  [tx('ohne','none'),null,tx('Keine Angabe: Der Browser muss raten, meist nach der Sprache des Systems. Was dein Browser gewählt hat, zeigt die Messung.','No declaration: the browser has to guess, usually based on the system language. The measurement shows what your browser chose.')]
 ],
 measure:st=>st.dataset.haCs?tx(`Datei: UTF-8-Bytes · Browser liest sie als ${st.dataset.haCs}${/utf-8/i.test(st.dataset.haCs)?' ✓':' → Zeichensalat'}`,`File: UTF-8 bytes · browser reads them as ${st.dataset.haCs}${/utf-8/i.test(st.dataset.haCs)?' ✓':' → mojibake'}`):tx('Dokument lädt …','Document loading …'),
 init(st){
   delete st.dataset.haCs;const cs=$('.ha-em-cfg',st).getAttribute('data-ha-cs');
   const doc=`<!doctype html><html lang="${LANG}"><head>${cs?`<meta charset="${cs}">`:''}<style>body{font:18px/1.4 system-ui,sans-serif;margin:10px;background:#fff;color:#1A1A1A}small{color:#555}</style></head><body><p>${tx('Grüße aus Köln – Äpfel kosten 3 €.','Café crème for 3 € – très bon, naïve!')}</p><p><small id="c"></small></p><\x73cript>c.textContent='document.characterSet: '+document.characterSet;parent.postMessage({em:1,cs:document.characterSet},'*')<\/script></html>`;
   return emBlobFrame(st,$('iframe',st),new TextEncoder().encode(doc),d=>{st.dataset.haCs=d.cs});
 },
 code:st=>{const cs=$('.ha-em-cfg',st).getAttribute('data-ha-cs');return `<!doctype html>\n<html lang="${LANG}">\n<head>\n${cs?`  <meta charset="${cs}">\n`:''}  <title>…</title>\n</head>\n<body>\n  <p>${tx('Grüße aus Köln – Äpfel kosten 3 €.','Café crème for 3 € – très bon, naïve!')}</p>`},
 tip:tx('<code>&lt;meta charset="utf-8"&gt;</code> muss in den ersten 1024 Bytes stehen – am besten als erstes Element im <code>&lt;head&gt;</code>, vor dem <code>&lt;title&gt;</code>. Schickt der Server einen <code>Content-Type</code>-Header mit <code>charset</code>, gewinnt der; eine Byte-Order-Mark (BOM) am Dateianfang gewinnt vor beidem. In HTML ist UTF-8 die einzige erlaubte Kodierung.','<code>&lt;meta charset="utf-8"&gt;</code> must appear within the first 1024 bytes – ideally as the first element in <code>&lt;head&gt;</code>, before the <code>&lt;title&gt;</code>. If the server sends a <code>Content-Type</code> header with <code>charset</code>, that wins; a byte order mark (BOM) at the start of the file beats both. UTF-8 is the only encoding HTML allows.')});

HTMLA.push({id:'meta-viewport',cat:'head',name:'<meta name="viewport">',sub:tx('Handy-Layout statt verkleinerter Desktopseite','Phone layout instead of a shrunken desktop page'),mdn:'https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag',keys:'viewport mobile responsive device-width zoom user-scalable maximum-scale handy phone',
 desc:tx('Ohne Viewport-Angabe tun mobile Browser so, als wäre das Display rund 980 px breit, und verkleinern die ganze Seite – Media Queries greifen nicht, Text ist winzig. <b>Simulation</b>: Diese Einstellung wirkt nur für eine ganze Seite, darum zeigt ein nachgebautes Handy (360 px breit) den Effekt.','Without a viewport declaration mobile browsers pretend the screen is about 980 px wide and shrink the whole page – media queries don’t kick in, text is tiny. <b>Simulation</b>: this setting only works for a whole page, so a mock phone (360 px wide) shows the effect.'),
 stage:`<div class="ha-em-cfg" hidden></div><div class="ha-meta-viewport-wrap"><div class="ha-em-phone"><div class="ha-meta-viewport-screen"><div class="ha-meta-viewport-page"><div class="ha-meta-viewport-head">Bergblick</div><p>${tx('Frisch gerösteter Kaffee aus dem Salzkammergut, jeden Dienstag neu. Bestellung bis 12 Uhr, Versand am selben Tag.','Freshly roasted coffee from the Alps, new every Tuesday. Order by noon, shipped the same day.')}</p><span class="ha-meta-viewport-btn">${tx('In den Warenkorb','Add to cart')}</span></div></div></div><button type="button" class="btn btn-secondary ha-meta-viewport-zoom">${ic('plus')} ${tx('Mit zwei Fingern zoomen','Pinch to zoom')}</button></div>`,
 t:'.ha-em-cfg',attr:'content',fresh:true,
 vals:[
  [tx('ohne','none'),null,tx('Die Seite wird in 980 px Breite gebaut und auf 360 px geschrumpft: 16-px-Text erscheint wie 6 px. Zoomen hilft, aber dann muss man seitlich scrollen.','The page is laid out at 980 px and shrunk to 360 px: 16 px text looks like 6 px. Zooming helps, but then you have to scroll sideways.')],
  ['width=device-width',"width=device-width, initial-scale=1",tx('Richtig: Layout-Breite = Gerätebreite. Media Queries greifen, Text hat seine echte Größe, Zoomen geht weiter.','Correct: layout width = device width. Media queries apply, text has its real size, zooming still works.')],
  ['user-scalable=no',"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no",tx(`Sperrt das Zoomen – für Menschen mit Sehschwäche ein Hindernis, verstößt gegen ${emW('1.4.4')}. Probier den Zoom-Knopf.`,`Blocks zooming – an obstacle for people with low vision and a failure of ${emW('1.4.4')}. Try the zoom button.`)]
 ],
 measure:st=>{const c=$('.ha-em-cfg',st).getAttribute('content')||'',dw=/device-width/.test(c),z=+(st.dataset.haZoom||1),px=16*(dw?1:360/980)*z,lock=/user-scalable\s*=\s*(no|0)|maximum-scale\s*=\s*1(\.0*)?\b/.test(c);
   return tx(`Layout-Breite ${dw?360:980} px · 16-px-Text wirkt wie ${emNum(px)} px · Zoom ${z*100} % · Zoomen ${lock?'gesperrt':'erlaubt'}`,`Layout width ${dw?360:980} px · 16 px text looks like ${emNum(px)} px · zoom ${z*100} % · zooming ${lock?'blocked':'allowed'}`)},
 init(st){
   const c=$('.ha-em-cfg',st).getAttribute('content')||'',dw=/device-width/.test(c),lock=/user-scalable\s*=\s*(no|0)|maximum-scale\s*=\s*1(\.0*)?\b/.test(c);
   const page=$('.ha-meta-viewport-page',st),btn=$('.ha-meta-viewport-zoom',st);let z=1;
   const set=()=>{page.style.width=(dw?360:980)+'px';page.style.transform=`scale(${(dw?160/360:160/980)*z})`;st.dataset.haZoom=z};
   btn.addEventListener('click',()=>{if(lock){toast({msg:tx('Simulation: Zoomen ist durch den Viewport gesperrt.','Simulation: zooming is blocked by the viewport.'),type:'error'});return}z=z===1?2:1;set()});
   set();
 },
 code:st=>{const c=$('.ha-em-cfg',st).getAttribute('content');return c?`<meta name="viewport" content="${c}">`:tx('<\!-- kein viewport-Meta -->','<\!-- no viewport meta -->')},
 tip:tx('Safari auf dem iPhone ignoriert <code>user-scalable=no</code> seit iOS 10, Chrome auf Android hat dafür eine Bedienungshilfe-Einstellung – trotzdem nicht setzen, es hilft niemandem. Gegen den Auto-Zoom von iOS beim Fokus in Eingabefelder hilft stattdessen eine Schriftgröße von mindestens 16 px im Feld.','Safari on iPhone has ignored <code>user-scalable=no</code> since iOS 10 and Chrome on Android has an accessibility setting to override it – still don’t set it, it helps nobody. To stop iOS auto-zooming when an input gets focus, use a font size of at least 16 px in the field instead.')});

HTMLA.push({id:'title',cat:'head',name:'<title>',sub:tx('Der Name der Seite im Tab','The page’s name in the tab'),mdn:'Elements/title',keys:'title titel tab seitentitel page title seo screenreader lesezeichen',
 desc:tx(`Der <code>&lt;title&gt;</code> steht im Tab, in Lesezeichen, im Verlauf und als Überschrift in Suchergebnissen. Screenreader lesen ihn beim Seitenwechsel als Erstes vor. Er muss Thema oder Zweck der Seite nennen (${emW('2.4.2')}). <b>Simulation</b> einer Tab-Leiste mit drei offenen Rechnungen.`,`The <code>&lt;title&gt;</code> shows in the tab, bookmarks, history and as the headline in search results. Screen readers read it first when a page changes. It must name the page’s topic or purpose (${emW('2.4.2')}). <b>Simulation</b> of a tab bar with three open invoices.`),
 stage:`<div class="ha-em-cfg" hidden></div><div class="ha-title-bar" aria-hidden="true"></div>`,
 t:'.ha-em-cfg',attr:'data-ha-title',fresh:true,
 vals:[
  [tx('konkret zuerst','specific first'),'good',tx('Das Unterscheidende steht vorne, die Marke hinten – auch in schmalen Tabs sieht man, welche Rechnung welche ist.','The distinguishing part comes first, the brand last – even in narrow tabs you can see which invoice is which.')],
  [tx('überall gleich','same everywhere'),'same',tx('Jede Seite heißt gleich. Drei Tabs, drei Lesezeichen, drei Verlaufseinträge – nicht zu unterscheiden.','Every page has the same title. Three tabs, three bookmarks, three history entries – impossible to tell apart.')],
  [tx('Marke zuerst','brand first'),'brand',tx('Technisch ein guter Titel, aber die Marke frisst den Platz: Im Tab ist das Wichtige abgeschnitten, der Screenreader liest jedes Mal erst den Firmennamen.','Technically a good title, but the brand eats the space: in the tab the important part is cut off, and the screen reader reads the company name first every time.')],
  [tx('ohne','none'),'none',tx('Ohne <code>&lt;title&gt;</code> zeigt der Browser die Adresse. Ungültiges HTML und ein Fehler nach 2.4.2.','Without <code>&lt;title&gt;</code> the browser shows the address. Invalid HTML and a failure of 2.4.2.')]
 ],
 measure:st=>{const t=$('.ha-title-tab.on .ha-title-text',st)?.textContent||'';return tx(`Screenreader beim Laden: „${t}“`,`Screen reader on load: “${t}”`)},
 init(st){
   const k=$('.ha-em-cfg',st).getAttribute('data-ha-title'),inv=tx('Rechnung','Invoice');
   const title=n=>({good:`${inv} 2026-0${n} – ${tx('Kundenportal','Customer portal')} – Bergblick`,same:`${tx('Kundenportal','Customer portal')} – Bergblick`,brand:`${tx('Kaffeerösterei Bergblick GmbH','Bergblick Coffee Roasters Ltd')} | ${tx('Kundenportal','Customer portal')} | ${tx('Rechnungen','Invoices')} | ${inv} 2026-0${n}`,none:`bergblick.example/portal/${tx('rechnungen','invoices')}/2026-0${n}`})[k];
   $('.ha-title-bar',st).innerHTML=[29,30,31].map(n=>`<div class="ha-title-tab${n===31?' on':''}"><span class="ha-title-fav"></span><span class="ha-title-text">${esc(title(n))}</span></div>`).join('');
 },
 code:st=>{const t=$('.ha-title-tab.on .ha-title-text',st)?.textContent||'';return $('.ha-em-cfg',st).getAttribute('data-ha-title')==='none'?tx('<head>\n  <meta charset="utf-8">\n  <\!-- kein <title> -->\n</head>','<head>\n  <meta charset="utf-8">\n  <\!-- no <title> -->\n</head>'):`<head>\n  <meta charset="utf-8">\n  <title>${t}</title>\n</head>`},
 tip:tx('Single-Page-Apps wechseln die Seite ohne Neuladen – der Titel muss trotzdem mitwechseln. In Angular geht das über <code>title</code> in der Route (<code>{ path: \'rechnungen/:id\', title: … }</code>) oder den <code>Title</code>-Service. Muster: <em>Seite – Bereich – Marke</em>. Fehlermeldungen gehören auch hinein: „Fehler: Rechnung nicht gefunden – …“.','Single-page apps change pages without reloading – the title still has to change with them. In Angular use <code>title</code> on the route (<code>{ path: \'invoices/:id\', title: … }</code>) or the <code>Title</code> service. Pattern: <em>page – section – brand</em>. Errors belong in it too: “Error: invoice not found – …”.')});

const EM_SCRIPT={
  none:[[[0,2,'parse'],[2,9,'block'],[9,17,'parse']],[[2,7,'dl'],[7,8,'ex']],[[2,4,'dl'],[8,9,'ex']],null,17,'a.js → b.js'],
  defer:[[[0,10,'parse']],[[2,7,'dl'],[10,11,'ex']],[[2,4,'dl'],[11,12,'ex']],null,12,'a.js → b.js'],
  async:[[[0,4,'parse'],[4,5,'block'],[5,7,'parse'],[7,8,'block'],[8,12,'parse']],[[2,7,'dl'],[7,8,'ex']],[[2,4,'dl'],[4,5,'ex']],null,12,'b.js → a.js'],
  module:[[[0,10,'parse']],[[2,7,'dl'],[10,11,'ex']],[[2,4,'dl'],[11,12,'ex']],[[7,8,'dl']],12,'c.js → a.js → b.js'],
  modasync:[[[0,4,'parse'],[4,5,'block'],[5,8,'parse'],[8,9,'block'],[9,12,'parse']],[[2,7,'dl'],[8,9,'ex']],[[2,4,'dl'],[4,5,'ex']],[[7,8,'dl']],12,'b.js → c.js → a.js']
};
const emScriptKey=el=>{const m=el.getAttribute('type')==='module',a=el.hasAttribute('async');return m?(a?'modasync':'module'):a?'async':el.hasAttribute('defer')?'defer':'none'};
HTMLA.push({id:'script-defer',cat:'head',name:'async / defer / module',sub:tx('Wann ein Skript lädt und läuft','When a script loads and runs'),mdn:'Elements/script#defer',keys:'script async defer type module parser blockieren render blocking domcontentloaded dcl laden reihenfolge',
 desc:tx('Ein normales <code>&lt;script src&gt;</code> hält das Parsen des HTML an, bis es geladen und ausgeführt ist. <code>defer</code>, <code>async</code> und <code>type="module"</code> laden parallel und führen zu anderen Zeitpunkten aus. <b>Simulation</b> mit zwei Skripten: <code>a.js</code> ist groß, <code>b.js</code> klein. Zeiten erfunden, Reihenfolge echt.','A normal <code>&lt;script src&gt;</code> stops HTML parsing until it has loaded and run. <code>defer</code>, <code>async</code> and <code>type="module"</code> download in parallel and run at different moments. <b>Simulation</b> with two scripts: <code>a.js</code> is large, <code>b.js</code> small. Timings made up, order real.'),
 stage:`<div class="ha-em-cfg" hidden></div><div class="ha-em-sim"></div>`,
 t:'.ha-em-cfg',fresh:true,
 vals:[
  [tx('ohne','none'),{defer:null,async:null,type:null},tx('Der Parser bleibt stehen, bis <code>a.js</code> geladen und ausgeführt ist. <code>b.js</code> lädt der Browser dank Preload-Scanner schon mit, ausführen darf er es aber erst danach.','The parser stops until <code>a.js</code> has loaded and run. Thanks to the preload scanner the browser already fetches <code>b.js</code> as well, but may only run it afterwards.')],
  ['defer',{defer:true,async:null,type:null},tx('Laden parallel, ausführen erst nach dem Parsen – in der Reihenfolge im HTML, vor <code>DOMContentLoaded</code>. Die richtige Wahl für fast alle Skripte.','Download in parallel, run only after parsing – in document order, before <code>DOMContentLoaded</code>. The right choice for almost every script.')],
  ['async',{defer:null,async:true,type:null},tx('Jedes Skript läuft, sobald es da ist – das kleine <code>b.js</code> überholt <code>a.js</code>. Gut für Unabhängiges wie Analytics, schlecht, wenn Skripte aufeinander aufbauen.','Each script runs as soon as it arrives – the small <code>b.js</code> overtakes <code>a.js</code>. Good for independent things like analytics, bad when scripts depend on each other.')],
  ['type="module"',{defer:null,async:null,type:'module'},tx('Module verhalten sich wie <code>defer</code>. Dazu lädt der Browser alle <code>import</code>-Abhängigkeiten (hier <code>c.js</code> aus <code>a.js</code>) und führt sie vorher aus.','Modules behave like <code>defer</code>. The browser also fetches all <code>import</code> dependencies (here <code>c.js</code> from <code>a.js</code>) and runs them first.')],
  ['module async',{defer:null,async:true,type:'module'},tx('Ein Modul mit <code>async</code> läuft, sobald es samt Abhängigkeiten geladen ist – unabhängig von der Reihenfolge.','A module with <code>async</code> runs as soon as it and its dependencies have loaded – regardless of order.')]
 ],
 measure:st=>{const s=EM_SCRIPT[emScriptKey($('.ha-em-cfg',st))];return tx(`Ausführung: ${s[5]} · DOMContentLoaded bei t = ${s[4]} (Simulation)`,`Execution: ${s[5]} · DOMContentLoaded at t = ${s[4]} (simulation)`)},
 init(st){
   const s=EM_SCRIPT[emScriptKey($('.ha-em-cfg',st))],rows=[['HTML',s[0]],['a.js',s[1]],['b.js',s[2]]];
   if(s[3])rows.push(['c.js',s[3]]);
   emPlay(st,emTimeline(18,rows,[[s[4],'DOMContentLoaded']],[['parse',EM_LEG.parse],['dl',EM_LEG.dl],['ex',EM_LEG.ex],['block',EM_LEG.block]]));
 },
 code:st=>{const el=$('.ha-em-cfg',st),m=el.getAttribute('type')==='module',f=(m?' type="module"':'')+(el.hasAttribute('async')?' async':'')+(el.hasAttribute('defer')?' defer':'');
   return `<head>\n  <\x73cript src="a.js"${f}><\/script>  <\!-- 200 KB${m?', import \'./c.js\'':''} -->\n  <\x73cript src="b.js"${f}><\/script>  <\!-- 5 KB -->\n</head>`},
 tip:tx('<code>async</code> und <code>defer</code> wirken nur bei Skripten mit <code>src</code> – bei Inline-Skripten werden sie ignoriert (Ausnahme: <code>async</code> bei Inline-Modulen). <code>defer</code> bei <code>type="module"</code> ist überflüssig. Angular CLI baut <code>main.js</code> schon als <code>type="module"</code> ein. Ein klassisches Skript am Ende von <code>&lt;body&gt;</code> ist der alte Trick für dasselbe – <code>defer</code> im <code>&lt;head&gt;</code> ist besser, weil der Download früher startet.','<code>async</code> and <code>defer</code> only work on scripts with <code>src</code> – they’re ignored on inline scripts (exception: <code>async</code> on inline modules). <code>defer</code> on <code>type="module"</code> is redundant. Angular CLI already includes <code>main.js</code> as <code>type="module"</code>. A classic script at the end of <code>&lt;body&gt;</code> is the old trick for the same thing – <code>defer</code> in <code>&lt;head&gt;</code> is better because the download starts earlier.')});

const emLinkRows=k=>{
  const font={none:[[7,10,'conn','DNS·TCP·TLS'],[10,12,'dl']],preconnect:[[3,6,'conn','DNS·TCP·TLS'],[7,9,'dl']],'dns-prefetch':[[3,4,'conn','DNS'],[7,9,'conn','TCP·TLS'],[9,11,'dl']],preload:[[3,6,'conn','DNS·TCP·TLS'],[6,8,'dl']]}[k]||[[7,10,'conn','DNS·TCP·TLS'],[10,12,'dl']];
  const rows=[['index.html',[[0,3,'dl']]],['style.css',[[3,7,'dl']]],['app.js',[[3,6,'dl']]],['chart.js',k==='modulepreload'?[[3,6,'dl']]:[[6,9,'dl']]],['font.woff2 ↗',font]];
  if(k==='prefetch')rows.push(['next.html',[[12,14,'low','idle']]]);
  const app=k==='modulepreload'?6:9,text=font[font.length-1][1];
  return {rows,app,text};
};
HTMLA.push({id:'link-rel',cat:'head',name:'<link rel="preload">',sub:tx('Dem Browser früher Bescheid sagen','Tell the browser earlier'),mdn:'Attributes/rel',keys:'preload preconnect dns-prefetch prefetch modulepreload resource hints wasserfall waterfall schrift font performance',
 desc:tx('Manche Dateien entdeckt der Browser spät: die Schrift erst im CSS, das Modul erst im <code>import</code>. Resource Hints im <code>&lt;head&gt;</code> sagen es ihm vorher. <b>Simulation</b> eines Ladewasserfalls; ↗ = anderer Server, Zeiten erfunden.','The browser discovers some files late: the font only inside the CSS, the module only in an <code>import</code>. Resource hints in the <code>&lt;head&gt;</code> tell it up front. <b>Simulation</b> of a loading waterfall; ↗ = another server, timings made up.'),
 stage:`<div class="ha-em-cfg" hidden></div><div class="ha-em-sim"></div>`,
 t:'.ha-em-cfg',attr:'rel',fresh:true,
 vals:[
  [tx('ohne','none'),null,tx('Die Schrift von <code>fonts.example.com</code> wird erst gesucht, wenn das CSS da ist – dann kommt noch der Verbindungsaufbau dazu.','The font from <code>fonts.example.com</code> is only requested once the CSS has arrived – and then the connection still has to be set up.')],
  ['preconnect','preconnect',tx('Verbindung zum Schriften-Server gleich am Anfang aufbauen. Die Datei selbst muss der Browser noch nicht kennen.','Set up the connection to the font server right at the start. The browser doesn’t need to know the file itself yet.')],
  ['dns-prefetch','dns-prefetch',tx('Nur die DNS-Abfrage vorziehen – billiger als <code>preconnect</code>, bringt weniger. Guter Rückfall für viele Domains.','Only do the DNS lookup early – cheaper than <code>preconnect</code>, gains less. A good fallback for many domains.')],
  ['preload','preload',tx('Die Schrift selbst sofort laden, mit hoher Priorität. Braucht die genaue URL, <code>as</code> und bei Schriften immer <code>crossorigin</code>.','Load the font itself right away, at high priority. Needs the exact URL, <code>as</code>, and for fonts always <code>crossorigin</code>.')],
  ['modulepreload','modulepreload',tx('Lädt <code>chart.js</code> parallel zu <code>app.js</code>, statt erst beim <code>import</code> darauf zu stoßen. Die App startet früher.','Loads <code>chart.js</code> alongside <code>app.js</code> instead of discovering it at the <code>import</code>. The app starts earlier.')],
