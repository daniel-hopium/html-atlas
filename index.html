  [tx('Datum','date'),tx('<p>Das Hoffest ist am <time datetime="2026-10-03" data-ha-hl>Samstag, 3. Oktober</time>.</p>','<p>The farm party is on <time datetime="2026-10-03" data-ha-hl>Saturday, 3 October</time>.</p>'),tx('Format <code>JJJJ-MM-TT</code>. Der sichtbare Text darf „Samstag“ sagen – die Maschine bekommt das Jahr dazu.','Format <code>YYYY-MM-DD</code>. The visible text may say “Saturday” – the machine also gets the year.')],
  [tx('mit Uhrzeit','with time'),tx('<p>Einlass ab <time datetime="2026-10-03T19:30+02:00" data-ha-hl>19:30 Uhr</time>.</p>','<p>Doors open at <time datetime="2026-10-03T19:30+02:00" data-ha-hl>7:30 pm</time>.</p>'),tx('Datum, <code>T</code>, Uhrzeit und Zeitzone. Mit Zeitzone ist der Zeitpunkt weltweit eindeutig.','Date, <code>T</code>, time and time zone. With a time zone the moment is unambiguous worldwide.')],
  [tx('Dauer','duration'),tx('<p>Die Führung dauert <time datetime="PT1H30M" data-ha-hl>eineinhalb Stunden</time>.</p>','<p>The tour takes <time datetime="PT1H30M" data-ha-hl>an hour and a half</time>.</p>'),tx('Dauern beginnen mit <code>P</code> (period), Uhrzeitanteile mit <code>T</code>: <code>PT1H30M</code>.','Durations start with <code>P</code> (period), time parts with <code>T</code>: <code>PT1H30M</code>.')],
  [tx('ohne datetime','no datetime'),'<p>'+tx('Stand: ','Updated: ')+'<time data-ha-hl>2026-09-30</time></p>',tx('Ohne <code>datetime</code> muss der Inhalt selbst im Maschinenformat stehen.','Without <code>datetime</code> the content itself must be in the machine format.')],
  [tx('falsch','wrong'),tx('<p>Das Hoffest ist am <time datetime="03.10.2026" data-ha-hl>3. Oktober</time>.</p>','<p>The farm party is on <time datetime="10/03/2026" data-ha-hl>3 October</time>.</p>'),tx('Das deutsche Datumsformat ist kein gültiger Wert – der Browser meldet keinen Fehler, die Maschine versteht einfach nichts.','A regional date format is not a valid value – the browser shows no error, machines just don’t understand it.')]
 ],
 measure:st=>{const t=$('time',st);if(!t)return '';const raw=(t.getAttribute('datetime')??t.textContent).trim(),r=atxTime(raw);return r?tx(`Maschine liest: ${r}`,`Machine reads: ${r}`):tx(`Maschine liest: nichts – „${raw}“ ist kein gültiges Format`,`Machine reads: nothing – “${raw}” is not a valid format`)},
 tip:tx('<code>&lt;time&gt;</code> formatiert nichts – der Browser zeigt den Inhalt genau so, wie er dasteht. In Angular: <code>&lt;time [attr.datetime]="d.toISOString()"&gt;{{ d | date:\'longDate\' }}&lt;/time&gt;</code>. Ein Datum ohne Zeitzone („schwebend“) ist richtig für Dinge wie „Geschäft öffnet um 9:00“, die überall Ortszeit meinen.','<code>&lt;time&gt;</code> formats nothing – the browser shows the content exactly as written. In Angular: <code>&lt;time [attr.datetime]="d.toISOString()"&gt;{{ d | date:\'longDate\' }}&lt;/time&gt;</code>. A time without a zone (“floating”) is right for things like “shop opens at 9:00” that mean local time everywhere.')});

HTMLA.push({id:'code',cat:'text',name:'<code> / <kbd> / <samp> / <var>',sub:tx('Code, Tasten, Ausgaben, Variablen','Code, keys, output, variables'),mdn:'Elements/code',keys:'code quelltext tastatur keyboard taste shortcut ausgabe output samp variable var pre monospace',
 desc:tx('Vier Elemente für technischen Text: <code>&lt;code&gt;</code> für Quelltext, <code>&lt;kbd&gt;</code> für Tastatureingaben, <code>&lt;samp&gt;</code> für Ausgaben eines Programms, <code>&lt;var&gt;</code> für Variablen in Formeln oder Befehlen.','Four elements for technical text: <code>&lt;code&gt;</code> for source code, <code>&lt;kbd&gt;</code> for keyboard input, <code>&lt;samp&gt;</code> for a program’s output, <code>&lt;var&gt;</code> for variables in formulas or commands.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<code>',tx('<p>Führe <code data-ha-hl>npm install</code> im Projektordner aus.</p>','<p>Run <code data-ha-hl>npm install</code> in the project folder.</p>'),tx('Rolle <code>code</code>. Screenreader lesen den Text normal, oft ohne Hinweis auf Code.','Role <code>code</code>. Screen readers read the text normally, often without mentioning it’s code.')],
  ['<kbd>',tx('<p>Kopieren mit <kbd data-ha-hl>Strg</kbd> + <kbd>C</kbd>.</p>','<p>Copy with <kbd data-ha-hl>Ctrl</kbd> + <kbd>C</kbd>.</p>'),tx('Eine Taste pro <code>&lt;kbd&gt;</code>. Das Aussehen als Taste kommt aus dem CSS dieser Seite, Browser zeigen <code>&lt;kbd&gt;</code> nur in Monospace.','One key per <code>&lt;kbd&gt;</code>. The key look comes from this page’s CSS; browsers only render <code>&lt;kbd&gt;</code> in monospace.')],
  ['<samp>','<p>'+tx('Git antwortet: ','Git replies: ')+'<samp data-ha-hl>nothing to commit, working tree clean</samp></p>',tx('Was das Programm ausgibt – nicht, was man eintippt.','What the program outputs – not what you type.')],
  ['<var>',tx('<p>Die Fläche ist <var data-ha-hl>b</var> × <var>h</var>.</p>','<p>The area is <var data-ha-hl>w</var> × <var>h</var>.</p>'),tx('Browser setzen <code>&lt;var&gt;</code> kursiv. Für echte Formeln gibt es MathML (<code>&lt;math&gt;</code>).','Browsers render <code>&lt;var&gt;</code> in italics. For real formulas there’s MathML (<code>&lt;math&gt;</code>).')],
  ['<pre><code>','<pre class="ha-code-pre"><code data-ha-hl>if (user) {\n  greet(user);\n}</code></pre>',tx('Mehrzeiliger Code: <code>&lt;pre&gt;</code> erhält Leerzeichen und Zeilenumbrüche, <code>&lt;code&gt;</code> sagt, dass es Code ist.','Multi-line code: <code>&lt;pre&gt;</code> keeps spaces and line breaks, <code>&lt;code&gt;</code> says it’s code.')]
 ],
 tip:tx('In <code>&lt;pre&gt;</code> zählt jedes Leerzeichen – auch die Einrückung deines Templates. Und <code>&lt;</code> im Code muss als <code>&amp;lt;</code> stehen, sonst hält der Browser es für ein Tag. In Angular brauchen auch <code>{</code> und <code>}</code> Escaping (<code>{{ \'{\' }}</code> oder <code>ngNonBindable</code>).','Inside <code>&lt;pre&gt;</code> every space counts – including your template’s indentation. And <code>&lt;</code> in code must be written as <code>&amp;lt;</code>, or the browser treats it as a tag. In Angular, <code>{</code> and <code>}</code> need escaping too (<code>{{ \'{\' }}</code> or <code>ngNonBindable</code>).')});

HTMLA.push({id:'quotes',cat:'text',name:'<q> / <blockquote> / <cite>',sub:tx('Zitate und ihre Quelle','Quotes and their source'),mdn:'Elements/blockquote',keys:'zitat quote anführungszeichen quotation marks quelle source cite',
 desc:tx('<code>&lt;q&gt;</code> ist ein kurzes Zitat im Satz – der Browser setzt die Anführungszeichen selbst, passend zur Sprache. <code>&lt;blockquote&gt;</code> ist ein Zitat als eigener Block. <code>&lt;cite&gt;</code> ist der Titel eines Werks.','<code>&lt;q&gt;</code> is a short quote inside a sentence – the browser adds the quotation marks itself, matching the language. <code>&lt;blockquote&gt;</code> is a quote as its own block. <code>&lt;cite&gt;</code> is the title of a work.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<q>',tx('<p>Die Kundin schrieb: <q data-ha-hl>Kam schneller als gedacht.</q></p>','<p>The customer wrote: <q data-ha-hl>Arrived faster than expected.</q></p>'),tx('Die Anführungszeichen stehen nicht im HTML – sie kommen aus dem CSS des Browsers.','The quotation marks aren’t in the HTML – they come from the browser’s CSS.')],
  ['<q> + lang',`<p lang="de">Deutsch: <q>Danke!</q></p><p lang="en">English: <q data-ha-hl>Thanks!</q></p><p lang="fr">Français: <q>Merci !</q></p>`,tx('Dasselbe Element, drei Sprachen, drei Arten Anführungszeichen. Deshalb nie selbst tippen, wenn du <code>&lt;q&gt;</code> nimmst – sonst stehen sie doppelt.','The same element, three languages, three kinds of quotation marks. So never type them yourself when you use <code>&lt;q&gt;</code> – you’d get them twice.')],
  ['<blockquote cite>',`<figure class="ha-quotes-fig"><blockquote cite="https://example.com/reviews/4711" data-ha-hl><p>${tx('Endlich ein Shop, den ich mit dem Screenreader ohne Hilfe bedienen kann.','Finally a shop I can use with my screen reader without help.')}</p></blockquote><figcaption>— Petra K., <cite>${tx('Kundenbewertungen 2026','Customer reviews 2026')}</cite></figcaption></figure>`,tx('Rolle <code>blockquote</code>. Das <code>cite</code>-Attribut (die Quell-URL) zeigt der Browser nirgends an. Wer die Quelle sichtbar will, schreibt sie in eine <code>&lt;figcaption&gt;</code> – außerhalb des <code>&lt;blockquote&gt;</code>, denn dort steht nur das Zitierte.','Role <code>blockquote</code>. The <code>cite</code> attribute (the source URL) isn’t displayed anywhere. If you want the source visible, put it in a <code>&lt;figcaption&gt;</code> – outside the <code>&lt;blockquote&gt;</code>, which holds only the quoted text.')],
  ['<cite>',tx('<p>Mehr dazu im Buch <cite data-ha-hl>Inclusive Design Patterns</cite> von Heydon Pickering.</p>','<p>More on this in the book <cite data-ha-hl>Inclusive Design Patterns</cite> by Heydon Pickering.</p>'),tx('<code>&lt;cite&gt;</code> ist der Titel des Werks – Buch, Film, Artikel, Song. Der Name der Person gehört laut Standard nicht hinein.','<code>&lt;cite&gt;</code> is the title of the work – book, film, article, song. According to the standard, the person’s name doesn’t go inside it.')]
 ],
 tip:tx('<code>&lt;blockquote&gt;</code> nur für echte Zitate, nicht zum Einrücken – dafür gibt es <code>margin</code>. Und <code>&lt;cite&gt;</code> ist kein Autorenfeld: <code>&lt;cite&gt;Heydon Pickering&lt;/cite&gt;</code> ist laut WHATWG falsch, weil ein Name kein Werktitel ist.','Use <code>&lt;blockquote&gt;</code> only for real quotes, not for indenting – that’s what <code>margin</code> is for. And <code>&lt;cite&gt;</code> isn’t an author field: <code>&lt;cite&gt;Heydon Pickering&lt;/cite&gt;</code> is wrong per WHATWG, because a name isn’t the title of a work.')});

HTMLA.push({id:'del-ins',cat:'text',name:'<del> / <ins> / <s>',sub:tx('Gestrichen, eingefügt, überholt','Deleted, inserted, outdated'),mdn:'Elements/del',keys:'durchgestrichen strikethrough gelöscht deleted eingefügt inserted änderung edit alter preis old price',
 desc:tx('<code>&lt;del&gt;</code> und <code>&lt;ins&gt;</code> zeigen Änderungen an einem Dokument, optional mit <code>datetime</code> und <code>cite</code> (Grund der Änderung). <code>&lt;s&gt;</code> ist Text, der nicht mehr stimmt, aber stehen bleibt – etwa ein alter Preis.','<code>&lt;del&gt;</code> and <code>&lt;ins&gt;</code> show edits to a document, optionally with <code>datetime</code> and <code>cite</code> (reason for the edit). <code>&lt;s&gt;</code> is text that’s no longer accurate but stays visible – an old price, for example.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<del> + <ins>',tx('<p>Treffpunkt: <del datetime="2026-09-28" data-ha-hl>Hauptbahnhof</del> <ins datetime="2026-09-28">Westbahnhof</ins></p>','<p>Meeting point: <del datetime="2026-09-28" data-ha-hl>Central Station</del> <ins datetime="2026-09-28">West Station</ins></p>'),tx('Rollen <code>deletion</code> und <code>insertion</code>. Ob der Screenreader „gelöscht“ und „eingefügt“ ansagt, hängt von Screenreader und Einstellungen ab.','Roles <code>deletion</code> and <code>insertion</code>. Whether the screen reader says “deleted” and “inserted” depends on the screen reader and its settings.')],
  ['<s>',tx('<p class="price"><s data-ha-hl>49 €</s> 39 €</p>','<p class="price"><s data-ha-hl>€49</s> €39</p>'),tx('Richtiges Element für den alten Preis. Aber hör hin: Ohne Ansage bleibt oft nur „49 € 39 €“ – welcher gilt?','The right element for the old price. But listen: without an announcement you often just hear “€49 €39” – which one applies?')],
  [tx('<s> + Text','<s> + text'),tx('<p class="price"><s data-ha-hl><span class="sr-only">Alter Preis: </span>49 €</s> <span class="sr-only">Neuer Preis: </span>39 €</p>','<p class="price"><s data-ha-hl><span class="sr-only">Old price: </span>€49</s> <span class="sr-only">New price: </span>€39</p>'),tx('Visuell versteckter Text macht es eindeutig – der Screenreader liest „Alter Preis: 49 €, Neuer Preis: 39 €“.','Visually hidden text makes it unambiguous – the screen reader reads “Old price: €49, New price: €39”.')],
  [tx('nur CSS','CSS only'),tx('<p class="price"><span class="line-through" data-ha-hl>49 €</span> 39 €</p>','<p class="price"><span class="line-through" data-ha-hl>€49</span> €39</p>'),tx('Durchgestrichen per CSS: sieht gleich aus, ist für jede Maschine normaler Text.','Struck through with CSS: looks the same, is plain text to every machine.')]
 ],
 tip:tx('<code>&lt;del&gt;</code> heißt „wurde aus dem Dokument entfernt“ (Änderungsverlauf), <code>&lt;s&gt;</code> heißt „stimmt nicht mehr“. Für den Streichpreis ist <code>&lt;s&gt;</code> richtig. Weil viele Screenreader beides nicht ansagen, gehört bei Preisen ein Hilfstext dazu.','<code>&lt;del&gt;</code> means “was removed from the document” (edit history), <code>&lt;s&gt;</code> means “no longer accurate”. For a struck-through price <code>&lt;s&gt;</code> is right. Because many screen readers announce neither, prices need a helper text.')});

HTMLA.push({id:'sub-sup',cat:'text',name:'<sub> / <sup>',sub:tx('Tief- und hochgestellt','Subscript and superscript'),mdn:'Elements/sup',keys:'hochgestellt tiefgestellt superscript subscript fußnote footnote exponent formel formula',
 desc:tx('<code>&lt;sub&gt;</code> und <code>&lt;sup&gt;</code> sind für typografische Konventionen, bei denen die Position zur Bedeutung gehört: chemische Formeln, Exponenten, Fußnotenzeichen. Nicht für Deko.','<code>&lt;sub&gt;</code> and <code>&lt;sup&gt;</code> are for typographic conventions where the position is part of the meaning: chemical formulas, exponents, footnote markers. Not for decoration.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<sub>',tx('<p>Wasser ist H<sub data-ha-hl>2</sub>O.</p>','<p>Water is H<sub data-ha-hl>2</sub>O.</p>'),tx('Rolle <code>subscript</code>. Viele Screenreader sagen die Position nicht an und lesen einfach „H 2 O“ – bei bekannten Formeln verständlich.','Role <code>subscript</code>. Many screen readers don’t announce the position and just read “H 2 O” – understandable for well-known formulas.')],
  ['<sup>',tx('<p>Die Wohnung hat 72 m<sup data-ha-hl>2</sup>.</p>','<p>The flat is 72 m<sup data-ha-hl>2</sup>.</p>'),tx('Ohne Ansage hört man „72 m 2“. Bei Einheiten geht auch das Zeichen <code>m²</code> direkt aus Unicode.','Without an announcement you hear “72 m 2”. For units the Unicode character <code>m²</code> works too.')],
  [tx('Fußnote','footnote'),tx('<p>Versand gratis<sup><a href="#ha-sub-sup-fn" aria-label="Fußnote 1" data-ha-hl>1</a></sup></p><p id="ha-sub-sup-fn" tabindex="-1"><small>1 Ab 50 € Bestellwert.</small></p>','<p>Free shipping<sup><a href="#ha-sub-sup-fn" aria-label="Footnote 1" data-ha-hl>1</a></sup></p><p id="ha-sub-sup-fn" tabindex="-1"><small>1 For orders from €50.</small></p>'),tx('Der Link springt zur Fußnote (probier’s mit der Tastatur). Nur „1“ als Name wäre dünn – <code>aria-label</code> macht „Fußnote 1“ daraus.','The link jumps to the footnote (try it with the keyboard). Just “1” as a name would be thin – <code>aria-label</code> makes it “Footnote 1”.')],
  [tx('als Deko','as decoration'),tx('<p>Dunkelmodus <sup data-ha-hl>NEU</sup></p>','<p>Dark mode <sup data-ha-hl>NEW</sup></p>'),tx('Falsch: Ein „Neu“-Badge ist Gestaltung, keine typografische Konvention. Dafür ein <code>&lt;span&gt;</code> mit CSS.','Wrong: a “new” badge is design, not a typographic convention. Use a <code>&lt;span&gt;</code> with CSS.')]
 ],
 init(st){
  const go=ev=>{const a=ev.target.closest('a[href="#ha-sub-sup-fn"]');if(!a)return;ev.preventDefault();$('#ha-sub-sup-fn',st)?.focus()};
  st.addEventListener('click',go);return ()=>st.removeEventListener('click',go);
 },
 tip:tx('<code>&lt;sup&gt;</code> vergrößert oft den Zeilenabstand der ganzen Zeile – mit <code>sup{line-height:0}</code> ist das behoben. Für echte Mathematik gibt es MathML (<code>&lt;math&gt;</code>, <code>&lt;msup&gt;</code>): seit 2023 in allen großen Browsern, und Screenreader lesen es als Formel.','<code>&lt;sup&gt;</code> often increases the line height of the whole line – <code>sup{line-height:0}</code> fixes that. For real maths there’s MathML (<code>&lt;math&gt;</code>, <code>&lt;msup&gt;</code>): in all major browsers since 2023, and screen readers read it as a formula.')});

HTMLA.push({id:'br-wbr',cat:'text',name:'<br> / <wbr>',sub:tx('Zeilenumbruch erzwingen oder erlauben','Force a line break or allow one'),mdn:'Elements/wbr',keys:'zeilenumbruch line break umbruch wrap silbentrennung hyphen shy lange wörter long words',
 desc:tx('<code>&lt;br&gt;</code> erzwingt einen Umbruch, der zum Inhalt gehört – Adresszeilen, Gedichtverse. <code>&lt;wbr&gt;</code> erlaubt einen Umbruch, falls der Platz nicht reicht. Die gestrichelte Box ist absichtlich schmal.','<code>&lt;br&gt;</code> forces a break that belongs to the content – address lines, lines of a poem. <code>&lt;wbr&gt;</code> allows a break in case there isn’t enough room. The dashed box is narrow on purpose.'),
 mode:'html',
 vals:[
  [tx('nichts','nothing'),`<div class="ha-br-wbr-box"><p data-ha-hl>${tx('Datei:','File:')} <code>bericht_final_v3_2026.pdf</code></p></div>`,tx('Ein „Wort“ ohne Leerzeichen und Bindestrich bricht nirgends um und ragt aus der Box.','A “word” without spaces or hyphens can’t break anywhere and sticks out of the box.')],
  ['<wbr>',`<div class="ha-br-wbr-box"><p data-ha-hl>${tx('Datei:','File:')} <code>bericht_<wbr>final_<wbr>v3_<wbr>2026.pdf</code></p></div>`,tx('An jedem <code>&lt;wbr&gt;</code> darf der Browser umbrechen – nur wenn nötig, und ohne Trennstrich.','The browser may break at every <code>&lt;wbr&gt;</code> – only when needed, and without a hyphen.')],
  ['&shy;',`<div class="ha-br-wbr-box"><p data-ha-hl>${tx('Das Barriere\u00ADfreiheits\u00ADstärkungs\u00ADgesetz','The European Accessi\u00ADbility Act and its require\u00ADments')}</p></div>`,tx('Das „weiche Trennzeichen“ <code>&amp;shy;</code> ist kein Element, aber der Bruder von <code>&lt;wbr&gt;</code>: Umbruch nur bei Bedarf – dann <em>mit</em> Trennstrich. Richtig für Wörter, <code>&lt;wbr&gt;</code> für URLs und Dateinamen.','The “soft hyphen” <code>&amp;shy;</code> isn’t an element but the sibling of <code>&lt;wbr&gt;</code>: breaks only when needed – then <em>with</em> a hyphen. Right for words; <code>&lt;wbr&gt;</code> for URLs and file names.')],
  ['<br>',`<div class="ha-br-wbr-box"><address data-ha-hl>Beispiel GmbH<br>Musterstraße 1<br>1010 Wien</address></div>`,tx('Richtig: Die Zeilen einer Adresse gehören zum Inhalt – sie wären auch in breiter Box getrennt.','Right: the lines of an address are part of the content – they’d be separate in a wide box too.')],
  ['<br><br>',`<div class="ha-br-wbr-box"><p data-ha-hl>${tx('Erster Absatz.','First paragraph.')}<br><br><br>${tx('Zweiter Absatz.','Second paragraph.')}</p></div>`,tx('Falsch: <code>&lt;br&gt;</code> als Abstandhalter. Das sind keine zwei Absätze, sondern einer mit Leerzeilen – Screenreader lesen sie teils als „leer“. Abstand macht <code>margin</code>, Absätze macht <code>&lt;p&gt;</code>.','Wrong: <code>&lt;br&gt;</code> as a spacer. That’s not two paragraphs but one with blank lines – some screen readers read them as “blank”. Spacing is <code>margin</code>, paragraphs are <code>&lt;p&gt;</code>.')]
 ],
 code:st=>atxPlain(st).replace(/\u00AD/g,'&shy;'),
 tip:tx('Für lange URLs oder Nutzereingaben, die du nicht selbst schreibst, hilft CSS: <code>overflow-wrap: anywhere</code> bricht notfalls mitten im Wort, <code>hyphens: auto</code> trennt nach Wörterbuch (braucht ein passendes <code>lang</code>). <code>&lt;wbr&gt;</code> und <code>&amp;shy;</code> sind für Stellen, die du genau kennst.','For long URLs or user input you don’t write yourself, CSS helps: <code>overflow-wrap: anywhere</code> breaks mid-word if needed, <code>hyphens: auto</code> hyphenates by dictionary (needs a matching <code>lang</code>). <code>&lt;wbr&gt;</code> and <code>&amp;shy;</code> are for places you know exactly.')});

/* ===================== cat: struct ===================== */
const atxLmPage=(hl,named)=>{const h=x=>hl===x?' data-ha-hl':'';return `<article class="ha-landmarks-page">
<header${h('header')}><h3>${tx('Reiseblog','Travel blog')}</h3></header>
<nav aria-label="${tx('Kategorien','Categories')}"${h('nav')}><a href="/wien">Wien</a> <a href="/graz">Graz</a> <a href="/linz">Linz</a></nav>
<p>${tx('Drei Tage Wien mit Kindern – unsere Tipps.','Three days in Vienna with kids – our tips.')}</p>
<aside${named?` aria-label="${tx('Verwandte Artikel','Related posts')}"`:''}${h('aside')}><p>${tx('Auch lesenswert: Graz im Herbst','Also worth reading: Graz in autumn')}</p></aside>
<footer${h('footer')}><p>${tx('Geschrieben von Lea, 12. September','Written by Lea, 12 September')}</p></footer>
</article>`};
HTMLA.push({id:'landmarks',cat:'struct',name:tx('Landmarks','Landmarks'),sub:tx('header, nav, main, aside, footer','header, nav, main, aside, footer'),mdn:'Elements/header#accessibility',keys:'landmark orientierungspunkt banner contentinfo complementary navigation main header footer aside nav region',
 desc:tx('Landmarks sind die Sprungmarken einer Seite. Auf Seitenebene werden <code>&lt;header&gt;</code> zu <code>banner</code>, <code>&lt;nav&gt;</code> zu <code>navigation</code>, <code>&lt;main&gt;</code> zu <code>main</code>, <code>&lt;aside&gt;</code> zu <code>complementary</code> und <code>&lt;footer&gt;</code> zu <code>contentinfo</code>. Diese Vorschau steckt in einem <code>&lt;article&gt;</code> – dort gelten andere Regeln. Wähle ein Element und schau, was davon übrig bleibt.','Landmarks are a page’s jump targets. At page level, <code>&lt;header&gt;</code> becomes <code>banner</code>, <code>&lt;nav&gt;</code> <code>navigation</code>, <code>&lt;main&gt;</code> <code>main</code>, <code>&lt;aside&gt;</code> <code>complementary</code> and <code>&lt;footer&gt;</code> <code>contentinfo</code>. This preview sits inside an <code>&lt;article&gt;</code> – different rules apply there. Pick an element and see what’s left of it.'),
 mode:'html',ax:'[data-ha-hl]',measure:atxLandmarks,
 vals:[
  ['<header>',atxLmPage('header'),tx('Im <code>&lt;article&gt;</code> ist <code>&lt;header&gt;</code> nur der Kopf des Artikels – Rolle <code>generic</code>. <code>banner</code> wird er nur, wenn er in keinem <code>article</code>, <code>aside</code>, <code>main</code>, <code>nav</code> oder <code>section</code> steckt.','Inside the <code>&lt;article&gt;</code>, <code>&lt;header&gt;</code> is just the article’s head – role <code>generic</code>. It only becomes <code>banner</code> when it isn’t inside an <code>article</code>, <code>aside</code>, <code>main</code>, <code>nav</code> or <code>section</code>.')],
  ['<nav>',atxLmPage('nav'),tx('<code>&lt;nav&gt;</code> bleibt überall <code>navigation</code>. Gibt es mehrere, unterscheidet sie ein <code>aria-label</code> – ohne das Wort „Navigation“, das sagt der Screenreader schon.','<code>&lt;nav&gt;</code> stays <code>navigation</code> everywhere. If there are several, an <code>aria-label</code> tells them apart – without the word “navigation”, the screen reader already says that.')],
  ['<aside>',atxLmPage('aside'),tx('Ohne Namen ist <code>&lt;aside&gt;</code> in einem <code>&lt;article&gt;</code> (oder <code>section</code>, <code>nav</code>, <code>aside</code>) nur <code>generic</code>. Direkt im <code>body</code> oder in <code>main</code> wäre es <code>complementary</code>.','Without a name, <code>&lt;aside&gt;</code> inside an <code>&lt;article&gt;</code> (or <code>section</code>, <code>nav</code>, <code>aside</code>) is just <code>generic</code>. Directly in <code>body</code> or <code>main</code> it would be <code>complementary</code>.')],
  ['<aside aria-label>',atxLmPage('aside',true),tx('Mit Namen wird <code>&lt;aside&gt;</code> auch im Artikel zur Landmark <code>complementary</code> und taucht in der Landmark-Liste auf.','With a name, <code>&lt;aside&gt;</code> becomes a <code>complementary</code> landmark inside the article too and shows up in the landmark list.')],
  ['<footer>',atxLmPage('footer'),tx('Wie <code>&lt;header&gt;</code>: im Artikel <code>generic</code>, auf Seitenebene <code>contentinfo</code> (Impressum, Kontakt, Copyright der ganzen Seite).','Like <code>&lt;header&gt;</code>: <code>generic</code> inside the article, <code>contentinfo</code> at page level (legal notice, contact, copyright of the whole site).')]
 ],
 tip:tx('Pro Seite genau ein <code>&lt;main&gt;</code>, und <code>banner</code> und <code>contentinfo</code> je höchstens einmal. In Angular ist <code>&lt;app-header&gt;</code> selbst rollenlos – das <code>&lt;header&gt;</code> gehört ins Template der Komponente. Solange kein <code>article</code>/<code>section</code>/<code>main</code> drumherum liegt, bleibt es <code>banner</code>, der Custom-Element-Host stört nicht.','Exactly one <code>&lt;main&gt;</code> per page, and at most one <code>banner</code> and one <code>contentinfo</code>. In Angular, <code>&lt;app-header&gt;</code> itself has no role – the <code>&lt;header&gt;</code> goes into the component’s template. As long as no <code>article</code>/<code>section</code>/<code>main</code> surrounds it, it stays <code>banner</code>; the custom element host doesn’t get in the way.')});

HTMLA.push({id:'section-div',cat:'struct',name:'<section> / <div>',sub:tx('Region nur mit Namen','A region only with a name'),mdn:'Elements/section',keys:'section div abschnitt region landmark container wrapper',
 desc:tx('<code>&lt;div&gt;</code> ist ein Container ohne Bedeutung. <code>&lt;section&gt;</code> ist ein thematischer Abschnitt mit Überschrift – im Accessibility Tree aber erst dann eine Landmark (<code>region</code>), wenn er einen Namen hat.','<code>&lt;div&gt;</code> is a container without meaning. <code>&lt;section&gt;</code> is a thematic section with a heading – but in the accessibility tree it only becomes a landmark (<code>region</code>) once it has a name.'),
 mode:'html',ax:'[data-ha-hl]',measure:atxLandmarks,
 vals:[
  ['<div>',`<div class="ha-section-div-box" data-ha-hl><h3>Newsletter</h3><p>${tx('Einmal im Monat, jederzeit abbestellbar.','Once a month, unsubscribe any time.')}</p></div>`,tx('Rolle <code>generic</code> – für den Screenreader unsichtbar, nur die Überschrift darin zählt.','Role <code>generic</code> – invisible to the screen reader, only the heading inside counts.')],
  ['<section>',`<section class="ha-section-div-box" data-ha-hl><h3>Newsletter</h3><p>${tx('Einmal im Monat, jederzeit abbestellbar.','Once a month, unsubscribe any time.')}</p></section>`,tx('Ohne Namen ist <code>&lt;section&gt;</code> für den Accessibility Tree dasselbe wie <code>&lt;div&gt;</code>. Die Überschrift darin macht ihn noch nicht zur Landmark.','Without a name, <code>&lt;section&gt;</code> is the same as <code>&lt;div&gt;</code> for the accessibility tree. The heading inside doesn’t make it a landmark yet.')],
  ['<section aria-labelledby>',`<section class="ha-section-div-box" aria-labelledby="ha-section-div-title" data-ha-hl><h3 id="ha-section-div-title">Newsletter</h3><p>${tx('Einmal im Monat, jederzeit abbestellbar.','Once a month, unsubscribe any time.')}</p></section>`,tx('Jetzt Rolle <code>region</code> mit Namen aus der Überschrift – er steht in der Landmark-Liste und ist mit <kbd>D</kbd> erreichbar.','Now role <code>region</code>, named by its heading – it appears in the landmark list and can be reached with <kbd>D</kbd>.')]
 ],
 tip:tx('Nicht jede <code>&lt;section&gt;</code> benennen: Zwanzig Regionen machen die Landmark-Liste so unbrauchbar wie keine. Benenne nur Bereiche, die man direkt anspringen will. Und <code>&lt;section&gt;</code> ist kein Styling-Container – wenn es keine Überschrift gäbe, ist es ein <code>&lt;div&gt;</code>.','Don’t name every <code>&lt;section&gt;</code>: twenty regions make the landmark list as useless as none. Only name areas people want to jump to. And <code>&lt;section&gt;</code> isn’t a styling container – if it wouldn’t have a heading, it’s a <code>&lt;div&gt;</code>.')});

HTMLA.push({id:'article',cat:'struct',name:'<article>',sub:tx('In sich geschlossener Inhalt','Self-contained content'),mdn:'Elements/article',keys:'artikel article karte card teaser kommentar comment beitrag post feed',
 desc:tx('<code>&lt;article&gt;</code> ist Inhalt, der auch allein verständlich wäre – ein Blogbeitrag, ein Kommentar, eine Produktkarte in einer Liste. Test: Könnte man ihn so, wie er ist, in einen Feed oder eine andere Seite stellen?','<code>&lt;article&gt;</code> is content that would make sense on its own – a blog post, a comment, a product card in a list. Test: could you put it as-is into a feed or on another page?'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<article>',`<article class="ha-article-card" data-ha-hl><h3><a href="/blog/wien">${tx('Drei Tage Wien','Three days in Vienna')}</a></h3><p>${tx('Unsere Tipps für einen Städtetrip mit Kindern.','Our tips for a city trip with kids.')}</p></article>`,tx('Rolle <code>article</code>, aber ohne Namen – die Überschrift darin benennt ihn nicht automatisch.','Role <code>article</code>, but without a name – the heading inside doesn’t name it automatically.')],
  ['<article aria-labelledby>',`<article class="ha-article-card" aria-labelledby="ha-article-title" data-ha-hl><h3 id="ha-article-title"><a href="/blog/wien">${tx('Drei Tage Wien','Three days in Vienna')}</a></h3><p>${tx('Unsere Tipps für einen Städtetrip mit Kindern.','Our tips for a city trip with kids.')}</p></article>`,tx('Mit <code>aria-labelledby</code> auf die Überschrift hat der Artikel einen Namen – hilfreich in Listen mit vielen Karten.','With <code>aria-labelledby</code> pointing to the heading the article has a name – helpful in lists with many cards.')],
  [tx('verschachtelt','nested'),`<article class="ha-article-card"><h3>${tx('Drei Tage Wien','Three days in Vienna')}</h3><p>${tx('Unsere Tipps für einen Städtetrip mit Kindern.','Our tips for a city trip with kids.')}</p><article class="ha-article-card ha-article-comment" data-ha-hl><h4>${tx('Kommentar von Tom','Comment by Tom')}</h4><p>${tx('Danke, der Prater-Tipp war super!','Thanks, the Prater tip was great!')}</p></article></article>`,tx('Ein Kommentar ist ein eigener Artikel <em>im</em> Artikel: Er gehört zum Beitrag, ist aber für sich verständlich.','A comment is an article of its own <em>inside</em> the article: it belongs to the post but makes sense on its own.')],
  ['<div class>',`<div class="ha-article-card" data-ha-hl><h3><a href="/blog/wien">${tx('Drei Tage Wien','Three days in Vienna')}</a></h3><p>${tx('Unsere Tipps für einen Städtetrip mit Kindern.','Our tips for a city trip with kids.')}</p></div>`,tx('Sieht gleich aus, ist aber nur <code>generic</code>. Für eine einzelne Karte ist das kein Drama – die Überschrift trägt die Struktur.','Looks the same but is only <code>generic</code>. For a single card that’s no disaster – the heading carries the structure.')]
 ],
 tip:tx('<code>&lt;article&gt;</code> ist keine Landmark – in der Landmark-Liste taucht er nicht auf. Und er verändert seine Kinder: <code>&lt;header&gt;</code> und <code>&lt;footer&gt;</code> darin verlieren <code>banner</code> und <code>contentinfo</code> (siehe „Landmarks“). Die ganze Seite in ein <code>&lt;article&gt;</code> zu packen, schluckt also die Seiten-Landmarks.','<code>&lt;article&gt;</code> isn’t a landmark – it doesn’t show up in the landmark list. And it changes its children: <code>&lt;header&gt;</code> and <code>&lt;footer&gt;</code> inside lose <code>banner</code> and <code>contentinfo</code> (see “Landmarks”). Wrapping the whole page in an <code>&lt;article&gt;</code> therefore swallows the page landmarks.')});

const atxItems=()=>tx(['Milch','Brot','Äpfel'],['Milk','Bread','Apples']);
HTMLA.push({id:'lists',cat:'struct',name:'<ul> / <ol> / <li>',sub:tx('Listen, die der Screenreader zählt','Lists the screen reader counts'),mdn:'Elements/ul',keys:'liste list aufzählung bullet nummeriert numbered li listitem safari voiceover list-style',
 desc:tx('<code>&lt;ul&gt;</code> ist eine Liste, bei der die Reihenfolge egal ist, <code>&lt;ol&gt;</code> eine, bei der sie zählt. Der Screenreader sagt vorab, wie viele Einträge kommen, und bei jedem, der wievielte es ist – und man kann die ganze Liste überspringen.','<code>&lt;ul&gt;</code> is a list where order doesn’t matter, <code>&lt;ol&gt;</code> one where it does. The screen reader says up front how many items there are and, for each one, which number it is – and you can skip the whole list.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<ul>',`<ul data-ha-hl>${atxItems().map(x=>`<li>${x}</li>`).join('')}</ul>`,tx('Rolle <code>list</code>, jeder Eintrag <code>listitem</code> mit Position („1 von 3“).','Role <code>list</code>, each item a <code>listitem</code> with its position (“1 of 3”).')],
  ['<ol>',`<ol data-ha-hl>${tx(['Teig kneten','Gehen lassen','Backen'],['Knead the dough','Let it rise','Bake']).map(x=>`<li>${x}</li>`).join('')}</ol>`,tx('Dieselbe Rolle <code>list</code> – dass die Reihenfolge zählt, zeigen die Nummern.','The same role <code>list</code> – the numbers show that order matters.')],
  [tx('<div> + •','<div> + •'),`<div data-ha-hl>${atxItems().map(x=>'• '+x).join('<br>')}</div>`,tx('Sieht aus wie eine Liste, ist aber Text mit Umbrüchen: keine Anzahl, keine Position, nichts zum Überspringen.','Looks like a list but is text with line breaks: no count, no position, nothing to skip.')],
  ['list-style:none',`<ul style="list-style:none;padding:0" data-ha-hl>${atxItems().map(x=>`<li>${x}</li>`).join('')}</ul>`,tx('In Chrome und Firefox bleibt das eine Liste – das zeigt die Zeile oben. <strong>Safari</strong> mit VoiceOver entfernt aber bei <code>list-style:none</code> absichtlich die Listen-Semantik: dort ist es keine Liste mehr.','In Chrome and Firefox this stays a list – that’s what the line above shows. <strong>Safari</strong> with VoiceOver, however, deliberately drops list semantics for <code>list-style:none</code>: there it’s no longer a list.')],
  ['role="list"',`<ul role="list" style="list-style:none;padding:0" data-ha-hl>${atxItems().map(x=>`<li>${x}</li>`).join('')}</ul>`,tx('Die Lösung für Safari: <code>role="list"</code> ausdrücklich setzen. Normalerweise ist eine Rolle, die das Element schon hat, doppelt – hier ist sie der bekannte Workaround.','The fix for Safari: set <code>role="list"</code> explicitly. Normally a role the element already has is redundant – here it’s the well-known workaround.')]
 ],
 measure:st=>{const el=$('[data-ha-hl]',st);if(!el)return '';return roleOf(el).role==='list'?tx(`Screenreader: „Liste mit ${$$(':scope>li',el).length} Einträgen“`,`Screen reader: “list with ${$$(':scope>li',el).length} items”`):tx('Keine Liste – der Screenreader liest drei Zeilen Text.','Not a list – the screen reader reads three lines of text.')},
 tip:tx('Safari (WebKit) entfernt die Listen-Semantik bei <code>list-style:none</code> mit Absicht: Viele Seiten bauen Navigationen und Karten aus <code>&lt;ul&gt;</code>, was beim Vorlesen „Liste mit 1 Eintrag“-Rauschen erzeugt. Wer eine ungestylte Liste wirklich als Liste meint, setzt <code>role="list"</code>. Direkte Kinder von <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> dürfen nur <code>&lt;li&gt;</code> (und <code>&lt;script&gt;</code>/<code>&lt;template&gt;</code>) sein – ein <code>&lt;div&gt;</code> dazwischen bricht die Struktur (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.3.1">WCAG 1.3.1</a>).','Safari (WebKit) drops list semantics for <code>list-style:none</code> on purpose: many sites build navigation and cards from <code>&lt;ul&gt;</code>, which creates “list, 1 item” noise when read aloud. If you really mean an unstyled list as a list, set <code>role="list"</code>. Direct children of <code>&lt;ul&gt;</code>/<code>&lt;ol&gt;</code> may only be <code>&lt;li&gt;</code> (and <code>&lt;script&gt;</code>/<code>&lt;template&gt;</code>) – a <code>&lt;div&gt;</code> in between breaks the structure (<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.3.1">WCAG 1.3.1</a>).')});

HTMLA.push({id:'ol-attrs',cat:'struct',name:'<ol start reversed type>',sub:tx('Nummerierung steuern','Controlling the numbering'),mdn:'Elements/ol#attributes',keys:'nummerierung numbering start reversed countdown type buchstaben letters römisch roman li value',
 desc:tx('Drei Attribute steuern die Zählung einer <code>&lt;ol&gt;</code>: <code>start</code> legt die erste Zahl fest, <code>reversed</code> zählt rückwärts, <code>type</code> wählt Ziffern, Buchstaben oder römische Zahlen.','Three attributes control how an <code>&lt;ol&gt;</code> counts: <code>start</code> sets the first number, <code>reversed</code> counts down, <code>type</code> picks digits, letters or Roman numerals.'),
 stage:`<ol>${tx(['Lea – 98 Punkte','Tom – 91 Punkte','Mia – 87 Punkte'],['Lea – 98 points','Tom – 91 points','Mia – 87 points']).map(x=>`<li>${x}</li>`).join('')}</ol>`,
 t:'ol',
 vals:[
  [tx('ohne','none'),{start:null,reversed:null,type:null},tx('Zählt ab 1.','Counts from 1.')],
  ['start="4"',{start:'4'},tx('Setzt eine Liste fort, die von einem Absatz unterbrochen wurde: Hier geht es bei 4 weiter.','Continues a list that was interrupted by a paragraph: here it goes on at 4.')],
  ['reversed',{reversed:true},tx('Countdown: Ohne <code>start</code> beginnt er bei der Anzahl der Einträge (3) und zählt bis 1.','Countdown: without <code>start</code> it begins at the number of items (3) and counts down to 1.')],
  ['reversed start="10"',{reversed:true,start:'10'},tx('Rückwärts ab 10: 10, 9, 8 – etwa die Plätze 10 bis 8 einer Top-10.','Counting down from 10: 10, 9, 8 – places 10 to 8 of a top ten, for example.')],
  ['type="a"',{type:'a'},tx('Kleinbuchstaben. Weitere Werte: <code>A</code>, <code>i</code>, <code>I</code>, <code>1</code>. <code>start</code> bleibt eine Zahl – <code>start="3"</code> beginnt bei „c“.','Lowercase letters. Other values: <code>A</code>, <code>i</code>, <code>I</code>, <code>1</code>. <code>start</code> stays a number – <code>start="3"</code> starts at “c”.')],
  ['type="I"',{type:'I'},tx('Römische Zahlen. <code>type</code> gehört ins HTML, wenn die Zählweise Bedeutung hat (etwa „siehe Punkt II“) – sonst reicht CSS <code>list-style-type</code>, das <code>type</code> auch überschreibt.','Roman numerals. <code>type</code> belongs in the HTML when the numbering style carries meaning (e.g. “see point II”) – otherwise CSS <code>list-style-type</code> is enough, and it overrides <code>type</code>.')]
 ],
 tip:tx('Einzelne Einträge lassen sich mit <code>&lt;li value="10"&gt;</code> umnummerieren – die folgenden zählen von dort weiter. Wer die Marker mit <code>list-style:none</code> ausblendet und eigene Zahlen per CSS-Counter und <code>::before</code> malt, landet wieder beim Safari-Problem aus dem Listen-Eintrag – <code>::marker</code> zu stylen ist die sicherere Wahl.','Individual items can be renumbered with <code>&lt;li value="10"&gt;</code> – the following ones count on from there. If you hide the markers with <code>list-style:none</code> and paint your own numbers with CSS counters and <code>::before</code>, you’re back at the Safari problem from the lists entry – styling <code>::marker</code> is the safer choice.')});

HTMLA.push({id:'dl',cat:'struct',name:'<dl> / <dt> / <dd>',sub:tx('Begriffe und Werte','Terms and values'),mdn:'Elements/dl',keys:'beschreibungsliste description list definition glossar glossary key value schlüssel wert metadaten',
 desc:tx('Eine Beschreibungsliste: Paare aus Begriff (<code>&lt;dt&gt;</code>) und Beschreibung (<code>&lt;dd&gt;</code>). Richtig für Glossare, aber auch für Schlüssel-Wert-Daten wie Bestelldetails oder Produktdaten.','A description list: pairs of term (<code>&lt;dt&gt;</code>) and description (<code>&lt;dd&gt;</code>). Right for glossaries, but also for key–value data such as order details or product specs.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('Glossar','glossary'),`<dl class="ha-dl-list"><dt data-ha-hl>Landmark</dt><dd>${tx('Sprungmarke für Screenreader, etwa <code>&lt;nav&gt;</code>.','Jump target for screen readers, such as <code>&lt;nav&gt;</code>.')}</dd><dt>${tx('Fokus','Focus')}</dt><dd>${tx('Das Element, das Tastatureingaben bekommt.','The element that receives keyboard input.')}</dd></dl>`,tx('<code>&lt;dt&gt;</code> hat die Rolle <code>term</code>, <code>&lt;dd&gt;</code> die Rolle <code>definition</code>.','<code>&lt;dt&gt;</code> has the role <code>term</code>, <code>&lt;dd&gt;</code> the role <code>definition</code>.')],
  [tx('Schlüssel–Wert','key–value'),`<dl class="ha-dl-grid"><div><dt>${tx('Bestellnummer','Order number')}</dt><dd data-ha-hl>4711</dd></div><div><dt>Status</dt><dd>${tx('Versendet','Shipped')}</dd></div><div><dt>${tx('Lieferung','Delivery')}</dt><dd>${tx('Do., 1. Oktober','Thu, 1 October')}</dd></div></dl>`,tx('Je ein <code>&lt;div&gt;</code> um ein Paar ist erlaubt – praktisch fürs Styling mit Grid oder Flexbox.','One <code>&lt;div&gt;</code> around each pair is allowed – handy for styling with grid or flexbox.')],
  [tx('mehrere <dd>','several <dd>'),`<dl class="ha-dl-list"><dt>${tx('Autorinnen','Authors')}</dt><dd>Lea Berger</dd><dd data-ha-hl>Mia Huber</dd><dt>${tx('Sprachen','Languages')}</dt><dd>${tx('Deutsch, Englisch','German, English')}</dd></dl>`,tx('Ein Begriff darf mehrere Beschreibungen haben (und mehrere <code>&lt;dt&gt;</code> eine gemeinsame).','A term may have several descriptions (and several <code>&lt;dt&gt;</code> may share one).')],
  [tx('<p> + <b>','<p> + <b>'),`<p data-ha-hl><b>${tx('Bestellnummer:','Order number:')}</b> 4711</p><p><b>Status:</b> ${tx('Versendet','Shipped')}</p>`,tx('Auch lesbar – aber für Maschinen gehören Begriff und Wert nicht zusammen.','Readable too – but for machines term and value don’t belong together.')]
 ],
 tip:tx('Screenreader gehen mit <code>&lt;dl&gt;</code> unterschiedlich um – manche sagen „Liste“ mit Anzahl, andere nur die Texte. Die Paare bleiben trotzdem klar. Nicht verwenden für Dialoge (Wer sagt was) – das schließt der Standard ausdrücklich aus. Innerhalb von <code>&lt;dl&gt;</code> sind nur <code>&lt;dt&gt;</code>, <code>&lt;dd&gt;</code> und ein <code>&lt;div&gt;</code> pro Gruppe erlaubt.','Screen readers handle <code>&lt;dl&gt;</code> differently – some say “list” with a count, others just read the text. The pairs stay clear either way. Don’t use it for dialogue (who says what) – the standard explicitly rules that out. Inside a <code>&lt;dl&gt;</code> only <code>&lt;dt&gt;</code>, <code>&lt;dd&gt;</code> and one <code>&lt;div&gt;</code> per group are allowed.')});

const ATX_CHART="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 90'%3E%3Crect width='160' height='90' rx='6' fill='%23FFF1E6'/%3E%3Crect x='22' y='52' width='30' height='28' fill='%23C2410C'/%3E%3Crect x='65' y='34' width='30' height='46' fill='%23C2410C'/%3E%3Crect x='108' y='14' width='30' height='66' fill='%23C2410C'/%3E%3C/svg%3E";
HTMLA.push({id:'figure',cat:'struct',name:'<figure> / <figcaption>',sub:tx('Abbildung mit Bildunterschrift','Figure with caption'),mdn:'Elements/figure',keys:'abbildung figure bildunterschrift caption figcaption bild image diagramm listing',
 desc:tx('<code>&lt;figure&gt;</code> ist eigenständiger Inhalt, auf den der Text verweist – Bild, Diagramm, Code, Zitat. <code>&lt;figcaption&gt;</code> ist die Unterschrift und gibt der Abbildung ihren Namen.','<code>&lt;figure&gt;</code> is self-contained content the text refers to – image, chart, code, quote. <code>&lt;figcaption&gt;</code> is the caption and gives the figure its name.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['<figure> + <img>',`<figure class="ha-figure-fig" data-ha-hl><img src="${ATX_CHART}" alt="${tx('Balkendiagramm: 2024 niedrig, 2025 mittel, 2026 hoch','Bar chart: 2024 low, 2025 medium, 2026 high')}" width="160" height="90"><figcaption>${tx('Abb. 1: Umsatz hat sich seit 2024 mehr als verdoppelt.','Fig. 1: Revenue has more than doubled since 2024.')}</figcaption></figure>`,tx('Rolle <code>figure</code>, Name aus der <code>&lt;figcaption&gt;</code>. Das <code>alt</code> beschreibt das Bild, die Unterschrift ordnet es ein – beide zusammen, nicht doppelt.','Role <code>figure</code>, named by the <code>&lt;figcaption&gt;</code>. The <code>alt</code> describes the image, the caption puts it in context – both together, not the same text twice.')],
  [tx('<figure> + Code','<figure> + code'),`<figure class="ha-figure-fig" data-ha-hl><pre><code>npm run build</code></pre><figcaption>${tx('Listing 1: Produktions-Build erzeugen','Listing 1: creating a production build')}</figcaption></figure>`,tx('Nicht nur für Bilder: Auch ein Code-Listing, eine Tabelle oder ein Zitat kann eine Abbildung sein.','Not only for images: a code listing, a table or a quote can be a figure too.')],
  [tx('ohne figcaption','no figcaption'),`<figure class="ha-figure-fig" data-ha-hl><img src="${ATX_CHART}" alt="${tx('Balkendiagramm: 2024 niedrig, 2025 mittel, 2026 hoch','Bar chart: 2024 low, 2025 medium, 2026 high')}" width="160" height="90"></figure>`,tx('Erlaubt, aber die Abbildung hat keinen Namen. Ohne Unterschrift bringt <code>&lt;figure&gt;</code> wenig – ein <code>&lt;img&gt;</code> allein reicht.','Allowed, but the figure has no name. Without a caption <code>&lt;figure&gt;</code> adds little – an <code>&lt;img&gt;</code> alone is enough.')],

const haBW=n=>`<a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/${n}">WCAG ${n}</a>`;
/* Sprunglinks (#id) in der Vorschau: echter Sprung per location.replace – Scrollen, Fokus und :target macht der
   Browser selbst. Das hashchange-Ereignis fangen wir vorher ab (Capture-Listener auf window laufen zuerst) und setzen
   die Adresse zurück, sonst zeigt der Router des Atlas „Diese Seite gibt es nicht“. */
function haBJump(st){
  let want=null,timer=0;
  const click=ev=>{
    const a=ev.target.closest('a[href^="#"]');
    if(!a||!st.contains(a)||a.getAttribute('href')==='#'||ev.defaultPrevented)return;
    ev.preventDefault();
    if(a.href===location.href)return;
    want={back:location.href,to:a.href};
    clearTimeout(timer);timer=setTimeout(()=>{want=null},1000);
    location.replace(a.href);
  };
  const hc=ev=>{
    if(!want||ev.newURL!==want.to)return;
    ev.stopImmediatePropagation();
    history.replaceState(history.state,'',want.back);
    want=null;clearTimeout(timer);
    st.dataset.haJump=Date.now();
  };
  st.addEventListener('click',click);addEventListener('hashchange',hc,true);
  return ()=>{clearTimeout(timer);st.removeEventListener('click',click);removeEventListener('hashchange',hc,true)};
}
/* Wo ist der Fokus gerade? Für die Messzeile */
function haBFocus(st){
  const f=document.activeElement;
  if(!f||f===document.body)return tx('auf <body> – kein Element hat den Fokus','on <body> – no element has focus');
  if(!st.contains(f))return tx('außerhalb der Vorschau','outside the preview');
  const t=clean(f.textContent);
  return `<${f.localName}${f.id?' id="'+f.id+'"':''}>${t?' '+tx(`„${t.length>28?t.slice(0,27)+'…':t}“`,`“${t.length>28?t.slice(0,27)+'…':t}”`):''}`;
}

 init(st){
  const a=$('.ha-a-target-link',st);
  if(a.hasAttribute('data-ha-hint'))a.insertAdjacentHTML('beforeend',` <span class="ha-a-target-hint">(${tx('öffnet neuen Tab','opens in a new tab')})</span>`);
 },
 measure:st=>{
  const t=$('.ha-a-target-link',st).target;
  if(!t||t==='_self')return tx('Öffnet: im selben Tab','Opens: in the same tab');
  if(t==='_blank')return tx('Öffnet: in einem neuen Tab – die neue Seite hat keinen Zugriff auf window.opener (noopener automatisch)','Opens: in a new tab – the new page gets no access to window.opener (noopener automatically)');
  return tx(`Öffnet: im Tab namens „${t}“ – beim ersten Mal neu, danach wiederverwendet. Hier gibt es kein automatisches noopener.`,`Opens: in the tab named “${t}” – new the first time, reused after that. There is no automatic noopener here.`);
 },
 tip:tx('Nur <code>&lt;a target="_blank"&gt;</code> bekommt <code>noopener</code> automatisch – <code>window.open(url)</code> aus JavaScript nicht. Dort <code>window.open(url, "_blank", "noopener")</code> schreiben, sonst kann die geöffnete Seite über <code>window.opener</code> deine Seite auf eine gefälschte umleiten (Tabnabbing).','Only <code>&lt;a target="_blank"&gt;</code> gets <code>noopener</code> automatically – <code>window.open(url)</code> from JavaScript does not. Write <code>window.open(url, "_blank", "noopener")</code> there, otherwise the opened page can redirect yours to a fake one via <code>window.opener</code> (tabnabbing).')});

HTMLA.push({id:'a-rel',cat:'links',name:'rel',sub:tx('Was der Link über das Ziel verrät','What the link says about its target'),mdn:'Attributes/rel',keys:'noopener noreferrer nofollow sponsored ugc external referer referrer seo',
 desc:tx('<code>rel</code> beschreibt die Beziehung zum Ziel. Manche Werte ändern, was der Browser tut (<code>noopener</code>, <code>noreferrer</code>), andere sind nur Hinweise für Suchmaschinen (<code>nofollow</code>, <code>sponsored</code>) oder für dein CSS.','<code>rel</code> describes the relationship to the target. Some values change what the browser does (<code>noopener</code>, <code>noreferrer</code>), others are just hints for search engines (<code>nofollow</code>, <code>sponsored</code>) or for your CSS.'),
 stage:`<p>${tx('Auch erhältlich im','Also available in our')} <a class="ha-a-rel-link" href="https://example.com/partner" target="_blank">${tx('Partner-Shop','partner shop')}</a>.</p>`,
 t:'.ha-a-rel-link',ax:true,
 vals:[
  [tx('ohne','none'),null,tx('Weil der Link <code>target="_blank"</code> hat, ist <code>noopener</code> schon automatisch aktiv. Der Partner erfährt über den <code>Referer</code> nur die Domain, von der der Besuch kommt (Standard-Policy <code>strict-origin-when-cross-origin</code>).','Because the link has <code>target="_blank"</code>, <code>noopener</code> is already active automatically. Via the <code>Referer</code> the partner only learns the domain the visit comes from (default policy <code>strict-origin-when-cross-origin</code>).')],
  ['noopener','noopener',tx('Die neue Seite bekommt keinen Zugriff auf <code>window.opener</code>. Bei <code>_blank</code> heute doppelt, schadet aber nicht – für ältere Browser war es Pflicht.','The new page gets no access to <code>window.opener</code>. Redundant with <code>_blank</code> today but harmless – older browsers needed it.')],
  ['noreferrer','noreferrer',tx('Kein <code>Referer</code>-Header: Die Zielseite erfährt nicht, woher der Besuch kommt – auch nicht in ihrer Statistik. Schließt <code>noopener</code> mit ein.','No <code>Referer</code> header: the target site doesn’t learn where the visit came from – not even in its analytics. Includes <code>noopener</code>.')],
  ['nofollow','nofollow',tx('Für Suchmaschinen: „Ich bürge nicht für diesen Link.“ Für Links aus Kommentaren gibt es genauer <code>ugc</code>, für bezahlte <code>sponsored</code>. Google wertet alle drei seit 2019 als Hinweis, nicht als Befehl.','For search engines: “I don’t vouch for this link.” For links from comments there’s the more precise <code>ugc</code>, for paid ones <code>sponsored</code>. Since 2019 Google treats all three as hints, not commands.')],
  ['sponsored','sponsored',tx('Kennzeichnet bezahlte Links und Werbung für Suchmaschinen. Werte lassen sich kombinieren: <code>rel="sponsored noopener"</code>.','Marks paid links and ads for search engines. Values can be combined: <code>rel="sponsored noopener"</code>.')],
  ['external','external',tx('Keine Wirkung im Browser – nur die Markierung „führt auf eine andere Website“. Hier hängt CSS mit <code>a[rel~="external"]::after</code> einen Pfeil an.','No effect in the browser – just the label “leads to another website”. Here CSS adds an arrow with <code>a[rel~="external"]::after</code>.')]
 ],
 measure:st=>{
  const r=[...$('.ha-a-rel-link',st).relList],has=k=>r.includes(k),seo=has('nofollow')||has('sponsored')||has('ugc');
  return tx(`relList: [${r.join(', ')}] · Referer: ${has('noreferrer')?'keiner':'nur die Herkunft dieser Seite'} · window.opener: gesperrt · Suchmaschine: ${seo?'wertet den Link nicht als Empfehlung (Hinweis)':'folgt und wertet ihn'}`,`relList: [${r.join(', ')}] · Referer: ${has('noreferrer')?'none':'only this page’s origin'} · window.opener: blocked · search engine: ${seo?'doesn’t count it as a recommendation (hint)':'follows and counts it'}`);
 },
 tip:tx('<code>rel</code> ist eine Liste von Wörtern, getrennt durch Leerzeichen. Im CSS darum <code>[rel~="external"]</code> („enthält das Wort“) statt <code>[rel="external"]</code> („ist genau gleich“) – sonst passt <code>rel="external noopener"</code> nicht mehr. Im Skript hilft <code>a.relList.contains("external")</code>.','<code>rel</code> is a space-separated list of words. So in CSS use <code>[rel~="external"]</code> (“contains the word”) rather than <code>[rel="external"]</code> (“is exactly”) – otherwise <code>rel="external noopener"</code> no longer matches. In scripts use <code>a.relList.contains("external")</code>.')});

HTMLA.push({id:'a-download',cat:'links',name:'download',sub:tx('Speichern statt anzeigen','Save instead of display'),mdn:'Elements/a#download',keys:'herunterladen datei file dateiname filename speichern save content-disposition blob',
 desc:tx('<code>download</code> sagt dem Browser: Diese Datei speichern, nicht anzeigen. Mit Wert gibst du den Dateinamen vor. Die Vorschau lädt nichts herunter – die Messzeile sagt, was passieren würde.','<code>download</code> tells the browser: save this file, don’t display it. With a value you set the file name. The preview downloads nothing – the line below says what would happen.'),
 stage:`<p><a class="ha-a-download-link">${tx('Rechnung herunterladen','Download invoice')}</a> <span class="hint">(PDF, 84 KB)</span></p>`,
 t:'.ha-a-download-link',
 vals:[
  [tx('ohne','none'),{href:'/files/invoice-4711.pdf',download:null},tx('Ohne <code>download</code> entscheidet der Browser: PDFs und Bilder zeigt er an, alles andere lädt er herunter.','Without <code>download</code> the browser decides: it displays PDFs and images and downloads everything else.')],
  ['download',{href:'/files/invoice-4711.pdf',download:true},tx('Leeres <code>download</code>: speichern statt anzeigen, der Dateiname kommt aus der URL.','Empty <code>download</code>: save instead of display, the file name comes from the URL.')],
  ['download="…"',{href:'/files/invoice-4711.pdf',download:'Invoice 2026-09.pdf'},tx('Eigener Dateiname samt Endung. Zeichen, die im Dateisystem verboten sind (<code>/</code>, <code>:</code>), ersetzt der Browser.','Your own file name including the extension. The browser replaces characters the file system forbids (<code>/</code>, <code>:</code>).')],
  [tx('andere Herkunft','other origin'),{href:'https://cdn.example.com/invoice-4711.pdf',download:'Invoice.pdf'},tx('Bei Dateien von einer anderen Herkunft (Origin) ignorieren die Browser <code>download</code> – der Link öffnet die Datei ganz normal. Abhilfe schafft nur der Server mit <code>Content-Disposition: attachment</code>.','For files from another origin browsers ignore <code>download</code> – the link just opens the file. Only the server can fix that with <code>Content-Disposition: attachment</code>.')]
 ],
 measure:st=>{
  const a=$('.ha-a-download-link',st),u=new URL(a.href),d=a.getAttribute('download');
  if(d===null)return tx('Klick: öffnet die PDF im Browser – speichern muss man selbst','Click: opens the PDF in the browser – saving is up to the user');
  if(u.protocol!==location.protocol||u.host!==location.host)return tx(`Klick: ${u.host} ist eine andere Herkunft – download wird ignoriert, die PDF öffnet sich`,`Click: ${u.host} is another origin – download is ignored, the PDF opens`);
  const name=d||decodeURIComponent(u.pathname.split('/').pop());
  return tx(`Klick: speichert direkt als „${name}“`,`Click: saves directly as “${name}”`);
 },
 tip:tx('Schickt der Server <code>Content-Disposition: attachment; filename="…"</code>, gewinnt sein Dateiname gegen den Wert von <code>download</code>. Für Dateien, die du im Browser erzeugst (CSV-Export), klappt <code>download</code> mit einer <code>blob:</code>-URL aus <code>URL.createObjectURL()</code> – danach <code>URL.revokeObjectURL()</code> nicht vergessen.','If the server sends <code>Content-Disposition: attachment; filename="…"</code>, its file name wins over the <code>download</code> value. For files you create in the browser (CSV export) <code>download</code> works with a <code>blob:</code> URL from <code>URL.createObjectURL()</code> – don’t forget <code>URL.revokeObjectURL()</code> afterwards.')});

HTMLA.push({id:'a-hreflang',cat:'links',name:'hreflang',sub:tx('Sprache der Zielseite','Language of the target page'),mdn:'Elements/a#hreflang',keys:'sprache language sprachumschalter language switcher lang aussprache pronunciation',
 desc:tx('<code>hreflang</code> sagt, in welcher Sprache die <em>Zielseite</em> ist. Das ist nur ein Hinweis – der Browser zeigt nichts an. Für den Linktext selbst zählt <code>lang</code>.','<code>hreflang</code> says which language the <em>target page</em> is in. It’s only a hint – the browser shows nothing. For the link text itself, <code>lang</code> is what counts.'),
 stage:`<p>${tx('Diese Seite gibt es auch auf','This page is also available in')} <a class="ha-a-hreflang-link" href="${tx('/en/','/de/')}">${tx('English','Deutsch')}</a>.</p>`,
 t:'.ha-a-hreflang-link',ax:true,
 vals:[
  [tx('ohne','none'),{hreflang:null,lang:null},tx('Das Wort „English“ steht in einer deutschen Seite, also liest der Screenreader es mit deutscher Aussprache – etwa „Englisch“ mit Akzent, schlimmstenfalls unverständlich.','The word “Deutsch” sits in an English page, so the screen reader reads it with English pronunciation – something like “dew-tsh”, at worst unintelligible.')],
  ['hreflang',{hreflang:tx('en','de'),lang:null},tx('Sagt nur, in welcher Sprache das Ziel ist. Nichts ändert sich sichtbar, und die Aussprache bleibt falsch.','Only says which language the target is in. Nothing changes visibly, and the pronunciation stays wrong.')],
  ['hreflang + lang',{hreflang:tx('en','de'),lang:tx('en','de')},tx(`<code>lang</code> gilt für den Linktext: Jetzt spricht der Screenreader das Wort richtig aus (${haBW('3.1.2')}). So macht es auch der Sprachumschalter oben in diesem Atlas.`,`<code>lang</code> applies to the link text: now the screen reader pronounces the word correctly (${haBW('3.1.2')}). The language switcher at the top of this atlas does exactly this.`)]
 ],
 measure:st=>{
  const a=$('.ha-a-hreflang-link',st),own=a.getAttribute('lang'),eff=a.closest('[lang]')?.getAttribute('lang')||'?';
  return tx(`Sprache des Linktexts: ${eff}${own?' (eigenes lang)':' (geerbt von der Seite)'} · Sprache des Ziels laut hreflang: ${a.hreflang||'–'}`,`Language of the link text: ${eff}${own?' (own lang)':' (inherited from the page)'} · language of the target per hreflang: ${a.hreflang||'–'}`);
 },
 tip:tx('Suchmaschinen werten <code>hreflang</code> am <code>&lt;a&gt;</code> kaum aus. Google nutzt es nur in <code>&lt;link rel="alternate" hreflang="en"&gt;</code> im <code>&lt;head&gt;</code>, in der Sitemap oder im HTTP-Header. Für Menschen ist <code>lang</code> das wichtigere Attribut.','Search engines hardly use <code>hreflang</code> on <code>&lt;a&gt;</code>. Google only reads it in <code>&lt;link rel="alternate" hreflang="de"&gt;</code> in the <code>&lt;head&gt;</code>, in the sitemap or in an HTTP header. For people, <code>lang</code> is the more important attribute.')});

const haBNav=a=>`<ul class="ha-a-no-href-nav"><li><a href="/">${tx('Start','Home')}</a></li><li>${a}</li><li><a href="/help">${tx('Hilfe','Help')}</a></li></ul>`;
HTMLA.push({id:'a-no-href',cat:'links',name:tx('<a> ohne href','<a> without href'),sub:tx('Platzhalter statt Link','A placeholder, not a link'),mdn:'Elements/a',keys:'placeholder platzhalter link ohne href without href any-link aria-current aktuelle seite current page fokus focus',
 desc:tx('Ohne <code>href</code> ist ein <code>&lt;a&gt;</code> laut HTML nur ein Platzhalter „hier könnte ein Link stehen“: keine Rolle <code>link</code>, nicht per Tab erreichbar, Enter tut nichts.','Without <code>href</code>, an <code>&lt;a&gt;</code> is just a placeholder “a link could go here”: no <code>link</code> role, not reachable with Tab, Enter does nothing.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('mit href','with href'),haBNav(`<a data-ha-hl href="/account">${tx('Mein Konto','My account')}</a>`),tx('Ein echter Link: Rolle <code>link</code>, per Tab erreichbar, Enter folgt ihm.','A real link: role <code>link</code>, reachable with Tab, Enter follows it.')],
  [tx('ohne href','no href'),haBNav(`<a data-ha-hl>${tx('Mein Konto','My account')}</a>`),tx('Drück Tab in der Vorschau: Der mittlere Eintrag wird übersprungen. Er sieht trotzdem wie ein Link aus – weil das CSS dieser Seite <code>a</code> gestaltet statt <code>a:any-link</code>.','Press Tab in the preview: the middle item is skipped. It still looks like a link – because this page’s CSS styles <code>a</code> instead of <code>a:any-link</code>.')],
  ['aria-current',haBNav(`<a data-ha-hl href="/account" aria-current="page">${tx('Mein Konto','My account')}</a>`),tx('Für „du bist hier“ in der Navigation: <code>href</code> behalten und <code>aria-current="page"</code> setzen. Der Link bleibt erreichbar, der Screenreader sagt „aktuelle Seite“.','For “you are here” in navigation: keep the <code>href</code> and set <code>aria-current="page"</code>. The link stays reachable and the screen reader says “current page”.')]
 ],
 measure:st=>{
  const a=$('[data-ha-hl]',st),link=a.matches(':any-link');
  return tx(`Per Tab erreichbar: ${link?'ja':'nein'} · passt auf a:any-link: ${link?'ja':'nein'}`,`Reachable with Tab: ${link?'yes':'no'} · matches a:any-link: ${link?'yes':'no'}`);
 },
 tip:tx('Ein <code>&lt;a&gt;</code> ohne <code>href</code>, aber mit <code>(click)</code>-Handler ist für die Tastatur unerreichbar. Tut es etwas, ist es ein <code>&lt;button&gt;</code>; führt es wohin, braucht es ein <code>href</code> – in Angular setzt <code>routerLink</code> das automatisch.','An <code>&lt;a&gt;</code> without <code>href</code> but with a <code>(click)</code> handler is unreachable by keyboard. If it does something, it’s a <code>&lt;button&gt;</code>; if it goes somewhere, it needs an <code>href</code> – in Angular, <code>routerLink</code> sets it for you.')});

HTMLA.push({id:'link-vs-button',cat:'links',name:'<a> vs. <button>',sub:tx('Navigation oder Aktion','Navigation or action'),mdn:'Elements/button',keys:'link button schalter navigation aktion action onclick routerlink leertaste space enter',
 desc:tx('Die Faustregel: Führt es woandershin, ist es ein Link. Tut es etwas auf dieser Seite, ist es ein Button. Das Aussehen spielt keine Rolle – Rolle, Tastatur und Browser-Funktionen hängen am Element.','The rule of thumb: if it goes somewhere else, it’s a link. If it does something on this page, it’s a button. Looks don’t matter – role, keyboard and browser features come with the element.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('Link: Navigation','link: navigation'),`<p><a data-ha-hl href="/orders">${tx('Meine Bestellungen','My orders')}</a></p>`,tx('Führt zu einer anderen Seite: Link. Er lässt sich in neuem Tab öffnen, als Lesezeichen speichern und kopieren.','Goes to another page: link. It can be opened in a new tab, bookmarked and copied.')],
  [tx('Button: Aktion','button: action'),`<p><button data-ha-hl type="button" class="btn btn-secondary">${tx('Filter zurücksetzen','Reset filters')}</button></p>`,tx('Tut etwas auf dieser Seite (filtern, speichern, öffnen, schließen): Button. Er reagiert auf Enter <em>und</em> Leertaste.','Does something on this page (filter, save, open, close): button. It reacts to Enter <em>and</em> Space.')],
  [tx('Link als Aktion','link as action'),`<p><a data-ha-hl href="#">${tx('Filter zurücksetzen','Reset filters')}</a></p>`,tx('Verspricht „Link“, tut aber etwas: Die Leertaste geht nicht, Mittelklick öffnet bloß dieselbe Seite noch einmal, und ohne <code>preventDefault()</code> springt <code>href="#"</code> nach oben.','Promises “link” but does something: Space doesn’t work, middle-click just opens the same page again, and without <code>preventDefault()</code> <code>href="#"</code> jumps to the top.')],
  [tx('Button als Navigation','button as navigation'),`<p><button data-ha-hl type="button" class="btn btn-secondary">${tx('Meine Bestellungen','My orders')}</button></p>`,tx('Führt woandershin, navigiert aber per JavaScript: kein neuer Tab, kein Lesezeichen, kein Link-Kontextmenü, und in der Linkliste des Screenreaders fehlt er.','Goes somewhere else but navigates via JavaScript: no new tab, no bookmark, no link context menu, and it’s missing from the screen reader’s links list.')]
 ],
 init(st){
  const on=ev=>{
   const el=ev.target.closest('[data-ha-hl]');if(!el)return;
   ev.preventDefault();
   const nav=clean(el.textContent)===tx('Meine Bestellungen','My orders'),how=ev.detail===0?tx('per Tastatur','by keyboard'):tx('per Maus','by mouse');
   toast({msg:nav?tx(`Navigation zu /orders ${how} (Demo – die Vorschau bleibt hier)`,`Navigation to /orders ${how} (demo – the preview stays here)`):tx(`Aktion ${how}: Filter zurückgesetzt (Demo)`,`Action ${how}: filters reset (demo)`),type:'success'});
  };
  st.addEventListener('click',on);return ()=>st.removeEventListener('click',on);
 },
 measure:st=>$('[data-ha-hl]',st).localName==='a'
  ?tx('Enter: ja · Leertaste: nein (scrollt die Seite) · Mittelklick und „Link in neuem Tab öffnen“: ja · in der Linkliste des Screenreaders: ja','Enter: yes · Space: no (scrolls the page) · middle-click and “Open link in new tab”: yes · in the screen reader’s links list: yes')
  :tx('Enter: ja · Leertaste: ja · Mittelklick und neuer Tab: nein · in der Linkliste des Screenreaders: nein','Enter: yes · Space: yes · middle-click and new tab: no · in the screen reader’s links list: no'),
 tip:tx('In Angular: Navigation mit <code>&lt;a routerLink="/orders"&gt;</code>, Aktionen mit <code>&lt;button type="button" (click)="…"&gt;</code>. Ein <code>&lt;div (click)&gt;</code> mit <code>router.navigate()</code> ist beides nicht – weder fokussierbar noch ein Link. Gestalten darfst du beide, wie du willst.','In Angular: navigation with <code>&lt;a routerLink="/orders"&gt;</code>, actions with <code>&lt;button type="button" (click)="…"&gt;</code>. A <code>&lt;div (click)&gt;</code> calling <code>router.navigate()</code> is neither – not focusable and not a link. Style either one however you like.')});

const haBSkip=(cls,ti)=>`<a class="ha-skip-link-a${cls}" href="#ha-skip-link-main" data-ha-hl>${tx('Zum Inhalt springen','Skip to content')}</a>
<div class="ha-skip-link-menu"><a href="/">${tx('Start','Home')}</a> <a href="/shop">Shop</a> <a href="/help">${tx('Hilfe','Help')}</a> <a href="/account">${tx('Konto','Account')}</a></div>
<div class="ha-skip-link-main" id="ha-skip-link-main"${ti}><h3>${tx('Neuheiten','New arrivals')}</h3><p>${tx('Die Herbstkollektion ist da.','The autumn collection is here.')} <a href="/new">${tx('Ansehen','View')}</a></p></div>`;
HTMLA.push({id:'skip-link',cat:'links',name:tx('Skip-Link','Skip link'),sub:tx('Über die Navigation springen','Jump past the navigation'),mdn:'Elements/a#linking_to_an_element_on_the_same_page',keys:'skip link sprunglink zum inhalt springen bypass blocks fokus focus tabindex main',
 desc:tx(`Ein Link ganz am Anfang der Seite, der über Kopfbereich und Menü hinweg zum Inhalt springt – für alle, die mit der Tastatur arbeiten (${haBW('2.4.1')}). Er zeigt auf die <code>id</code> des Hauptbereichs und erscheint meist erst, wenn er den Fokus hat.`,`A link at the very start of the page that jumps past header and menu to the content – for everyone using a keyboard (${haBW('2.4.1')}). It points to the <code>id</code> of the main area and usually only appears when it has focus.`),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('sichtbar bei Fokus','visible on focus'),haBSkip(' ha-skip-link-reveal',' tabindex="-1"'),tx('Klick in die Variantenleiste und drück Tab: Der Link erscheint, sobald er den Fokus hat. Enter springt übers Menü – der Fokus landet im Inhalt, der nächste Tab geht zu „Ansehen“.','Click the variant bar and press Tab: the link appears as soon as it has focus. Enter jumps past the menu – focus lands in the content, the next Tab goes to “View”.')],
  [tx('Ziel ohne tabindex','target without tabindex'),haBSkip(' ha-skip-link-reveal',''),tx('Ohne <code>tabindex="-1"</code> kann das Ziel keinen Fokus bekommen – nach dem Sprung hat ihn niemand (siehe Messzeile). Chrome und Firefox merken sich das Ziel trotzdem als Startpunkt für die nächste Tab-Taste; mit <code>tabindex="-1"</code> ist der Sprung überall eindeutig.','Without <code>tabindex="-1"</code> the target can’t receive focus – after the jump nothing has it (see the line below). Chrome and Firefox still remember the target as the starting point for the next Tab; with <code>tabindex="-1"</code> the jump is unambiguous everywhere.')],
  [tx('nie sichtbar','never visible'),haBSkip(' sr-only',' tabindex="-1"'),tx(`Nur <code>sr-only</code>, ohne Sichtbarmachen bei Fokus: Tastatur-Nutzende landen auf einem unsichtbaren Element und wissen nicht, wo sie sind (${haBW('2.4.7')}).`,`Only <code>sr-only</code>, not revealed on focus: keyboard users land on an invisible element and don’t know where they are (${haBW('2.4.7')}).`)]
 ],
 init:st=>haBJump(st),
 measure:st=>{const t=st.querySelector(':target');return tx(`Fokus: ${haBFocus(st)}${t?` · Sprungziel (:target): #${t.id}`:''}`,`Focus: ${haBFocus(st)}${t?` · jump target (:target): #${t.id}`:''}`)},
 tip:tx('Der Skip-Link muss das <em>erste</em> fokussierbare Element der Seite sein, und sein Ziel muss existieren – meist <code>&lt;main id="main" tabindex="-1"&gt;</code>. Hier ist es ein <code>&lt;div&gt;</code>, weil die Vorschau in einer Seite mit eigenem <code>&lt;main&gt;</code> steckt. Dieser Atlas hat selbst einen: Lade die Seite neu und drück Tab.','The skip link must be the <em>first</em> focusable element on the page, and its target must exist – usually <code>&lt;main id="main" tabindex="-1"&gt;</code>. Here it’s a <code>&lt;div&gt;</code> because the preview lives inside a page with its own <code>&lt;main&gt;</code>. This atlas has one itself: reload the page and press Tab.')});

HTMLA.push({id:'link-text',cat:'links',name:tx('Linktext','Link text'),sub:tx('Verständlich ohne Umgebung','Clear without its surroundings'),mdn:'Elements/a#accessibility',keys:'hier klicken click here mehr more weiterlesen read more linkliste links list linkzweck link purpose label in name',
 desc:tx(`Screenreader-Nutzende springen oft von Link zu Link oder lassen sich alle Links als Liste zeigen – ohne den Satz drumherum. ${haBW('2.4.4')} verlangt, dass der Zweck aus dem Linktext oder seinem Kontext hervorgeht. Die Messzeile zeigt die Linkliste der Vorschau.`,`Screen reader users often jump from link to link or pull up a list of all links – without the sentence around them. ${haBW('2.4.4')} requires the purpose to be clear from the link text or its context. The line below shows the preview’s links list.`),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('„hier klicken“','“click here”'),`<p>${tx('Preisliste 2027:','Price list 2027:')} <a data-ha-hl href="/prices.pdf">${tx('hier klicken','click here')}</a></p><p>${tx('Rückgaberecht:','Returns policy:')} <a href="/returns">${tx('hier klicken','click here')}</a></p>`,tx('Im Absatz verständlich – und der Absatz zählt für 2.4.4 als Kontext. In der Linkliste steht aber zweimal „hier klicken“. Und „klicken“ stimmt am Handy und mit Tastatur nicht einmal.','Clear within the paragraph – and the paragraph counts as context for 2.4.4. But the links list shows “click here” twice. And “click” isn’t even true on a phone or with a keyboard.')],
  [tx('„mehr“','“more”'),`<ul class="ha-link-text-list"><li>${tx('Versand in 2–3 Tagen.','Shipping in 2–3 days.')} <a data-ha-hl href="/shipping">${tx('mehr','more')}</a></li><li>${tx('30 Tage Rückgabe.','30-day returns.')} <a href="/returns">${tx('mehr','more')}</a></li></ul>`,tx('Dasselbe Problem: Wer mit Tab von Link zu Link geht, hört nur „mehr, Link“ – zweimal, mit verschiedenen Zielen.','Same problem: tabbing from link to link you only hear “more, link” – twice, with different targets.')],
  [tx('aussagekräftig','descriptive'),`<p>${tx('Die','The')} <a data-ha-hl href="/prices.pdf">${tx('Preisliste 2027 (PDF, 240 KB)','price list 2027 (PDF, 240 KB)')}</a> ${tx('ist online.','is online.')}</p><p>${tx('Alles zum','All about our')} <a href="/returns">${tx('Rückgaberecht','returns policy')}</a>.</p>`,tx('Der Linktext sagt allein, wohin es geht – in jeder Liste verständlich. Bei Downloads gehören Dateityp und Größe dazu.','The link text alone says where it goes – clear in any list. For downloads, include file type and size.')],
  [tx('versteckt ergänzt','hidden addition'),`<ul class="ha-link-text-list"><li>${tx('Versand in 2–3 Tagen.','Shipping in 2–3 days.')} <a data-ha-hl href="/shipping">${tx('mehr','more')} <span class="sr-only">${tx('zum Versand','about shipping')}</span></a></li><li>${tx('30 Tage Rückgabe.','30-day returns.')} <a href="/returns">${tx('mehr','more')} <span class="sr-only">${tx('zur Rückgabe','about returns')}</span></a></li></ul>`,tx('Sichtbar bleibt „mehr“, der Screenreader hört „mehr zum Versand“. Weil der sichtbare Text am Anfang des Namens steht, klappt auch Sprachsteuerung („klicke mehr“).','“More” stays visible, the screen reader hears “more about shipping”. Because the visible text starts the name, voice control works too (“click more”).')],
  ['aria-label',`<ul class="ha-link-text-list"><li>${tx('Versand in 2–3 Tagen.','Shipping in 2–3 days.')} <a data-ha-hl href="/shipping" aria-label="${tx('Versandinfos','Shipping info')}">${tx('mehr','more')}</a></li><li>${tx('30 Tage Rückgabe.','30-day returns.')} <a href="/returns" aria-label="${tx('Rückgabeinfos','Returns info')}">${tx('mehr','more')}</a></li></ul>`,tx(`<code>aria-label</code> ersetzt den Linktext ganz: Sichtbar steht „mehr“, der Name ist „Versandinfos“. Sprachsteuerung mit „klicke mehr“ findet nichts – ein Verstoß gegen ${haBW('2.5.3')}.`,`<code>aria-label</code> replaces the link text entirely: “more” is visible, the name is “Shipping info”. Voice control saying “click more” finds nothing – a failure of ${haBW('2.5.3')}.`)]
 ],
 measure:st=>tx('Linkliste: ','Links list: ')+$$('a[href]',st).map(a=>tx(`„${accName(a).name}“`,`“${accName(a).name}”`)).join(' · '),
 tip:tx('Der Schnelltest: Lies nur die Linktexte untereinander (NVDA: <kbd>Einfügen</kbd>+<kbd>F7</kbd>, VoiceOver: Rotor). Versteht man jeden allein, passt es. Und gleicher Text heißt gleiches Ziel – zwei „Details“-Links zu verschiedenen Seiten verwirren.','The quick test: read only the link texts in a list (NVDA: <kbd>Insert</kbd>+<kbd>F7</kbd>, VoiceOver: rotor). If each makes sense alone, you’re good. And same text means same target – two “Details” links to different pages confuse people.')});

/* cat: global */
HTMLA.push({id:'lang-attr',cat:'global',name:'lang',sub:tx('Sprache für Trennung und Aussprache','Language for hyphenation and pronunciation'),mdn:'Global_attributes/lang',keys:'sprache language silbentrennung hyphenation hyphens aussprache pronunciation screenreader bcp 47 de-at',
 desc:tx(`<code>lang</code> sagt, in welcher Sprache ein Text ist. Davon hängen Silbentrennung (<code>hyphens: auto</code>), die Stimme des Screenreaders, Rechtschreibprüfung und Übersetzung ab. Die Seite braucht es am <code>&lt;html&gt;</code> (${haBW('3.1.1')}), fremdsprachige Stellen am jeweiligen Element (${haBW('3.1.2')}). Der Beispieltext ist absichtlich deutsch.`,`<code>lang</code> says which language a text is in. Hyphenation (<code>hyphens: auto</code>), the screen reader’s voice, spell checking and translation depend on it. The page needs it on <code>&lt;html&gt;</code> (${haBW('3.1.1')}), passages in other languages on their element (${haBW('3.1.2')}). The sample text is German on purpose.`),
 stage:`<p class="ha-lang-attr-p">Die Donaudampfschifffahrtsgesellschaft sucht Kapitänsanwärterinnen und Hafenmeisterstellvertreter.</p>`,
 t:'.ha-lang-attr-p',
 vals:[
  [tx('ohne','none'),null,tx('Ohne eigenes <code>lang</code> erbt der Absatz die Sprache der Seite – hier Deutsch, das passt zufällig.','Without its own <code>lang</code> the paragraph inherits the page language – English here, so this German text gets English hyphenation and an English voice. Compare with <code>lang="de"</code>.')],
  ['lang="de"','de',tx('Richtig: deutsche Trennregeln und eine deutsche Stimme im Screenreader.','Correct: German hyphenation rules and a German voice in the screen reader.')],
  ['lang="en"','en',tx('Falsch ausgezeichnet: Der Browser trennt die deutschen Wörter nach englischen Regeln, der Screenreader liest sie mit englischer Aussprache – kaum verständlich.','Wrongly marked up: the browser hyphenates the German words by English rules, the screen reader reads them with English pronunciation – barely intelligible.')],
  ['lang=""','',tx('Leeres <code>lang</code> heißt „Sprache unbekannt“: Der Browser trennt gar nicht mehr, die langen Wörter brechen irgendwo hart um. Im Code steht nur <code>lang</code> – ein Attribut ohne Wert ist dasselbe wie <code>lang=""</code>.','Empty <code>lang</code> means “language unknown”: the browser doesn’t hyphenate at all, the long words break hard at some arbitrary point. The code just shows <code>lang</code> – an attribute without a value is the same as <code>lang=""</code>.')]
 ],
 measure:st=>{
  const p=$('.ha-lang-attr-p',st),own=p.getAttribute('lang');
  if(own==='')return tx('Sprache: unbekannt – keine Silbentrennung, der Screenreader nimmt seine Standardstimme','Language: unknown – no hyphenation, the screen reader uses its default voice');
  const eff=own||p.parentElement.closest('[lang]')?.getAttribute('lang')||'?';
  return tx(`Sprache: ${eff}${own?'':' (geerbt vom <html>)'} – Trennregeln und Aussprache für „${eff}“`,`Language: ${eff}${own?'':' (inherited from <html>)'} – hyphenation rules and pronunciation for “${eff}”`);
 },
 tip:tx('Werte nach BCP 47: <code>de</code>, <code>de-AT</code>, <code>en-GB</code> – nicht <code>ger</code> oder <code>german</code>. In Angular steht <code>lang</code> fest in der <code>index.html</code>; wechselt deine App die Sprache zur Laufzeit (Transloco, ngx-translate), musst du <code>document.documentElement.lang</code> mitziehen – dieser Atlas macht genau das.','Values follow BCP 47: <code>de</code>, <code>de-AT</code>, <code>en-GB</code> – not <code>ger</code> or <code>german</code>. In Angular, <code>lang</code> is fixed in <code>index.html</code>; if your app switches language at runtime (Transloco, ngx-translate), you have to update <code>document.documentElement.lang</code> too – this atlas does exactly that.')});

const haBBidi=(open,close)=>{
  const P=tx('Beiträge','posts'),row=(n,c,hl)=>`<li>${open.replace('>',hl?' data-ha-hl>':'>')}${n}${close}: ${c} ${P}</li>`;
  return `<ul class="ha-dir-bdi-list">${row('Anna',3)}${row('إيان',12,true)}${row('דניאל',5)}</ul>`;
};
HTMLA.push({id:'dir-bdi',cat:'global',name:'dir / <bdi>',sub:tx('Rechts-nach-links-Text einbetten','Embedding right-to-left text'),mdn:'Global_attributes/dir',keys:'rtl ltr arabisch arabic hebräisch hebrew bidi schreibrichtung direction isolieren isolate auto',
