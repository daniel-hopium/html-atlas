 measure:st=>{const f=$('input',st).files;return f.length?tx(`${f.length} Datei(en): ${[...f].map(x=>`${x.name} (${Math.ceil(x.size/1024)} KB)`).join(', ')}`,`${f.length} file(s): ${[...f].map(x=>`${x.name} (${Math.ceil(x.size/1024)} KB)`).join(', ')}`):tx('Noch keine Datei gewählt.','No file chosen yet.')},
 tip:tx('Ohne <code>method="post"</code> und <code>enctype="multipart/form-data"</code> am Formular kommt beim Server nur der <em>Dateiname</em> an, nicht die Datei. Und <code>accept</code> ist Komfort, keine Sicherheit: Typ und Größe prüft immer der Server.','Without <code>method="post"</code> and <code>enctype="multipart/form-data"</code> on the form, the server only receives the <em>file name</em>, not the file. And <code>accept</code> is convenience, not security: the server always checks type and size.')});

HTMLA.push({id:'output',cat:'forms',name:'<output>',sub:tx('Ergebnis einer Berechnung','The result of a calculation'),mdn:'Elements/output',keys:'output ergebnis summe live region status berechnung',
 desc:tx('<code>&lt;output&gt;</code> zeigt das Ergebnis einer Berechnung oder Aktion; <code>for</code> nennt die IDs der Felder, aus denen es entsteht. Es hat die Rolle <code>status</code>, ist also ein Live-Bereich: Ändert sich der Inhalt, liest der Screenreader ihn vor, ohne den Fokus zu verschieben. Das Rechnen übernimmt hier ein kleines Skript.','<code>&lt;output&gt;</code> shows the result of a calculation or action; <code>for</code> lists the IDs of the fields it comes from. It has the role <code>status</code>, so it’s a live region: when its content changes, the screen reader reads it without moving focus. A small script does the maths here.'),
 mode:'html',
 vals:[
  ['<output for>',`<form class="ha-form-grid" action="/order"><div class="ha-output-row"><div class="field"><label for="ha-output-a">${tx('Stück','Qty')}</label><input class="input" id="ha-output-a" type="number" name="qty" min="0" value="3"></div><div class="field"><label for="ha-output-b">${tx('Preis (€)','Price (€)')}</label><input class="input" id="ha-output-b" type="number" name="price" min="0" step="0.01" value="4.5"></div></div><p>${tx('Summe','Total')}: <output name="total" for="ha-output-a ha-output-b" data-ha-hl></output> €</p><button class="btn btn-secondary">${tx('Bestellen','Order')}</button></form>`,tx('Ändere Stück oder Preis – die Summe wird neu berechnet. Beim Absenden fehlt sie im Toast: <code>&lt;output&gt;</code> wird nie mitgeschickt, auch nicht mit <code>name</code>.','Change quantity or price – the total is recalculated. On submit it’s missing from the toast: <code>&lt;output&gt;</code> is never sent, not even with a <code>name</code>.')],
  ['<span>',`<form class="ha-form-grid" action="/order"><div class="ha-output-row"><div class="field"><label for="ha-output-a">${tx('Stück','Qty')}</label><input class="input" id="ha-output-a" type="number" name="qty" min="0" value="3"></div><div class="field"><label for="ha-output-b">${tx('Preis (€)','Price (€)')}</label><input class="input" id="ha-output-b" type="number" name="price" min="0" step="0.01" value="4.5"></div></div><p>${tx('Summe','Total')}: <span data-ha-hl></span> €</p><button class="btn btn-secondary">${tx('Bestellen','Order')}</button></form>`,tx('Optisch gleich, aber ein <code>&lt;span&gt;</code> ist kein Live-Bereich: Wer die Felder mit dem Screenreader ändert, erfährt die neue Summe nicht.','Looks the same, but a <code>&lt;span&gt;</code> is no live region: someone changing the fields with a screen reader never hears the new total.')]
 ],
 init(st){
  const a=$('#ha-output-a',st),b=$('#ha-output-b',st),out=$('[data-ha-hl]',st);
  const calc=()=>{const n=(a.valueAsNumber||0)*(b.valueAsNumber||0);out.textContent=n.toLocaleString(LOCALE,{minimumFractionDigits:2,maximumFractionDigits:2})};
  calc();st.addEventListener('input',calc);return()=>st.removeEventListener('input',calc);
 },
 measure:st=>{const o=$('output',st);return o?tx(`Rolle status (Live-Bereich) · htmlFor: ${o.htmlFor} · value „${o.value}“ · wird nicht gesendet`,`Role status (live region) · htmlFor: ${o.htmlFor} · value “${o.value}” · not sent`):tx('Kein Live-Bereich – Änderungen bleiben für den Screenreader stumm.','No live region – changes stay silent for the screen reader.')},
 tip:tx('Ein Live-Bereich meldet nur Änderungen: Das <code>&lt;output&gt;</code> muss schon im DOM stehen, bevor sich sein Inhalt ändert. Wird es mit <code>@if</code> samt Ergebnis frisch eingefügt, sagt der Screenreader oft gar nichts.','A live region only reports changes: the <code>&lt;output&gt;</code> must already be in the DOM before its content changes. Insert it fresh, result included, with <code>@if</code> and the screen reader often says nothing at all.')});

HTMLA.push({id:'meter-progress',cat:'forms',name:'<meter> / <progress>',sub:tx('Füllstand oder Fortschritt','Gauge or progress'),mdn:'Elements/meter',keys:'meter progress fortschritt ladebalken füllstand gauge progressbar low high optimum',
 desc:tx('<code>&lt;meter&gt;</code> ist ein Messwert in einem bekannten Bereich – Speicher, Akku, Passwortstärke. <code>&lt;progress&gt;</code> ist der Fortschritt einer Aufgabe. Mit <code>low</code>, <code>high</code> und <code>optimum</code> färbt der Browser das <code>&lt;meter&gt;</code> je nach Bereich ein.','<code>&lt;meter&gt;</code> is a measurement within a known range – storage, battery, password strength. <code>&lt;progress&gt;</code> is the progress of a task. With <code>low</code>, <code>high</code> and <code>optimum</code> the browser colours the <code>&lt;meter&gt;</code> by range.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('meter: gut','meter: good'),`<div class="field"><label for="ha-meter-progress-m">${tx('Speicher belegt','Storage used')}</label><meter id="ha-meter-progress-m" min="0" max="100" low="70" high="90" optimum="0" value="40" data-ha-hl>40 %</meter></div>`,tx('<code>optimum="0"</code> heißt „wenig ist gut“. 40 liegt unter <code>low</code>, also im besten Bereich.','<code>optimum="0"</code> means “low is good”. 40 is below <code>low</code>, so in the best range.')],
  [tx('meter: mittel','meter: medium'),`<div class="field"><label for="ha-meter-progress-m">${tx('Speicher belegt','Storage used')}</label><meter id="ha-meter-progress-m" min="0" max="100" low="70" high="90" optimum="0" value="80" data-ha-hl>80 %</meter></div>`,tx('80 liegt zwischen <code>low</code> und <code>high</code> – nicht optimal.','80 lies between <code>low</code> and <code>high</code> – not optimal.')],
  [tx('meter: schlecht','meter: bad'),`<div class="field"><label for="ha-meter-progress-m">${tx('Speicher belegt','Storage used')}</label><meter id="ha-meter-progress-m" min="0" max="100" low="70" high="90" optimum="0" value="95" data-ha-hl>95 %</meter></div>`,tx('95 liegt über <code>high</code>, am anderen Ende als <code>optimum</code> – der schlechteste Bereich.','95 is above <code>high</code>, at the opposite end from <code>optimum</code> – the worst range.')],
  ['progress',`<div class="field"><label for="ha-meter-progress-p">Upload</label><progress id="ha-meter-progress-p" max="100" value="40" data-ha-hl>40 %</progress></div>`,tx('Fortschritt von 0 bis <code>max</code>. Kein <code>min</code>, keine Farbbereiche – nur „wie weit ist es“.','Progress from 0 to <code>max</code>. No <code>min</code>, no colour ranges – just “how far along”.')],
  [tx('progress ohne value','progress, no value'),`<div class="field"><label for="ha-meter-progress-p">Upload</label><progress id="ha-meter-progress-p" max="100" data-ha-hl></progress></div>`,tx('Ohne <code>value</code> ist der Fortschritt unbestimmt: „läuft, Dauer unbekannt“. Das CSS-Gegenstück ist <code>:indeterminate</code>.','Without <code>value</code> the progress is indeterminate: “running, duration unknown”. The CSS counterpart is <code>:indeterminate</code>.')]
 ],
 measure:st=>{
  const p=$('progress',st);if(p)return p.position<0?tx('position: -1 – unbestimmt','position: -1 – indeterminate'):tx(`position: ${p.position} (value ÷ max)`,`position: ${p.position} (value ÷ max)`);
  const m=$('meter',st),reg=x=>x<m.low?0:x>m.high?2:1,rv=reg(m.value),ro=reg(m.optimum),d=ro===1?(rv===1?0:1):Math.abs(rv-ro);
  return tx(`value ${m.value} · low ${m.low} · high ${m.high} · optimum ${m.optimum} → ${['optimal (meist grün)','nicht optimal (meist gelb)','schlecht (meist rot)'][d]}`,`value ${m.value} · low ${m.low} · high ${m.high} · optimum ${m.optimum} → ${['optimal (usually green)','suboptimal (usually yellow)','bad (usually red)'][d]}`);
 },
 tip:tx('Nicht verwechseln: Ein Ladebalken ist <code>&lt;progress&gt;</code>, ein Füllstand <code>&lt;meter&gt;</code>. Beide brauchen einen Namen, am einfachsten per <code>&lt;label&gt;</code>. Der Text zwischen den Tags ist nur Rückfall für Browser ohne Unterstützung – der Screenreader liest den Wert.','Don’t mix them up: a loading bar is <code>&lt;progress&gt;</code>, a gauge <code>&lt;meter&gt;</code>. Both need a name, easiest via <code>&lt;label&gt;</code>. The text between the tags is only a fallback for browsers without support – the screen reader reads the value.')});

/* cat: valid */
HTMLA.push({id:'required',cat:'valid',name:'required',sub:tx('Pflichtfeld','Required field'),mdn:'Attributes/required',keys:'pflichtfeld pflicht required validierung validation valuemissing',
 desc:tx('<code>required</code> macht ein Feld zur Pflicht: Ist es leer, schickt der Browser das Formular nicht ab, fokussiert das Feld und zeigt eine Fehlerblase. Im Accessibility Tree steht <code>required</code> – der Screenreader sagt „erforderlich“.','<code>required</code> makes a field mandatory: if it’s empty, the browser won’t submit the form, focuses the field and shows an error bubble. The accessibility tree gets <code>required</code> – the screen reader says “required”.'),
 stage:`<form class="ha-form-grid" action="/newsletter"><div class="field"><label for="ha-required-in">${tx('E-Mail','Email')}</label><input class="input" id="ha-required-in" type="email" name="email"></div><button class="btn btn-primary">${tx('Anmelden','Subscribe')}</button></form>`,
 t:'#ha-required-in',show:'form',ax:true,
 vals:[
  [tx('ohne','none'),null,tx('Leer absenden klappt – der Toast zeigt <code>email=</code> mit leerem Wert.','Submitting empty works – the toast shows <code>email=</code> with an empty value.')],
  ['required',true,tx('Leer auf „Anmelden“ klicken: Der Browser hält das Absenden an, springt ins Feld und zeigt seine Fehlerblase.','Click “Subscribe” while empty: the browser stops the submit, jumps into the field and shows its error bubble.')]
 ],
 def:1,
 measure:st=>{const i=$('input',st);return i.validity.valid?tx('validity.valid: true','validity.valid: true'):tx(`validity.valueMissing: ${i.validity.valueMissing} · validationMessage: „${i.validationMessage}“`,`validity.valueMissing: ${i.validity.valueMissing} · validationMessage: “${i.validationMessage}”`)},
 tip:tx('Die Fehlerblase kommt in der Sprache des <em>Browsers</em>, nicht der Seite, lässt sich nicht stylen und verschwindet nach Sekunden. Pflichtfelder musst du selbst sichtbar markieren – mit Text, nicht nur mit Farbe oder einem unerklärten Sternchen. Zum Einfärben <code>:user-invalid</code> statt <code>:invalid</code> nehmen, sonst ist das leere Feld schon beim Laden rot.','The error bubble comes in the <em>browser’s</em> language, not the page’s, can’t be styled and vanishes after a few seconds. You have to mark required fields visibly yourself – with text, not just colour or an unexplained asterisk. For colouring use <code>:user-invalid</code> instead of <code>:invalid</code>, or the empty field is red on page load.')});

HTMLA.push({id:'pattern',cat:'valid',name:'pattern',sub:tx('Format per regulärem Ausdruck','Format via regular expression'),mdn:'Attributes/pattern',keys:'regex regulärer ausdruck regular expression format title patternmismatch plz',
 desc:tx('<code>pattern</code> prüft den Wert gegen einen regulären Ausdruck. Er gilt immer für den <em>ganzen</em> Wert – <code>^</code> und <code>$</code> denkt sich der Browser dazu. Ein <code>title</code> beschreibt das Format in Worten.','<code>pattern</code> checks the value against a regular expression. It always applies to the <em>whole</em> value – the browser adds <code>^</code> and <code>$</code> itself. A <code>title</code> describes the format in words.'),
 stage:`<form class="ha-form-grid" action="/address"><div class="field"><label for="ha-pattern-in">${tx('Postleitzahl','Postcode')}</label><input class="input" id="ha-pattern-in" name="zip" inputmode="numeric" value="12345"></div><button class="btn btn-primary">${tx('Weiter','Continue')}</button></form>`,
 t:'#ha-pattern-in',show:'form',ax:true,fresh:true,
 vals:[
  [tx('ohne','none'),{pattern:null,title:null},tx('Jede Eingabe ist gültig – auch „12345“ oder „abc“.','Any input is valid – even “12345” or “abc”.')],
  ['pattern',{pattern:'[0-9]{4}',title:null},tx('Österreichische PLZ: genau vier Ziffern. „12345“ ist ungültig, weil das Muster den ganzen Wert treffen muss. Ein <em>leeres</em> Feld bleibt gültig – dafür braucht es <code>required</code>.','Austrian postcode: exactly four digits. “12345” is invalid because the pattern must match the whole value. An <em>empty</em> field stays valid – that needs <code>required</code>.')],
  ['pattern + title',{pattern:'[0-9]{4}',title:tx('4 Ziffern, z. B. 1010','4 digits, e.g. 1010')},tx('Chrome und Firefox hängen den <code>title</code> an die Fehlermeldung an. Er wird außerdem zur Beschreibung im Accessibility Tree.','Chrome and Firefox append the <code>title</code> to the error message. It also becomes the description in the accessibility tree.')]
 ],
 def:1,
 measure:st=>{const i=$('input',st);return i.validity.valid?'validity.valid: true':tx(`validity.patternMismatch: ${i.validity.patternMismatch} · validationMessage: „${i.validationMessage}“`,`validity.patternMismatch: ${i.validity.patternMismatch} · validationMessage: “${i.validationMessage}”`)},
 tip:tx('Seit 2023 werten die Browser <code>pattern</code> mit dem <code>v</code>-Flag aus: <code>[\\w-]</code> ist dort ein Syntaxfehler, der Bindestrich muss escapt werden (<code>[\\w\\-]</code>). Ein ungültiges Muster ignoriert der Browser still – dann prüft er gar nichts, nur in der Konsole steht eine Warnung.','Since 2023 browsers evaluate <code>pattern</code> with the <code>v</code> flag: <code>[\\w-]</code> is a syntax error there, the hyphen needs escaping (<code>[\\w\\-]</code>). The browser silently ignores an invalid pattern – then it checks nothing at all, with only a warning in the console.')});

HTMLA.push({id:'min-max-step',cat:'valid',name:'min / max / step',sub:tx('Grenzen und Raster','Limits and increments'),mdn:'Attributes/step',keys:'min max step zahl number datum date bereich range stepmismatch rangeunderflow preis',
 desc:tx('<code>min</code> und <code>max</code> begrenzen Zahlen, Datum und Uhrzeit, <code>step</code> legt das Raster fest. Ohne <code>step</code> gilt bei <code>type="number"</code> die Schrittweite 1 – Kommazahlen sind dann ungültig.','<code>min</code> and <code>max</code> limit numbers, dates and times, <code>step</code> sets the increment. Without <code>step</code>, <code>type="number"</code> uses a step of 1 – decimals are then invalid.'),
 stage:`<form class="ha-form-grid" action="/transfer"><div class="field"><label for="ha-min-max-step-in">${tx('Betrag (€)','Amount (€)')}</label><input class="input" id="ha-min-max-step-in" type="number" name="amount" value="2.50"></div><button class="btn btn-primary">${tx('Weiter','Continue')}</button></form>`,
 t:'#ha-min-max-step-in',show:'form',ax:true,fresh:true,
 vals:[
  [tx('ohne step','no step'),{min:'0',max:null,step:null},tx('Standard-<code>step</code> ist 1, gezählt ab <code>min="0"</code>: „2.50“ ist ungültig. Der klassische Fehler bei Preisfeldern.','Default <code>step</code> is 1, counted from <code>min="0"</code>: “2.50” is invalid. The classic bug in price fields.')],
  ['step="0.01"',{min:'0',max:null,step:'0.01'},tx('Cent-Raster: 2.50 passt. Die Pfeile zählen jetzt in Cent-Schritten.','Cent increments: 2.50 fits. The arrows now count in cents.')],
  ['min + max',{min:'5',max:'100',step:'0.01'},tx('2.50 liegt unter <code>min="5"</code> – <code>rangeUnderflow</code>. Die Pfeiltasten bleiben innerhalb der Grenzen.','2.50 is below <code>min="5"</code> – <code>rangeUnderflow</code>. The arrow keys stay within the limits.')],
  ['step="any"',{min:'0',max:null,step:'any'},tx('Kein Raster: jede Kommazahl ist gültig.','No increment: any decimal is valid.')]
 ],
 measure:st=>{const i=$('input',st),bad=['rangeUnderflow','rangeOverflow','stepMismatch','badInput'].filter(k=>i.validity[k]);return bad.length?tx(`validity: ${bad.join(', ')} · validationMessage: „${i.validationMessage}“`,`validity: ${bad.join(', ')} · validationMessage: “${i.validationMessage}”`):'validity.valid: true'},
 tip:tx('Das Raster zählt ab <code>min</code> – fehlt <code>min</code>, ab dem <code>value</code>-Attribut. Mit <code>min="1" step="2"</code> sind nur ungerade Zahlen gültig. Bei <code>type="time"</code> ist <code>step</code> in Sekunden (<code>900</code> = Viertelstunde). Und der Wert hat immer einen Punkt (<code>2.5</code>), auch wenn das Feld „2,5“ anzeigt.','The increment counts from <code>min</code> – without <code>min</code>, from the <code>value</code> attribute. With <code>min="1" step="2"</code> only odd numbers are valid. For <code>type="time"</code>, <code>step</code> is in seconds (<code>900</code> = a quarter of an hour). And the value always uses a dot (<code>2.5</code>), even if the field shows “2,5”.')});

HTMLA.push({id:'minlength',cat:'valid',name:'minlength / maxlength',sub:tx('Wie lang der Text sein darf','How long the text may be'),mdn:'Attributes/minlength',keys:'länge length zeichen characters maxlength minlength tooshort toolong zähler counter',
 desc:tx('<code>minlength</code> und <code>maxlength</code> begrenzen die Länge von Text. <code>maxlength</code> verhindert längere Eingaben schon beim Tippen, <code>minlength</code> meldet zu kurze Werte beim Absenden.','<code>minlength</code> and <code>maxlength</code> limit the length of text. <code>maxlength</code> blocks longer input while typing, <code>minlength</code> reports values that are too short on submit.'),
 stage:`<form class="ha-form-grid" action="/signup"><div class="field"><label for="ha-minlength-in">${tx('Benutzername','Username')}</label><input class="input" id="ha-minlength-in" name="username" value="ab"></div><button class="btn btn-primary">${tx('Weiter','Continue')}</button></form>`,
 t:'#ha-minlength-in',show:'form',fresh:true,
 vals:[
  [tx('ohne','none'),{minlength:null,maxlength:null},tx('Jede Länge geht durch.','Any length gets through.')],
  ['minlength="3"',{minlength:'3',maxlength:null},tx('Überraschung: Der vorbelegte Wert „ab“ gilt als gültig! <code>tooShort</code> meldet der Browser erst, wenn du selbst tippst – lösch ein Zeichen oder tipp eins dazu und wieder weg.','Surprise: the prefilled value “ab” counts as valid! The browser only reports <code>tooShort</code> once you type yourself – delete a character or add one and remove it again.')],
  ['maxlength="8"',{minlength:null,maxlength:'8'},tx('Nach 8 Zeichen geht nichts mehr – auch Eingefügtes wird abgeschnitten, ohne Meldung.','After 8 characters nothing more goes in – pasted text is cut off too, without any message.')]
 ],
 measure:st=>{const i=$('input',st),v=i.validity;return tx(`Länge ${i.value.length} · tooShort: ${v.tooShort} · tooLong: ${v.tooLong}${v.valid?'':` · validationMessage: „${i.validationMessage}“`}`,`Length ${i.value.length} · tooShort: ${v.tooShort} · tooLong: ${v.tooLong}${v.valid?'':` · validationMessage: “${i.validationMessage}”`}`)},
 tip:tx('Gezählt werden UTF-16-Einheiten, nicht Zeichen: „👍“ zählt 2. Und <code>maxlength</code> schneidet beim Einfügen still ab – wer einen langen Text hineinkopiert, merkt nicht, dass das Ende fehlt. Bei längeren Texten lieber einen sichtbaren Zähler zeigen.','Length is counted in UTF-16 code units, not characters: “👍” counts as 2. And <code>maxlength</code> silently cuts off pasted text – someone pasting a long text won’t notice the end is missing. For longer texts, show a visible counter instead.')});

HTMLA.push({id:'readonly-disabled',cat:'valid',name:'readonly / disabled',sub:tx('Gesperrt ist nicht gleich gesperrt','Locked isn’t always locked'),mdn:'Attributes/readonly',keys:'readonly disabled gesperrt schreibgeschützt deaktiviert absenden submit fokus',
 desc:tx('Beide verhindern Eingaben – aber sehr verschieden. <code>readonly</code> bleibt fokussierbar und kopierbar und wird mitgesendet. <code>disabled</code> ist ganz raus: kein Fokus, keine Prüfung, und beim Absenden fehlt der Wert.','Both block input – but very differently. <code>readonly</code> stays focusable and copyable and is sent. <code>disabled</code> is out completely: no focus, no validation, and the value is missing on submit.'),
 stage:`<form class="ha-form-grid" action="/order"><div class="field"><label for="ha-readonly-disabled-in">${tx('Kundennummer','Customer number')}</label><input class="input" id="ha-readonly-disabled-in" name="customer" value="K-1042"></div><button class="btn btn-primary">${tx('Weiter','Continue')}</button></form>`,
 t:'#ha-readonly-disabled-in',show:'form',ax:true,
 vals:[
  [tx('normal','normal'),{readonly:null,disabled:null},tx('Bearbeitbar und wird gesendet.','Editable and sent.')],
  ['readonly',{readonly:true,disabled:null},tx('Tab erreicht das Feld, der Text lässt sich markieren und kopieren – und er wird gesendet. Richtig für Werte, die man sehen, aber nicht ändern soll.','Tab reaches the field, the text can be selected and copied – and it’s sent. Right for values people should see but not change.')],
  ['disabled',{readonly:null,disabled:true},tx('Tab springt drüber, und beim Absenden fehlt die Kundennummer komplett. Der Screenreader sagt „nicht verfügbar“.','Tab skips it, and on submit the customer number is missing entirely. The screen reader says “unavailable”.')]
 ],
 measure:st=>{const i=$('input',st),d=[...new FormData($('form',st))].map(([k,v])=>`${k}=${v}`).join('&');return tx(`Per Tab erreichbar: ${i.disabled?'nein':'ja'} · beim Absenden: ${d||'nichts'}`,`Reachable with tab: ${i.disabled?'no':'yes'} · on submit: ${d||'nothing'}`)},
 tip:tx('In Angular fehlen deaktivierte Controls in <code>form.value</code> – wer sie braucht, nimmt <code>getRawValue()</code>. <code>readonly</code> wirkt nur auf Textfelder: Bei Checkbox, Radio und <code>&lt;select&gt;</code> ignoriert der Browser es. Und beide werden nie validiert – <code>required</code> auf einem gesperrten Feld prüft nichts.','In Angular, disabled controls are missing from <code>form.value</code> – if you need them, use <code>getRawValue()</code>. <code>readonly</code> only works on text fields: on checkboxes, radios and <code>&lt;select&gt;</code> the browser ignores it. And neither is ever validated – <code>required</code> on a locked field checks nothing.')});

HTMLA.push({id:'novalidate',cat:'valid',name:'novalidate / formnovalidate',sub:tx('Prüfung beim Absenden abschalten','Turning off validation on submit'),mdn:'Elements/form#novalidate',keys:'novalidate formnovalidate validierung abschalten entwurf draft angular',
 desc:tx('<code>novalidate</code> am <code>&lt;form&gt;</code> schaltet die Prüfung beim Absenden ab – das Formular geht auch mit Fehlern raus. <code>formnovalidate</code> macht das nur für einen Button, etwa „Entwurf speichern“.','<code>novalidate</code> on the <code>&lt;form&gt;</code> turns off validation on submit – the form goes out even with errors. <code>formnovalidate</code> does this for one button only, such as “Save draft”.'),
 mode:'html',
 vals:[
  [tx('Standard','default'),`<form class="ha-form-grid" action="/contact" data-ha-hl><div class="field"><label for="ha-novalidate-in">${tx('E-Mail','Email')}</label><input class="input" id="ha-novalidate-in" type="email" name="email" value="max@" required></div><div class="btn-row"><button class="btn btn-primary">${tx('Senden','Send')}</button></div></form>`,tx('Klick auf „Senden“: „max@“ ist keine E-Mail-Adresse, der Browser hält an.','Click “Send”: “max@” is no email address, the browser stops.')],
  ['novalidate',`<form class="ha-form-grid" action="/contact" novalidate data-ha-hl><div class="field"><label for="ha-novalidate-in">${tx('E-Mail','Email')}</label><input class="input" id="ha-novalidate-in" type="email" name="email" value="max@" required></div><div class="btn-row"><button class="btn btn-primary">${tx('Senden','Send')}</button></div></form>`,tx('Jetzt geht „max@“ durch – der Toast erscheint. Richtig, wenn du selbst prüfst und eigene Fehlermeldungen zeigst.','Now “max@” gets through – the toast appears. Right when you validate yourself and show your own error messages.')],
  ['formnovalidate',`<form class="ha-form-grid" action="/contact"><div class="field"><label for="ha-novalidate-in">${tx('E-Mail','Email')}</label><input class="input" id="ha-novalidate-in" type="email" name="email" value="max@" required></div><div class="btn-row"><button class="btn btn-primary">${tx('Senden','Send')}</button><button class="btn btn-secondary" formnovalidate data-ha-hl>${tx('Entwurf speichern','Save draft')}</button></div></form>`,tx('„Senden“ prüft, „Entwurf speichern“ nicht – ein halbfertiger Entwurf darf Fehler haben.','“Send” validates, “Save draft” doesn’t – a half-finished draft may contain errors.')]
 ],
 measure:st=>{const f=$('form',st),i=$('input',st);return tx(`Feld gültig: ${i.validity.valid?'ja':'nein'} · form.noValidate: ${f.noValidate}`,`Field valid: ${i.validity.valid?'yes':'no'} · form.noValidate: ${f.noValidate}`)},
 tip:tx('Angular setzt <code>novalidate</code> automatisch auf jedes Formular – deshalb siehst du dort nie die Fehlerblasen des Browsers (zurück holt sie <code>ngNativeValidate</code>). Geprüft wird trotzdem: <code>:invalid</code> und <code>validity</code> funktionieren weiter.','Angular adds <code>novalidate</code> to every form automatically – that’s why you never see the browser’s error bubbles there (<code>ngNativeValidate</code> brings them back). Validation still happens: <code>:invalid</code> and <code>validity</code> keep working.')});

HTMLA.push({id:'button-type',cat:'valid',name:'<button type>',sub:tx('Standard ist submit – der Klassiker','The default is submit – the classic bug'),mdn:'Elements/button#type',keys:'button type submit reset abschicken klassiker bug enter',
 desc:tx('Ein <code>&lt;button&gt;</code> ohne <code>type</code> ist ein <strong>Submit-Button</strong>. In einem Formular schickt jeder Button ohne <code>type</code> das Formular ab – auch der, der nur ein Feld leeren oder ein Passwort anzeigen soll.','A <code>&lt;button&gt;</code> without <code>type</code> is a <strong>submit button</strong>. Inside a form, every button without <code>type</code> submits the form – including the one that should only clear a field or show a password.'),
 stage:`<form class="ha-form-grid" action="/search"><div class="field"><label for="ha-button-type-q">${tx('Suche','Search')}</label><input class="input" id="ha-button-type-q" name="q" value="${tx('Wanderschuhe','Hiking boots')}"></div><div class="btn-row"><button class="btn btn-secondary">${tx('Leeren','Clear')}</button><button class="btn btn-primary">${tx('Suchen','Search')}</button></div></form>`,
 t:'.btn-secondary',show:'form',attr:'type',fresh:true,
 vals:[
  [tx('ohne type','no type'),null,tx('Klick auf „Leeren“: Das Feld wird geleert <em>und</em> das Formular abgeschickt (Toast). Drück <kbd>Enter</kbd> im Feld: Der Browser „klickt“ den ersten Submit-Button – also „Leeren“.','Click “Clear”: the field is cleared <em>and</em> the form submitted (toast). Press <kbd>Enter</kbd> in the field: the browser “clicks” the first submit button – which is “Clear”.')],
  ['type="button"','button',tx('Jetzt macht „Leeren“ nur, was das Skript sagt. <kbd>Enter</kbd> im Feld löst „Suchen“ aus – der ist ohne <code>type</code> ja ein Submit-Button (hier gewollt, sauberer wäre trotzdem <code>type="submit"</code>).','Now “Clear” only does what the script says. <kbd>Enter</kbd> in the field triggers “Search” – without a <code>type</code> it’s a submit button (intended here, though <code>type="submit"</code> would be cleaner).')],
  ['type="reset"','reset',tx('Setzt alle Felder auf den Startwert zurück – hier wieder „Wanderschuhe“, nicht leer. Selten das, was man will.','Resets all fields to their initial value – “Hiking boots” again here, not empty. Rarely what you want.')]
 ],
 init(st){const q=$('input',st),b=$('.btn-secondary',st);b.addEventListener('click',()=>{q.value='';q.focus()})},
 measure:st=>{const b=$('.btn-secondary',st);return tx(`Eigenschaft type von „Leeren“: „${b.type}“`,`type property of “Clear”: “${b.type}”`)},
 tip:tx('Regel: Jeder <code>&lt;button&gt;</code> bekommt ein <code>type</code>. Besonders tückisch: <kbd>Enter</kbd> in einem Textfeld löst den <em>ersten</em> Submit-Button des Formulars aus – steht ein typloser Hilfs-Button vor „Suchen“, erwischt es ihn. In Angular feuert dabei zusätzlich <code>(ngSubmit)</code>.','Rule: every <code>&lt;button&gt;</code> gets a <code>type</code>. Especially sneaky: <kbd>Enter</kbd> in a text field triggers the form’s <em>first</em> submit button – if a helper button without type sits before “Search”, that’s the one. In Angular, <code>(ngSubmit)</code> fires as well.')});

HTMLA.push({id:'form-method',cat:'valid',name:'method',sub:tx('GET oder POST','GET or POST'),mdn:'Elements/form#method',keys:'method get post query body url absenden submit request anfrage',
 desc:tx('<code>method</code> legt fest, wie die Daten reisen: <code>get</code> (Standard) hängt sie als Query an die Adresse, <code>post</code> schickt sie im Body der Anfrage. Unter der Vorschau steht live, was der Browser senden würde – ändere ruhig die Felder.','<code>method</code> sets how the data travels: <code>get</code> (the default) appends it to the address as a query, <code>post</code> sends it in the request body. Below the preview you see live what the browser would send – go ahead and change the fields.'),
 stage:`<form class="ha-form-grid" action="/search"><div class="field"><label for="ha-form-method-q">${tx('Suche','Search')}</label><input class="input" id="ha-form-method-q" name="q" value="${tx('rote Schuhe','red shoes')}"></div><div class="field"><label for="ha-form-method-s">${tx('Sortierung','Sort by')}</label><select id="ha-form-method-s" name="sort"><option value="price">${tx('Preis','Price')}</option><option value="new">${tx('Neueste','Newest')}</option></select></div><button class="btn btn-primary">${tx('Suchen','Search')}</button></form>`,
 t:'form',attr:'method',
 vals:[
  [tx('ohne','none'),null,tx('Ohne Angabe gilt GET.','Without it, GET applies.')],
  ['get','get',tx('Die Suche landet in der Adresse – teilbar, als Lesezeichen speicherbar, per Zurück wiederholbar. Richtig für Suchen und Filter.','The search ends up in the address – shareable, bookmarkable, repeatable with Back. Right for searches and filters.')],
  ['post','post',tx('Die Daten stehen im Body, nicht in der Adresse. Richtig für alles, was etwas ändert (bestellen, speichern) oder vertraulich ist. Neu laden fragt dann „Erneut senden?“.','The data sits in the body, not in the address. Right for anything that changes something (ordering, saving) or is confidential. Reloading then asks “Resubmit?”.')],
  ['put','put',tx('Formulare kennen nur <code>get</code>, <code>post</code> und <code>dialog</code>. Unbekannte Werte fallen still auf GET zurück – PUT und DELETE gehen nur per <code>fetch()</code>.','Forms only know <code>get</code>, <code>post</code> and <code>dialog</code>. Unknown values silently fall back to GET – PUT and DELETE only work via <code>fetch()</code>.')]
 ],
 measure:st=>{const f=$('form',st),q=new URLSearchParams(new FormData(f)).toString(),a=f.getAttribute('action');return f.method==='post'?tx(`POST ${a}\nContent-Type: application/x-www-form-urlencoded\nBody: ${q}`,`POST ${a}\nContent-Type: application/x-www-form-urlencoded\nBody: ${q}`):tx(`GET ${a}?${q}\nKein Body – die Daten stehen in der Adresse.`,`GET ${a}?${q}\nNo body – the data is in the address.`)},
 tip:tx('Bei GET ersetzt der Browser die Query in <code>action</code>: Aus <code>action="/search?lang=de"</code> wird <code>/search?q=…</code> – <code>lang=de</code> ist weg. Solche Werte als <code>&lt;input type="hidden"&gt;</code> mitschicken. Und Passwörter nie per GET: Sie landen im Verlauf und in Server-Logs.','With GET the browser replaces the query in <code>action</code>: <code>action="/search?lang=de"</code> becomes <code>/search?q=…</code> – <code>lang=de</code> is gone. Send such values as <code>&lt;input type="hidden"&gt;</code>. And never send passwords via GET: they end up in the history and server logs.')});

HTMLA.push({id:'formaction',cat:'valid',name:'formaction / formmethod',sub:tx('Ein Formular, zwei Ziele','One form, two destinations'),mdn:'Elements/button#formaction',keys:'formaction formmethod formtarget formenctype button ziel vorschau preview',
 desc:tx('Submit-Buttons können die Angaben des Formulars für sich überschreiben: <code>formaction</code> (Adresse), <code>formmethod</code>, <code>formtarget</code>, <code>formenctype</code> und <code>formnovalidate</code>. So schickt ein Formular je nach Button an verschiedene Ziele.','Submit buttons can override the form’s settings for themselves: <code>formaction</code> (address), <code>formmethod</code>, <code>formtarget</code>, <code>formenctype</code> and <code>formnovalidate</code>. That way one form sends to different destinations depending on the button.'),
 stage:`<form class="ha-form-grid" action="/posts/save" method="post"><div class="field"><label for="ha-formaction-t">${tx('Titel','Title')}</label><input class="input" id="ha-formaction-t" name="title" value="${tx('Mein erster Beitrag','My first post')}"></div><div class="btn-row"><button class="btn btn-primary">${tx('Speichern','Save')}</button><button class="btn btn-secondary">${tx('Vorschau','Preview')}</button></div></form>`,
 t:'.btn-secondary',show:'form',
 vals:[
  [tx('ohne','none'),{formaction:null,formmethod:null,formtarget:null},tx('Beide Buttons schicken an dieselbe Adresse – der Server kann sie nicht unterscheiden.','Both buttons send to the same address – the server can’t tell them apart.')],
  ['formaction',{formaction:'/posts/preview',formmethod:null,formtarget:null},tx('„Vorschau“ schickt an eine andere Adresse, weiterhin per POST.','“Preview” sends to a different address, still via POST.')],
  ['+ formmethod',{formaction:'/posts/preview',formmethod:'get',formtarget:null},tx('Die Vorschau ändert nichts, also passt GET – die Daten wandern in die Adresse.','The preview changes nothing, so GET fits – the data moves into the address.')],
  ['+ formtarget',{formaction:'/posts/preview',formmethod:'get',formtarget:'_blank'},tx('Die Vorschau öffnet sich in einem neuen Tab, das Formular bleibt stehen.','The preview opens in a new tab, the form stays put.')]
 ],
 measure:st=>{const f=$('form',st);return $$('button',st).map(b=>{const m=(b.hasAttribute('formmethod')?b.formMethod:f.method).toUpperCase(),a=b.getAttribute('formaction')||f.getAttribute('action'),q=new URLSearchParams(new FormData(f,b)).toString(),tg=b.getAttribute('formtarget')==='_blank'?tx(' (neuer Tab)',' (new tab)'):'';return `${b.textContent} → `+(m==='GET'?`GET ${a}?${q}`:`POST ${a} · Body: ${q}`)+tg}).join('\n')},
 tip:tx('Die <code>form…</code>-Attribute wirken nur auf Submit-Buttons – an einem <code>type="button"</code> passiert nichts. Und in einer Angular-App, die mit <code>(ngSubmit)</code> gar nicht wirklich absendet, spielt <code>formaction</code> keine Rolle: Dort fragst du im Handler <code>event.submitter</code> ab.','The <code>form…</code> attributes only work on submit buttons – on a <code>type="button"</code> nothing happens. And in an Angular app that never really submits thanks to <code>(ngSubmit)</code>, <code>formaction</code> doesn’t matter: there you check <code>event.submitter</code> in the handler.')});

HTMLA.push({id:'submitter',cat:'valid',name:'<button name value>',sub:tx('Welcher Button war’s?','Which button was it?'),mdn:'Elements/button#name',keys:'submitter name value button welcher speichern veröffentlichen requestsubmit',
 desc:tx('Hat ein Submit-Button selbst <code>name</code> und <code>value</code>, schickt das Formular dieses Paar mit – aber nur vom Button, der gedrückt wurde. So erkennt der Server, ob „Speichern“ oder „Veröffentlichen“ gemeint war. Unter der Vorschau steht, was jeder Button senden würde.','If a submit button has its own <code>name</code> and <code>value</code>, the form sends that pair along – but only from the button that was pressed. That’s how the server knows whether “Save” or “Publish” was meant. Below the preview you see what each button would send.'),
 mode:'html',
 vals:[
  [tx('ohne name','no name'),`<form class="ha-form-grid" action="/posts" method="post"><div class="field"><label for="ha-submitter-t">Text</label><input class="input" id="ha-submitter-t" name="text" value="${tx('Hallo Welt','Hello world')}"></div><div class="btn-row"><button class="btn btn-secondary" data-ha-hl>${tx('Speichern','Save')}</button><button class="btn btn-primary" data-ha-hl>${tx('Veröffentlichen','Publish')}</button></div></form>`,tx('Beide Buttons senden genau dasselbe – der Server weiß nicht, welcher gedrückt wurde.','Both buttons send exactly the same – the server doesn’t know which one was pressed.')],
  ['name + value',`<form class="ha-form-grid" action="/posts" method="post"><div class="field"><label for="ha-submitter-t">Text</label><input class="input" id="ha-submitter-t" name="text" value="${tx('Hallo Welt','Hello world')}"></div><div class="btn-row"><button class="btn btn-secondary" name="action" value="save" data-ha-hl>${tx('Speichern','Save')}</button><button class="btn btn-primary" name="action" value="publish" data-ha-hl>${tx('Veröffentlichen','Publish')}</button></div></form>`,tx('Jetzt hängt <code>action=save</code> oder <code>action=publish</code> dran – je nach Button. Probier beide aus und schau in den Toast.','Now <code>action=save</code> or <code>action=publish</code> is appended – depending on the button. Try both and look at the toast.')],
  ['<input type="submit">',`<form class="ha-form-grid" action="/posts" method="post"><div class="field"><label for="ha-submitter-t">Text</label><input class="input" id="ha-submitter-t" name="text" value="${tx('Hallo Welt','Hello world')}"></div><div class="btn-row"><input class="btn btn-secondary" type="submit" name="action" value="${tx('Speichern','Save')}" data-ha-hl><input class="btn btn-primary" type="submit" name="action" value="${tx('Veröffentlichen','Publish')}" data-ha-hl></div></form>`,tx('Bei <code>&lt;input type="submit"&gt;</code> ist <code>value</code> zugleich die Beschriftung: Wird die Oberfläche übersetzt, ändert sich auch der gesendete Wert. Mit <code>&lt;button&gt;</code> sind Text und Wert getrennt.','With <code>&lt;input type="submit"&gt;</code> the <code>value</code> is also the label: translate the UI and the sent value changes too. With <code>&lt;button&gt;</code>, text and value are separate.')]
 ],
 measure:st=>{const f=$('form',st);return $$('[data-ha-hl]',st).map(b=>`${b.textContent||b.value} → ${new URLSearchParams(new FormData(f,b)).toString()}`).join('\n')},
 tip:tx('<code>form.submit()</code> im Skript schickt ohne Button-Paar ab – und ohne Prüfung und ohne <code>submit</code>-Event. <code>form.requestSubmit(button)</code> verhält sich wie ein echter Klick. Bei <kbd>Enter</kbd> im Textfeld gilt der erste Submit-Button als gedrückt, sein Paar wird mitgesendet.','<code>form.submit()</code> in a script submits without any button pair – and without validation and without a <code>submit</code> event. <code>form.requestSubmit(button)</code> behaves like a real click. On <kbd>Enter</kbd> in a text field the first submit button counts as pressed, and its pair is sent.')});

HTMLA.push({id:'form-attr',cat:'valid',name:'form="id"',sub:tx('Feld außerhalb des Formulars','A field outside the form'),mdn:'Elements/input#form',keys:'form attribut attribute außerhalb outside footer dialog id zuordnen',
 desc:tx('Mit <code>form="id"</code> gehört ein Feld oder Button zu einem Formular, obwohl es außerhalb davon steht – praktisch für Buttons in einer Fußleiste oder einem Dialog-Footer. Das geht bei <code>&lt;button&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;textarea&gt;</code>, <code>&lt;fieldset&gt;</code> und <code>&lt;output&gt;</code>.','With <code>form="id"</code> a field or button belongs to a form even though it sits outside it – handy for buttons in a footer bar or a dialog footer. It works on <code>&lt;button&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code>, <code>&lt;textarea&gt;</code>, <code>&lt;fieldset&gt;</code> and <code>&lt;output&gt;</code>.'),
 stage:`<div class="ha-form-attr-wrap"><form class="ha-form-grid" id="ha-form-attr-f" action="/profile"><div class="field"><label for="ha-form-attr-n">Name</label><input class="input" id="ha-form-attr-n" name="name" value="Alex"></div></form><div class="ha-form-attr-bar"><label class="check-row"><input type="checkbox" name="public" checked> ${tx('Profil öffentlich','Public profile')}</label><button class="btn btn-primary">${tx('Speichern','Save')}</button></div></div>`,
 t:'.ha-form-attr-bar input,.ha-form-attr-bar button',show:'.ha-form-attr-wrap',attr:'form',
 vals:[
  [tx('ohne form','no form'),null,tx('Checkbox und Button stehen außerhalb des <code>&lt;form&gt;</code>. Klick auf „Speichern“: nichts passiert – der Button gehört zu keinem Formular.','Checkbox and button sit outside the <code>&lt;form&gt;</code>. Click “Save”: nothing happens – the button belongs to no form.')],
  ['form="ha-form-attr-f"','ha-form-attr-f',tx('Jetzt gehören beide dazu: „Speichern“ sendet <code>name</code> und <code>public</code>.','Now both belong to it: “Save” sends <code>name</code> and <code>public</code>.')]
 ],
 measure:st=>{const b=$('button',st),c=$('input[type=checkbox]',st),w=x=>x.form?'#'+x.form.id:tx('keins','none');return `button.form: ${w(b)} · checkbox.form: ${w(c)}`},
 tip:tx('Das Attribut braucht die <code>id</code> des Formulars (nicht seinen <code>name</code>), und beide müssen im selben DOM-Baum liegen: Über die Grenze eines Shadow DOM hinweg – etwa bei Angular mit <code>ViewEncapsulation.ShadowDom</code> – findet es das Formular nicht. Umgekehrt löst <code>form="andere-id"</code> ein Feld aus seinem umschließenden Formular heraus.','The attribute needs the form’s <code>id</code> (not its <code>name</code>), and both must live in the same DOM tree: across a shadow DOM boundary – e.g. Angular with <code>ViewEncapsulation.ShadowDom</code> – it won’t find the form. Conversely, <code>form="other-id"</code> pulls a field out of the form that wraps it.')});

/* d-behave: Kapitel behave und tables. Der Block hält die Hilfsfunktionen lokal, damit sie nicht mit anderen Dateien kollidieren. */
{
/* Live-DOM als Klartext (für eigene Code-Panels, die HTML und ein Stück JS zeigen) */
const dbPlain=el=>{if(!el)return '';const d=document.createElement('div');d.innerHTML=haSerialize(el);return d.textContent};
/* Wo steht der Fokus gerade? */
const dbFocus=st=>{const a=document.activeElement;if(!a||!st.contains(a))return tx('außerhalb der Vorschau','outside the preview');const n=a.localName==='dialog'?'':accName(a).name;return `<${a.localName}>${n?tx(` „${n}“`,` “${n}”`):''}`};
/* Buttons mit data-ha-do öffnen/schließen den Dialog der Vorschau; Aufräumen schließt alles, was noch offen ist */
const dbDialog=(st,open)=>{
  const f=e=>{const b=e.target.closest('[data-ha-do]');if(!b||!st.contains(b))return;const d=$('dialog',st);
    if(b.dataset.haDo==='open'&&!d.open)open(d);else if(b.dataset.haDo==='close'&&d.open)d.close()};
  st.addEventListener('click',f);
  return ()=>{st.removeEventListener('click',f);$$('dialog',st).forEach(d=>{if(d.open)d.close()});$$('[popover]',st).forEach(p=>{try{p.hidePopover()}catch(x){}})};
};
const dbState=d=>d.open?(d.matches(':modal')?tx('offen, modal','open, modal'):tx('offen, nicht modal','open, non-modal')):tx('geschlossen','closed');
const Q=s=>tx(`„${s}“`,`“${s}”`);
const EUR=n=>tx(n.toFixed(2).replace('.',',')+' €','€'+n.toFixed(2));

/* ============================== behave ============================== */
HTMLA.push({id:'details-open',cat:'behave',name:'<details open>',sub:tx('Aufklappen – und offen starten','Disclosure – and starting open'),mdn:'Elements/details#open',keys:'summary aufklappen zuklappen disclosure toggle ausklappen',
 desc:tx('<code>&lt;details&gt;</code> zeigt nur sein <code>&lt;summary&gt;</code>, bis man darauf klickt oder <kbd>Enter</kbd> bzw. <kbd>Leertaste</kbd> drückt. Das boolesche Attribut <code>open</code> lässt es offen starten – und der Browser setzt und entfernt es beim Klicken selbst. Schau dabei in den Code darunter.','<code>&lt;details&gt;</code> only shows its <code>&lt;summary&gt;</code> until you click it or press <kbd>Enter</kbd> or <kbd>Space</kbd>. The boolean attribute <code>open</code> makes it start open – and the browser adds and removes it itself when clicked. Watch the code below while you do.'),
 stage:`<details class="ha-details-open-d"><summary>${tx('Technische Daten','Specifications')}</summary><p>${tx('Gewicht 1,2 kg · Akku bis 10 h · Laden über USB-C','Weight 1.2 kg · battery up to 10 h · USB-C charging')}</p></details>`,
 t:'details',attr:'open',ax:'summary',
 vals:[[tx('ohne open','no open'),null,tx('Zu. Klick auf „Technische Daten“: Im Code erscheint <code>open</code>, ohne dass ein Skript läuft.','Closed. Click “Specifications”: <code>open</code> appears in the code without any script running.')],
  ['open',true,tx('Startet offen. Nur sinnvoll für Inhalte, die die meisten ohnehin lesen sollen – sonst wäre das Zuklappen der bessere Start.','Starts open. Only useful for content most people should read anyway – otherwise starting closed is the better default.')]],
 measure:st=>`${tx('Zustand','State')}: details.open = ${$('details',st).open}`,
 tip:tx('Wer in Angular <code>[open]="offen()"</code> bindet, muss auch <code>(toggle)</code> abhören: Der Browser ändert <code>open</code> beim Klick selbst, sonst laufen Signal und DOM auseinander. Und <code>display: flex</code> auf <code>&lt;summary&gt;</code> lässt in Chrome und Firefox das Dreieck verschwinden – es ist ein <code>::marker</code>, den es nur bei <code>display: list-item</code> gibt.','If you bind <code>[open]="isOpen()"</code> in Angular, also listen to <code>(toggle)</code>: the browser changes <code>open</code> itself on click, otherwise signal and DOM drift apart. And <code>display: flex</code> on <code>&lt;summary&gt;</code> removes the triangle in Chrome and Firefox – it’s a <code>::marker</code>, which only exists with <code>display: list-item</code>.')});

HTMLA.push({id:'dialog-show',cat:'behave',name:'<dialog>',sub:tx('show() oder showModal()','show() or showModal()'),mdn:'Elements/dialog',keys:'modal dialog popup overlay backdrop top layer esc fokus focus showmodal',
 desc:tx('Ein <code>&lt;dialog&gt;</code> öffnet sich per JavaScript: <code>show()</code> nicht modal, <code>showModal()</code> modal – dann liegt er im Top Layer über allem, der Rest der Seite ist gesperrt (inert), <kbd>Esc</kbd> schließt, dahinter liegt <code>::backdrop</code>. In allen großen Browsern seit 2022.','A <code>&lt;dialog&gt;</code> is opened with JavaScript: <code>show()</code> non-modal, <code>showModal()</code> modal – then it sits in the top layer above everything, the rest of the page is blocked (inert), <kbd>Esc</kbd> closes it and <code>::backdrop</code> sits behind it. In all major browsers since 2022.'),
 stage:`<div class="ha-dialog-show-demo"><div class="btn-row"><button type="button" class="btn btn-primary" data-ha-do="open">${tx('Dialog öffnen','Open dialog')}</button></div><dialog class="ha-dlg" aria-labelledby="ha-dialog-show-title"><h3 id="ha-dialog-show-title">${tx('Änderungen verwerfen?','Discard changes?')}</h3><p>${tx('Probier <kbd>Tab</kbd> und <kbd>Esc</kbd>.','Try <kbd>Tab</kbd> and <kbd>Esc</kbd>.')}</p><div class="btn-row"><button type="button" class="btn btn-secondary" data-ha-do="close">${tx('Schließen','Close')}</button></div></dialog></div>`,
 t:'dialog',attr:'data-ha-m',ax:'dialog',fresh:true,
 vals:[['show()','show',tx('Nicht modal: Der Dialog liegt über der Vorschau, die Seite bleibt bedienbar, <kbd>Esc</kbd> tut nichts. Der Fokus springt trotzdem hinein – und beim Schließen zurück auf „Dialog öffnen“.','Non-modal: the dialog sits over the preview, the page stays usable, <kbd>Esc</kbd> does nothing. Focus still moves inside – and back to “Open dialog” on close.')],
  ['showModal()','modal',tx('Modal: Der Rest der Seite ist gesperrt – <kbd>Tab</kbd> bleibt im Dialog (und in der Browserleiste). <kbd>Esc</kbd> schließt, der abgedunkelte Hintergrund ist <code>::backdrop</code>. Der Dialog ragt aus der Vorschau-Box heraus, obwohl die <code>overflow: hidden</code> hat: Top Layer.','Modal: the rest of the page is blocked – <kbd>Tab</kbd> stays in the dialog (and the browser toolbar). <kbd>Esc</kbd> closes it, the dimmed background is <code>::backdrop</code>. The dialog escapes the preview box even though it has <code>overflow: hidden</code>: top layer.')]],
 init(st,v){return dbDialog(st,d=>v.attrs['data-ha-m']==='modal'?d.showModal():d.show())},
 measure:st=>`${tx('Dialog','Dialog')}: ${dbState($('dialog',st))} · ${tx('Fokus','Focus')}: ${dbFocus(st)}`,
 code:(st,v)=>`${dbPlain($('.btn-row',st))}\n${dbPlain($('dialog',st))}\n\n<\x73cript>\n  // ${tx('dialog, openBtn, closeBtn: die Elemente oben','dialog, openBtn, closeBtn: the elements above')}\n  openBtn.addEventListener('click', () => dialog.${v.attrs['data-ha-m']==='modal'?'showModal':'show'}());\n  closeBtn.addEventListener('click', () => dialog.close());\n<\/script>`,
 tip:tx('Nie das <code>open</code>-Attribut selbst setzen (<code>&lt;dialog open&gt;</code> oder <code>setAttribute</code>): Dann gibt es keinen Top Layer, keinen Fokuswechsel und kein <kbd>Esc</kbd>, und beim Entfernen feuert kein sauberes <code>close</code>. Immer <code>show()</code>/<code>showModal()</code> und <code>close()</code> – oder ganz ohne Skript mit <code>command</code> (siehe unten).','Never set the <code>open</code> attribute yourself (<code>&lt;dialog open&gt;</code> or <code>setAttribute</code>): then there’s no top layer, no focus move and no <kbd>Esc</kbd>, and removing it doesn’t fire a clean <code>close</code>. Always use <code>show()</code>/<code>showModal()</code> and <code>close()</code> – or no script at all with <code>command</code> (see below).')});

HTMLA.push({id:'form-method-dialog',cat:'behave',name:'<form method="dialog">',sub:tx('Schließen mit Antwort: returnValue','Closing with an answer: returnValue'),mdn:'Elements/form#method',keys:'dialog returnvalue formular schließen close bestätigen confirm',
 desc:tx('Ein Formular mit <code>method="dialog"</code> in einem <code>&lt;dialog&gt;</code> sendet nichts ab, sondern schließt den Dialog. Der <code>value</code> des geklickten Buttons landet in <code>dialog.returnValue</code> – so erfährt dein Code, was gewählt wurde.','A form with <code>method="dialog"</code> inside a <code>&lt;dialog&gt;</code> doesn’t send anything – it closes the dialog. The clicked button’s <code>value</code> ends up in <code>dialog.returnValue</code> – that’s how your code learns what was chosen.'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-secondary" data-ha-do="open">${tx('Entwurf verwerfen …','Discard draft …')}</button></div><dialog class="ha-dlg" aria-labelledby="ha-form-method-dialog-title"><form method="dialog"><h3 id="ha-form-method-dialog-title">${tx('Entwurf verwerfen?','Discard draft?')}</h3><p>${tx('Dein Text geht dabei verloren.','Your text will be lost.')}</p><div class="btn-row"><button class="btn btn-secondary" value="cancel">${tx('Abbrechen','Cancel')}</button><button class="btn btn-primary" value="discard">${tx('Verwerfen','Discard')}</button></div></form></dialog>`,
 t:'form',attr:'method',show:'dialog',fresh:true,
 vals:[['method="dialog"','dialog',tx('Wähl „Verwerfen“: Der Dialog schließt, <code>returnValue</code> ist „discard“. Dann öffne erneut und drück <kbd>Esc</kbd> – <code>returnValue</code> bleibt beim alten Wert.','Choose “Discard”: the dialog closes and <code>returnValue</code> is “discard”. Then open it again and press <kbd>Esc</kbd> – <code>returnValue</code> keeps the old value.')],
  ['method="post"','post',tx('Ohne <code>dialog</code> wird das Formular normal abgeschickt (hier nur als Meldung gezeigt) und der Dialog bleibt offen. Schließen mit <kbd>Esc</kbd>.','Without <code>dialog</code> the form is submitted normally (only shown as a message here) and the dialog stays open. Close it with <kbd>Esc</kbd>.')]],
 init(st){return dbDialog(st,d=>d.showModal())},
 measure:st=>{const d=$('dialog',st);return `${tx('Dialog','Dialog')}: ${dbState(d)} · returnValue: ${d.returnValue?Q(d.returnValue):tx('(leer)','(empty)')}`},
 tip:tx('<kbd>Esc</kbd> ändert <code>returnValue</code> nicht – setz ihn vor jedem Öffnen mit <code>dialog.returnValue = \'\'</code> zurück. Und das Formular wird vor dem Schließen validiert: Hat es ein <code>required</code>-Feld, blockiert es auch „Abbrechen“ – dort <code>formnovalidate</code> setzen.','<kbd>Esc</kbd> doesn’t change <code>returnValue</code> – reset it with <code>dialog.returnValue = \'\'</code> before each opening. And the form is validated before closing: if it has a <code>required</code> field, it blocks “Cancel” too – put <code>formnovalidate</code> on that button.')});

HTMLA.push({id:'dialog-autofocus',cat:'behave',name:'autofocus',sub:tx('Wo der Fokus im Dialog landet','Where focus lands in a dialog'),mdn:'Global_attributes/autofocus',keys:'fokus focus dialog modal öffnen erstes element',
 desc:tx('Beim Öffnen setzt der Browser den Fokus in den Dialog: auf das Element mit <code>autofocus</code>, sonst auf das erste fokussierbare Element. Oft ist das der Schließen-Button oben rechts – selten das, was man will.','When a dialog opens, the browser moves focus into it: to the element with <code>autofocus</code>, otherwise to the first focusable element. Often that’s the close button in the top corner – rarely what you want.'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-secondary" data-ha-do="open">${tx('Adresse ändern','Change address')}</button></div><dialog class="ha-dlg" aria-labelledby="ha-dialog-autofocus-title"><form method="dialog"><div class="ha-dlg-head"><h3 id="ha-dialog-autofocus-title">${tx('Adresse ändern','Change address')}</h3><button type="button" class="ha-dlg-x" data-ha-do="close" aria-label="${tx('Schließen','Close')}">×</button></div><div class="field"><label for="ha-dialog-autofocus-in">${tx('Straße und Hausnummer','Street and number')}</label><input class="input" id="ha-dialog-autofocus-in" autocomplete="street-address"></div><div class="btn-row"><button class="btn btn-primary" value="save">${tx('Speichern','Save')}</button></div></form></dialog>`,
 t:'dialog',attr:'data-ha-af',show:'dialog',fresh:true,
 vals:[[tx('ohne autofocus','no autofocus'),'none',tx('Öffne den Dialog: Der Fokus landet auf dem ersten fokussierbaren Element, dem ×. Wer tippen will, muss erst weiter-tabben.','Open the dialog: focus lands on the first focusable element, the ×. Anyone who wants to type has to tab on first.')],
  ['<input autofocus>','input',tx('Der Fokus landet direkt im Feld – richtig, wenn Eintippen die Hauptaufgabe ist.','Focus lands right in the field – correct when typing is the main task.')],
  ['<h3 autofocus>','h',tx('Die Überschrift bekommt den Fokus (dafür braucht sie <code>tabindex="-1"</code>). Screenreader lesen den Dialog dann von oben – gut, wenn vor den Feldern längerer Text steht.','The heading gets focus (it needs <code>tabindex="-1"</code> for that). Screen readers then read the dialog from the top – good when there’s longer text before the fields.')]],
 init(st,v){
  const k=v.attrs['data-ha-af'],el=k==='input'?$('input',st):k==='h'?$('h3',st):null;
  if(el){el.setAttribute('autofocus','');el.setAttribute('data-ha-hl','');if(k==='h')el.setAttribute('tabindex','-1')}
  return dbDialog(st,d=>d.showModal());
 },
 measure:st=>`${tx('Dialog','Dialog')}: ${dbState($('dialog',st))} · ${tx('Fokus','Focus')}: ${dbFocus(st)}`,
 tip:tx('Der Browser wertet <code>autofocus</code> genau beim <code>showModal()</code> aus. Rendert Angular den Inhalt erst danach (etwa per <code>@if</code> auf ein Signal, das beim Öffnen umspringt), ist das Attribut zu spät da – der Fokus landet dann woanders. Pro Dialog nur ein <code>autofocus</code>.','The browser evaluates <code>autofocus</code> exactly at <code>showModal()</code>. If Angular renders the content only afterwards (e.g. via <code>@if</code> on a signal that flips on open), the attribute arrives too late – focus lands elsewhere. Only one <code>autofocus</code> per dialog.')});

HTMLA.push({id:'closedby',cat:'behave',name:'closedby',sub:tx('Womit sich ein Dialog schließen lässt','What may close a dialog'),mdn:'Elements/dialog#closedby',keys:'dialog light dismiss esc schließen klick daneben backdrop neu new',
 desc:tx('<strong>Neu (seit 2025, zuerst in Chrome und Edge):</strong> <code>closedby</code> legt fest, womit ein <code>&lt;dialog&gt;</code> zugeht: <code>any</code> – <kbd>Esc</kbd>, Klick daneben (Light Dismiss) oder Button; <code>closerequest</code> – <kbd>Esc</kbd> oder Button; <code>none</code> – nur per Button oder Skript. Browser ohne Unterstützung ignorieren das Attribut und bleiben beim alten Verhalten.','<strong>New (since 2025, first in Chrome and Edge):</strong> <code>closedby</code> sets what closes a <code>&lt;dialog&gt;</code>: <code>any</code> – <kbd>Esc</kbd>, clicking outside (light dismiss) or a button; <code>closerequest</code> – <kbd>Esc</kbd> or a button; <code>none</code> – only a button or script. Browsers without support ignore the attribute and keep the old behaviour.'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-primary" data-ha-do="open">${tx('Neuigkeiten zeigen','Show news')}</button></div><dialog class="ha-dlg" aria-labelledby="ha-closedby-title"><h3 id="ha-closedby-title">${tx('Version 2.0 ist da','Version 2.0 is here')}</h3><p>${tx('Versuch <kbd>Esc</kbd>, Klick daneben und den Button.','Try <kbd>Esc</kbd>, clicking outside and the button.')}</p><div class="btn-row"><button type="button" class="btn btn-secondary" data-ha-do="close">${tx('Schließen','Close')}</button></div></dialog>`,
 t:'dialog',show:'dialog',fresh:true,
 vals:[[tx('ohne','none set'),null,tx('Standard: Modal geöffnet wirkt es wie <code>closerequest</code>, nicht modal wie <code>none</code>. Klick daneben schließt hier also nicht.','Default: opened modally it behaves like <code>closerequest</code>, non-modally like <code>none</code>. So clicking outside doesn’t close it here.')],
  ['any','any',tx('Jetzt schließt auch ein Klick auf den abgedunkelten Hintergrund – wie bei einem Popover. Früher brauchte das einen Klick-Handler auf dem Dialog.','Now a click on the dimmed background closes it too – like a popover. This used to need a click handler on the dialog.')],
  ['closerequest','closerequest',tx('<kbd>Esc</kbd> (am Android-Handy auch die Zurück-Geste) und der Button schließen, ein Klick daneben nicht.','<kbd>Esc</kbd> (on Android also the back gesture) and the button close it, clicking outside doesn’t.')],
  ['none','none',tx('Nur „Schließen“ geht. Sparsam einsetzen – wer <kbd>Esc</kbd> drückt, erwartet, dass etwas zugeht.','Only “Close” works. Use sparingly – people who press <kbd>Esc</kbd> expect something to close.')]],
 init(st){return dbDialog(st,d=>d.showModal())},
 measure:st=>{const d=$('dialog',st);if(!('closedBy' in HTMLDialogElement.prototype))return tx('Dein Browser kennt closedby noch nicht – das Attribut wird ignoriert.','Your browser doesn’t know closedby yet – the attribute is ignored.');return `${tx('Dialog','Dialog')}: ${dbState(d)}${d.open?` · ${tx('der Browser meldet','the browser reports')} dialog.closedBy = ${Q(d.closedBy)}`:''}`},
 tip:tx('<code>none</code> blockiert nur den Browser, nicht dich: Ein Dialog ohne sichtbaren Schließen-Button ist eine Falle. Und Light Dismiss (<code>any</code>) passt nicht zu Dialogen mit Eingaben – ein Fehlklick daneben, und der Text ist weg.','<code>none</code> only blocks the browser, not you: a dialog without a visible close button is a trap. And light dismiss (<code>any</code>) doesn’t suit dialogs with input – one stray click outside and the text is gone.')});

HTMLA.push({id:'popover',cat:'behave',name:'popover',sub:tx('auto, manual oder hint','auto, manual or hint'),mdn:'Global_attributes/popover',keys:'popup tooltip overlay einblendung light dismiss top layer hint neu',
 desc:tx('Das globale Attribut <code>popover</code> macht ein Element zur Einblendung im Top Layer – geöffnet von einem Button mit <code>popovertarget</code>, ganz ohne Skript. Der Wert bestimmt, wie es wieder zugeht. In allen großen Browsern seit 2024; <code>hint</code> ist neu.','The global attribute <code>popover</code> turns an element into an overlay in the top layer – opened by a button with <code>popovertarget</code>, no script at all. The value decides how it closes again. In all major browsers since 2024; <code>hint</code> is new.'),
 stage:`<div class="ha-popover-col"><button type="button" class="btn btn-secondary" popovertarget="ha-popover-a">${tx('Versand','Shipping')}</button><button type="button" class="btn btn-secondary" popovertarget="ha-popover-b">${tx('Rückgabe','Returns')}</button></div><div class="ha-pop" id="ha-popover-a" popover>${tx('2–3 Werktage, ab 50 € gratis.','2–3 working days, free from €50.')}</div><div class="ha-pop" id="ha-popover-b" popover>${tx('30 Tage kostenlos zurückschicken.','Free returns within 30 days.')}</div>`,
 t:'[popover]',show:'.ha-popover-col button, [popover]',fresh:true,
 vals:[['auto','auto',tx('Öffne „Versand“, dann „Rückgabe“: Das erste schließt sich. <kbd>Esc</kbd> oder ein Klick daneben schließt auch (Light Dismiss). <code>popover</code> ohne Wert ist dasselbe.','Open “Shipping”, then “Returns”: the first closes. <kbd>Esc</kbd> or a click outside closes too (light dismiss). <code>popover</code> without a value is the same.')],
  ['manual','manual',tx('Beide bleiben gleichzeitig offen, <kbd>Esc</kbd> und Klick daneben tun nichts – nur der Button schließt wieder. Für Hinweise, die stehen bleiben sollen, etwa Toasts.','Both stay open at once, <kbd>Esc</kbd> and clicking outside do nothing – only the button closes again. For things that should stay, such as toasts.')],
  ['hint','hint',tx('<strong>Neu (Chrome und Edge seit 2025):</strong> Verhält sich hier wie <code>auto</code>, schließt aber kein offenes <code>auto</code>-Popover – gedacht für Tooltips über einem geöffneten Menü. Browser ohne Unterstützung lesen <code>hint</code> als ungültigen Wert und damit als <code>manual</code>.','<strong>New (Chrome and Edge since 2025):</strong> behaves like <code>auto</code> here, but doesn’t close an open <code>auto</code> popover – meant for tooltips above an open menu. Browsers without support read <code>hint</code> as an invalid value and therefore as <code>manual</code>.')]],
 init(st){return ()=>$$('[popover]',st).forEach(p=>{try{p.hidePopover()}catch(x){}})},
 measure:st=>{const ps=$$('[popover]',st),open=ps.filter(p=>p.matches(':popover-open')).map(p=>Q($(`[popovertarget="${p.id}"]`,st).textContent));return `${tx('Offen','Open')}: ${open.join(', ')||tx('keins','none')} · ${tx('der Browser liest den Wert als','the browser reads the value as')} ${Q(ps[0].popover)}`},
 tip:tx('Ein Popover ist kein Dialog: keine eigene Rolle, keine Fokusfalle, die Seite bleibt bedienbar. Für eine Frage, die beantwortet werden muss, nimm <code>&lt;dialog&gt;</code>. Und ohne Positionierung steht ein Popover mitten im Fenster – an den Button hängt es erst CSS Anchor Positioning (hier genutzt) oder ein Skript.','A popover is not a dialog: no role of its own, no focus trap, the page stays usable. For a question that must be answered, use <code>&lt;dialog&gt;</code>. And without positioning a popover sits in the middle of the window – CSS anchor positioning (used here) or a script attaches it to the button.')});

HTMLA.push({id:'popovertarget',cat:'behave',name:'popovertarget',sub:tx('Button öffnet Popover – ohne Skript','A button opens a popover – no script'),mdn:'Elements/button#popovertarget',keys:'popovertargetaction toggle show hide popover button öffnen schließen',
 desc:tx('<code>popovertarget="id"</code> verbindet einen <code>&lt;button&gt;</code> mit dem Popover dieser ID. <code>popovertargetaction</code> sagt, was der Klick tut: umschalten (<code>toggle</code>, Standard), nur öffnen (<code>show</code>) oder nur schließen (<code>hide</code>).','<code>popovertarget="id"</code> connects a <code>&lt;button&gt;</code> to the popover with that ID. <code>popovertargetaction</code> says what the click does: toggle (<code>toggle</code>, default), only open (<code>show</code>) or only close (<code>hide</code>).'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-secondary" popovertarget="ha-popovertarget-p">${tx('Filter','Filters')}</button></div><div class="ha-pop" id="ha-popovertarget-p" popover><div class="ha-popovertarget-f"><label><input type="checkbox"> ${tx('Nur lagernd','In stock only')}</label><label><input type="checkbox"> ${tx('Mit Rabatt','On sale')}</label><button type="button" class="btn btn-secondary" popovertarget="ha-popovertarget-p" popovertargetaction="hide">${tx('Fertig','Done')}</button></div></div>`,
 t:'.btn-row > button',attr:'popovertargetaction',show:'.btn-row > button, [popover]',fresh:true,
 vals:[[tx('ohne (= toggle)','none (= toggle)'),null,tx('Klick öffnet, zweiter Klick schließt. Der Browser meldet dem Screenreader dabei selbst „erweitert“ bzw. „reduziert“.','Click opens, a second click closes. The browser reports “expanded” or “collapsed” to the screen reader by itself.')],
  ['show','show',tx('Klick öffnet, ein zweiter Klick lässt es offen. Zu geht es mit <kbd>Esc</kbd>, Klick daneben oder „Fertig“ – der hat <code>popovertargetaction="hide"</code>.','Click opens, a second click keeps it open. It closes with <kbd>Esc</kbd>, a click outside or “Done” – which has <code>popovertargetaction="hide"</code>.')],
  ['hide','hide',tx('Dieser Button kann nur schließen – hier öffnet er also nie etwas. Richtig für den Schließen-Button im Popover selbst.','This button can only close – so here it never opens anything. Right for the close button inside the popover itself.')]],
 init(st){return ()=>$$('[popover]',st).forEach(p=>{try{p.hidePopover()}catch(x){}})},
 measure:st=>`Popover: ${$('[popover]',st).matches(':popover-open')?tx('offen','open'):tx('zu','closed')}`,
 tip:tx('<code>popovertarget</code> wirkt nur auf <code>&lt;button&gt;</code> und <code>&lt;input type="button"&gt;</code>. Und in einem <code>&lt;form&gt;</code> muss es <code>type="button"</code> sein: Ein Submit-Button schickt das Formular ab und öffnet das Popover gar nicht.','<code>popovertarget</code> only works on <code>&lt;button&gt;</code> and <code>&lt;input type="button"&gt;</code>. And inside a <code>&lt;form&gt;</code> it must be <code>type="button"</code>: a submit button submits the form and doesn’t open the popover at all.')});

HTMLA.push({id:'command',cat:'behave',name:'command / commandfor',sub:tx('Invoker Commands: Buttons steuern Dialoge und Popover','Invoker commands: buttons control dialogs and popovers'),mdn:'Elements/button#command',keys:'invoker commands show-modal close toggle-popover commandfor neu new dialog ohne javascript',
 desc:tx('<strong>Neu (Chrome und Edge seit Version 135, 2025):</strong> <code>commandfor="id"</code> nennt das Ziel, <code>command</code> die Aktion – <code>show-modal</code>, <code>close</code>, <code>request-close</code>, <code>show-popover</code>, <code>hide-popover</code>, <code>toggle-popover</code> oder ein eigener Befehl mit <code>--</code>. Damit öffnet ein Button einen modalen Dialog ohne eine Zeile JavaScript.','<strong>New (Chrome and Edge since version 135, 2025):</strong> <code>commandfor="id"</code> names the target, <code>command</code> the action – <code>show-modal</code>, <code>close</code>, <code>request-close</code>, <code>show-popover</code>, <code>hide-popover</code>, <code>toggle-popover</code> or a custom command starting with <code>--</code>. A button can open a modal dialog without a single line of JavaScript.'),
 stage:`<div class="btn-row"><button type="button" class="btn btn-primary">…</button></div><dialog class="ha-dlg" id="ha-command-dlg" aria-labelledby="ha-command-title"><h3 id="ha-command-title">${tx('Ohne Skript geöffnet','Opened without script')}</h3><p>${tx('Der Button unten schließt mit <code>command="close"</code>.','The button below closes with <code>command="close"</code>.')}</p><div class="btn-row"><button type="button" class="btn btn-secondary" command="close" commandfor="ha-command-dlg">${tx('Schließen','Close')}</button></div></dialog><div class="ha-pop" id="ha-command-pop" popover>${tx('Tipp: <kbd>Strg</kbd>+<kbd>K</kbd> öffnet die Suche.','Tip: <kbd>Ctrl</kbd>+<kbd>K</kbd> opens search.')}</div><div class="ha-command-arrow" id="ha-command-arrow" role="img" aria-label="${tx('Pfeil nach oben','Arrow pointing up')}"><svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true"><path d="M12 3l7 8h-5v10h-4V11H5z" fill="currentColor"/></svg></div>`,
 t:'.btn-row:first-child > button',show:'.btn-row:first-child > button, #ha-command-dlg, #ha-command-pop, #ha-command-arrow',fresh:true,
 vals:[['show-modal',{command:'show-modal',commandfor:'ha-command-dlg'},tx('Öffnet den Dialog wie <code>showModal()</code>. Der Button im Dialog schließt mit <code>command="close"</code>.','Opens the dialog like <code>showModal()</code>. The button inside the dialog closes it with <code>command="close"</code>.')],
  ['toggle-popover',{command:'toggle-popover',commandfor:'ha-command-pop'},tx('Dasselbe wie <code>popovertarget</code> – nur in der einheitlichen Schreibweise für alle Ziele.','The same as <code>popovertarget</code> – just in the uniform syntax for all targets.')],
  ['--rotate',{command:'--rotate',commandfor:'ha-command-arrow'},tx('Eigene Befehle beginnen mit <code>--</code>. Der Browser tut selbst nichts, sondern feuert am Ziel ein <code>command</code>-Event; ein Skript reagiert: <code>el.addEventListener(\'command\', e =&gt; { if (e.command === \'--rotate\') … })</code>.','Custom commands start with <code>--</code>. The browser does nothing by itself but fires a <code>command</code> event at the target; a script reacts: <code>el.addEventListener(\'command\', e =&gt; { if (e.command === \'--rotate\') … })</code>.')]],
 init(st,v){
  const native='command' in HTMLButtonElement.prototype,cmd=v.attrs.command,tgt=$('#'+v.attrs.commandfor,st),btn=$('.btn-row:first-child > button',st);
  btn.textContent=cmd==='show-modal'?tx('Dialog öffnen','Open dialog'):cmd==='toggle-popover'?tx('Tipp zeigen','Show tip'):tx('Pfeil drehen','Rotate arrow');
  ['ha-command-dlg','ha-command-pop','ha-command-arrow'].forEach(id=>{const el=$('#'+id,st);if(el!==tgt){el.setAttribute('data-ha-hide','');if(id==='ha-command-arrow')el.hidden=true}});
  st.dataset.haCmd='0';
  const dirs=[tx('oben','up'),tx('rechts','right'),tx('unten','down'),tx('links','left')],arrow=$('#ha-command-arrow',st);
  const onCmd=e=>{if(e.command!=='--rotate')return;const n=((+arrow.dataset.haRot||0)+1)%4;arrow.dataset.haRot=n;arrow.setAttribute('aria-label',tx(`Pfeil nach ${dirs[n]}`,`Arrow pointing ${dirs[n]}`));st.dataset.haCmd=+st.dataset.haCmd+1};
  arrow.addEventListener('command',onCmd);
  /* Ersatzskript für Browser ohne Invoker Commands – so läuft die Vorschau überall */
  const poly=e=>{
    if(native)return;const b=e.target.closest('button[commandfor]');if(!b||!st.contains(b))return;
    const t=document.getElementById(b.getAttribute('commandfor')),c=b.getAttribute('command')||'';if(!t)return;
    if(c==='show-modal'&&!t.open)t.showModal();else if(c==='close'&&t.open)t.close();
    else if(c==='toggle-popover')t.togglePopover();else if(c==='show-popover')t.showPopover();else if(c==='hide-popover')t.hidePopover();
    else if(c.startsWith('--')){const ev=new Event('command');ev.command=c;ev.source=b;t.dispatchEvent(ev)}
  };
  st.addEventListener('click',poly);
  return ()=>{st.removeEventListener('click',poly);arrow.removeEventListener('command',onCmd);$$('dialog',st).forEach(d=>{if(d.open)d.close()});$$('[popover]',st).forEach(p=>{try{p.hidePopover()}catch(x){}})};
 },
 measure:st=>{const native='command' in HTMLButtonElement.prototype,r=$('#ha-command-arrow',st);return (native?tx('Dein Browser unterstützt command/commandfor nativ.','Your browser supports command/commandfor natively.'):tx('Dein Browser kennt command/commandfor noch nicht – die Vorschau ergänzt ein kleines Ersatzskript.','Your browser doesn’t know command/commandfor yet – the preview adds a small fallback script.'))+(r&&!r.hidden?` · ${tx('command-Events','command events')}: ${st.dataset.haCmd||0}`:'')},
 tip:tx('In Browsern ohne Unterstützung passiert beim Klick schlicht nichts. Rückfall: mit <code>\'command\' in HTMLButtonElement.prototype</code> prüfen und sonst per <code>click</code>-Listener selbst <code>showModal()</code> aufrufen (wie diese Vorschau) oder ein Polyfill laden. Und wie bei <code>popovertarget</code>: In einem Formular wirkt es nur mit <code>type="button"</code>.','In browsers without support a click simply does nothing. Fallback: check <code>\'command\' in HTMLButtonElement.prototype</code> and otherwise call <code>showModal()</code> yourself in a <code>click</code> listener (like this preview does) or load a polyfill. And as with <code>popovertarget</code>: inside a form it only works with <code>type="button"</code>.')});

HTMLA.push({id:'inert',cat:'behave',name:'inert',sub:tx('Einen Bereich komplett stummschalten','Switching an area off completely'),mdn:'Global_attributes/inert',keys:'deaktivieren disable sperren fokus focus screenreader klick tab',
 desc:tx('<code>inert</code> macht einen ganzen Bereich unerreichbar: nicht klickbar, nicht fokussierbar, für Screenreader unsichtbar und von der Seitensuche übersprungen. Ein einziges Attribut statt <code>disabled</code> auf jedem Feld plus <code>aria-hidden</code>. In allen großen Browsern seit 2023.','<code>inert</code> makes a whole area unreachable: not clickable, not focusable, invisible to screen readers and skipped by find-in-page. One attribute instead of <code>disabled</code> on every field plus <code>aria-hidden</code>. In all major browsers since 2023.'),
 stage:`<div class="ha-inert-wrap"><form class="ha-inert-form"><div class="field"><label for="ha-inert-code">${tx('Gutscheincode','Voucher code')}</label><input class="input" id="ha-inert-code" name="code"></div><button class="btn btn-secondary">${tx('Einlösen','Redeem')}</button></form><button type="button" class="btn btn-primary">${tx('Zur Kasse','Checkout')}</button></div>`,
 t:'form',attr:'inert',show:'form, .ha-inert-wrap > .btn-primary',ax:'form button',
 vals:[[tx('ohne inert','no inert'),null,tx('Alles bedienbar: <kbd>Tab</kbd> geht durch Feld, „Einlösen“ und „Zur Kasse“.','Everything works: <kbd>Tab</kbd> goes through the field, “Redeem” and “Checkout”.')],
  ['inert',true,tx('<kbd>Tab</kbd> springt direkt zu „Zur Kasse“, Klicks ins Feld gehen ins Leere, der Screenreader überspringt den Bereich. Das Ausgrauen macht hier CSS (<code>form[inert] { opacity: .5 }</code>) – der Browser zeigt <code>inert</code> nicht an.','<kbd>Tab</kbd> jumps straight to “Checkout”, clicks into the field go nowhere, the screen reader skips the area. The greying out is CSS here (<code>form[inert] { opacity: .5 }</code>) – the browser doesn’t show <code>inert</code> visually.')]],
 tip:tx('Setzt du <code>inert</code> auf den Bereich, in dem gerade der Fokus steht, fällt der Fokus auf <code>&lt;body&gt;</code> zurück – verschieb ihn vorher bewusst. Für modale Dialoge brauchst du <code>inert</code> nicht: <code>showModal()</code> sperrt den Rest der Seite automatisch.','If you put <code>inert</code> on the area that currently holds focus, focus falls back to <code>&lt;body&gt;</code> – move it deliberately first. You don’t need <code>inert</code> for modal dialogs: <code>showModal()</code> blocks the rest of the page automatically.')});

HTMLA.push({id:'hidden-until-found',cat:'behave',name:'hidden="until-found"',sub:tx('Versteckt, aber per Strg+F auffindbar','Hidden, but findable with Ctrl+F'),mdn:'Global_attributes/hidden#the_hidden_until_found_state',keys:'hidden until-found beforematch suchen find in page zugeklappt collapsed neu',
 desc:tx('<code>hidden</code> blendet ein Element komplett aus – auch für Screenreader und die Seitensuche. <code>hidden="until-found"</code> versteckt ebenso, aber die Seitensuche (<kbd>Strg</kbd>+<kbd>F</kbd>) findet den Text: Der Browser feuert <code>beforematch</code>, entfernt <code>hidden</code> und scrollt hin. <strong>Neu:</strong> Chrome und Edge seit 2022, Firefox seit 2025; wo es fehlt, wirkt es wie normales <code>hidden</code>.','<code>hidden</code> hides an element completely – for screen readers and find-in-page too. <code>hidden="until-found"</code> hides it as well, but find-in-page (<kbd>Ctrl</kbd>+<kbd>F</kbd>) finds the text: the browser fires <code>beforematch</code>, removes <code>hidden</code> and scrolls there. <strong>New:</strong> Chrome and Edge since 2022, Firefox since 2025; where it’s missing, it acts like plain <code>hidden</code>.'),
 stage:`<h3 class="ha-huf-h"><button type="button" aria-expanded="false" aria-controls="ha-hidden-until-found-p">${tx('Pflegehinweise','Care instructions')}</button></h3><div id="ha-hidden-until-found-p"><p>${tx('Bei 30 °C waschen, nicht in den Trockner. Die Farbe Zitronenfalter kann beim ersten Waschen leicht abfärben.','Wash at 30 °C, do not tumble dry. The colour brimstone may bleed slightly in the first wash.')}</p></div>`,
 t:'#ha-hidden-until-found-p',attr:'hidden',show:'.ha-huf-h, #ha-hidden-until-found-p',ax:'.ha-huf-h button',fresh:true,
 vals:[['hidden',true,tx('Drück <kbd>Strg</kbd>+<kbd>F</kbd> und such „Zitronenfalter“: Der Browser findet das Wort nur hier im Hinweis und im Code – der zugeklappte Text ist für ihn nicht da.','Press <kbd>Ctrl</kbd>+<kbd>F</kbd> and search for “brimstone”: the browser only finds the word here in the note and in the code – the collapsed text doesn’t exist for it.')],
  ['until-found','until-found',tx('Such wieder „Zitronenfalter“: Der erste Treffer liegt im zugeklappten Text – der Abschnitt klappt auf, <code>beforematch</code> zählt hoch und das Skript setzt <code>aria-expanded="true"</code>.','Search for “brimstone” again: the first match is in the collapsed text – the section expands, <code>beforematch</code> counts up and the script sets <code>aria-expanded="true"</code>.')]],
 init(st,v){
  const p=$('#ha-hidden-until-found-p',st),b=$('.ha-huf-h button',st),hid=v.attrs.hidden===true?'':v.attrs.hidden;
  st.dataset.haBm='0';
  const click=()=>{const show=p.hasAttribute('hidden');if(show)p.removeAttribute('hidden');else p.setAttribute('hidden',hid);b.setAttribute('aria-expanded',String(show))};
  const bm=()=>{st.dataset.haBm=+st.dataset.haBm+1;b.setAttribute('aria-expanded','true')};
  b.addEventListener('click',click);p.addEventListener('beforematch',bm);
  return ()=>{b.removeEventListener('click',click);p.removeEventListener('beforematch',bm)};
 },
