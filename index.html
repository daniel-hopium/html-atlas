 desc:tx('<code>dir</code> legt die Schreibrichtung fest: <code>ltr</code>, <code>rtl</code> oder <code>auto</code> (aus dem Inhalt). Mischen sich Richtungen in einer Zeile – etwa arabische oder hebräische Namen in deutschem Text –, braucht der fremde Teil eine Isolierung, sonst würfelt der Browser Satzzeichen und Zahlen durcheinander.','<code>dir</code> sets the writing direction: <code>ltr</code>, <code>rtl</code> or <code>auto</code> (from the content). When directions mix in one line – say Arabic or Hebrew names in English text – the foreign part needs isolation, otherwise the browser scrambles punctuation and numbers.'),
 mode:'html',
 vals:[
  ['<span>',haBBidi('<span class="name">','</span>'),tx('Ohne Isolierung verhakt sich der Name mit Doppelpunkt und Zahl: Der Browser zieht „: 12“ in den Rechts-nach-links-Abschnitt, und die Zeile liest sich wie „12 :إيان Beiträge“. Beim hebräischen Namen genauso.','Without isolation the name hooks onto the colon and the number: the browser pulls “: 12” into the right-to-left run, and the line reads like “12 :إيان posts”. Same with the Hebrew name.')],
  ['<bdi>',haBBidi('<bdi>','</bdi>'),tx('<code>&lt;bdi&gt;</code> isoliert den Namen: Er bekommt seine eigene Richtung, der Rest der Zeile bleibt unberührt. Ideal für Inhalte, deren Sprache du nicht kennst – Benutzernamen, Kommentare, Suchbegriffe.','<code>&lt;bdi&gt;</code> isolates the name: it gets its own direction and the rest of the line stays untouched. Ideal for content whose language you don’t know – user names, comments, search terms.')],
  ['dir="auto"',haBBidi('<span class="name" dir="auto">','</span>'),tx('Gleiche Wirkung: Jedes Element mit <code>dir</code> wird isoliert, und <code>auto</code> nimmt die Richtung vom ersten „starken“ Buchstaben. Praktisch, wenn es ohnehin ein <code>&lt;span&gt;</code> gibt.','Same effect: every element with <code>dir</code> is isolated, and <code>auto</code> takes the direction from the first “strong” letter. Handy when there’s a <code>&lt;span&gt;</code> anyway.')]
 ],
 measure:st=>{
  const el=$('[data-ha-hl]',st),cs=getComputedStyle(el),iso=cs.unicodeBidi!=='normal';
  return tx(`Arabischer Name: unicode-bidi: ${cs.unicodeBidi} · direction: ${cs.direction} → ${iso?'isoliert':'nicht isoliert, mischt sich mit der Umgebung'}`,`Arabic name: unicode-bidi: ${cs.unicodeBidi} · direction: ${cs.direction} → ${iso?'isolated':'not isolated, mixes with its surroundings'}`);
 },
 tip:tx('Für ganze Seiten auf Arabisch oder Hebräisch gehört <code>dir="rtl"</code> ans <code>&lt;html&gt;</code> – nicht <code>direction: rtl</code> ins CSS, denn die Richtung ist Inhalt, nicht Gestaltung. Das Layout dann mit logischen Eigenschaften bauen (<code>margin-inline-start</code> statt <code>margin-left</code>), damit es sich mitdreht. Eingabefelder für beliebige Sprachen bekommen <code>dir="auto"</code>.','For whole pages in Arabic or Hebrew, put <code>dir="rtl"</code> on <code>&lt;html&gt;</code> – not <code>direction: rtl</code> in CSS, because direction is content, not styling. Then build the layout with logical properties (<code>margin-inline-start</code> instead of <code>margin-left</code>) so it flips along. Input fields for any language get <code>dir="auto"</code>.')});

HTMLA.push({id:'translate-attr',cat:'global',name:'translate',sub:tx('Nicht übersetzen','Do not translate'),mdn:'Global_attributes/translate',keys:'übersetzen translation übersetzer translator google notranslate name marke brand',
 desc:tx('<code>translate="no"</code> sagt Übersetzungswerkzeugen – etwa dem eingebauten Übersetzer in Chrome und Edge oder Google Übersetzer –, dass dieser Text unverändert bleiben muss. Die Übersetzung in der Messzeile ist eine Simulation.','<code>translate="no"</code> tells translation tools – such as the built-in translator in Chrome and Edge or Google Translate – that this text must stay unchanged. The translation in the line below is a simulation.'),
 mode:'html',
 vals:[
  [tx('ohne','none'),'<p lang="de">Dein Termin bei Frau <span data-ha-hl>Koch</span> ist am Montag.</p>',tx('Maschinelle Übersetzer übersetzen alles – auch den Namen: Aus Frau Koch wird „Mrs. Cook“.','Machine translators translate everything – the name too: Frau Koch becomes “Mrs. Cook”.')],
  ['translate="no"','<p lang="de">Dein Termin bei Frau <span translate="no" data-ha-hl>Koch</span> ist am Montag.</p>',tx('Der Name bleibt, der Rest wird übersetzt. Richtig für Personen- und Produktnamen, Marken, Code und Befehle, die genau so getippt werden müssen.','The name stays, the rest is translated. Right for names of people and products, brands, code and commands that must be typed exactly like that.')],
  [tx('geerbt','inherited'),'<p lang="de" translate="no" data-ha-hl>Dein Termin bei Frau <span>Koch</span> ist am Montag.</p>',tx('Der Wert vererbt sich: Am Absatz bleibt der ganze Inhalt unübersetzt. Mit <code>translate="yes"</code> gibst du einzelne Kinder wieder frei.','The value is inherited: on the paragraph, all of its content stays untranslated. With <code>translate="yes"</code> you can re-enable individual children.')]
 ],
 measure:st=>{
  const p=$('p',st),D={'Dein Termin bei Frau':'Your appointment with Mrs.','Koch':'Cook','ist am Montag.':'is on Monday.'};
  const out=[...p.childNodes].map(n=>{const t=clean(n.textContent),el=n.nodeType===1?n:n.parentElement;return el.translate?(D[t]||t):t}).join(' ');
  return tx(`Simulierte Übersetzung ins Englische: „${out}“ · span.translate: ${$('span',p).translate}`,`Simulated translation into English: “${out}” · span.translate: ${$('span',p).translate}`);
 },
 tip:tx('Nicht übertreiben: Wer auf Übersetzung angewiesen ist, steht vor ganzen Absätzen mit <code>translate="no"</code> im Regen. Nur schützen, was wörtlich bleiben muss. Die Klasse <code>notranslate</code> versteht Google auch, sie ist aber kein Standard.','Don’t overdo it: people who rely on translation are stuck with whole paragraphs marked <code>translate="no"</code>. Only protect what must stay verbatim. Google also understands the class <code>notranslate</code>, but it isn’t a standard.')});

HTMLA.push({id:'id-attr',cat:'global',name:'id',sub:tx('Eindeutiger Name und Sprungziel','Unique name and jump target'),mdn:'Global_attributes/id',keys:'id fragment anker anchor sprungziel target eindeutig unique doppelt duplicate getelementbyid css.escape',
 desc:tx('Eine <code>id</code> muss im ganzen Dokument eindeutig sein. Sie ist Sprungziel für <code>#id</code>-Links, Anker für <code>&lt;label for&gt;</code> und <code>aria-labelledby</code> und Griff für Skript und CSS. Klick die Links in der Vorschau.','An <code>id</code> must be unique in the whole document. It’s the jump target for <code>#id</code> links, the anchor for <code>&lt;label for&gt;</code> and <code>aria-labelledby</code>, and a handle for scripts and CSS. Click the links in the preview.'),
 stage:`<p class="ha-id-attr-toc"><a href="#ha-id-attr-shipping">${tx('Versand','Shipping')}</a> · <a href="#ha-id-attr-returns">${tx('Rückgabe','Returns')}</a></p><div class="ha-id-attr-box"><h3 id="ha-id-attr-shipping">${tx('Versand','Shipping')}</h3><p>${tx('2–3 Werktage, ab 50 € gratis.','2–3 working days, free from €50.')}</p><h3>${tx('Rückgabe','Returns')}</h3><p>${tx('30 Tage, kostenlos.','30 days, free of charge.')}</p></div>`,
 t:'.ha-id-attr-box h3:last-of-type',attr:'id',show:'a, h3',fresh:true,
 vals:[
  [tx('passt','matches'),{id:'ha-id-attr-returns','data-ha-href':null},tx('Der Browser scrollt zur Überschrift mit genau dieser <code>id</code> und markiert sie als <code>:target</code> (hier farbig hinterlegt).','The browser scrolls to the heading with exactly this <code>id</code> and marks it as <code>:target</code> (highlighted here).')],
  [tx('Tippfehler','typo'),{id:'ha-id-attr-return','data-ha-href':null},tx('„return“ statt „returns“: Der Link findet kein Ziel und tut – nichts. Keine Fehlermeldung, kein Hinweis. Groß- und Kleinschreibung zählt ebenfalls.','“return” instead of “returns”: the link finds no target and does – nothing. No error, no hint. Upper and lower case matter too.')],
  [tx('doppelt','duplicate'),{id:'ha-id-attr-shipping','data-ha-href':null},tx('Zweimal dieselbe <code>id</code>: Der Link springt zur ersten, <code>getElementById()</code> liefert die erste – und <code>&lt;label for&gt;</code> oder <code>aria-labelledby</code> treffen womöglich das falsche Element.','The same <code>id</code> twice: the link jumps to the first one, <code>getElementById()</code> returns the first – and <code>&lt;label for&gt;</code> or <code>aria-labelledby</code> may hit the wrong element.')],
  [tx('mit Punkt','with a dot'),{id:'ha-id-attr-faq.returns','data-ha-href':'#ha-id-attr-faq.returns'},tx('Punkte, Doppelpunkte und Ziffern am Anfang sind in HTML erlaubt, der Link funktioniert. Aber in CSS und <code>querySelector()</code> heißt <code>#faq.returns</code> „id faq mit Klasse returns“. Abhilfe: <code>CSS.escape(id)</code> oder <code>getElementById()</code>.','Dots, colons and leading digits are allowed in HTML, and the link works. But in CSS and <code>querySelector()</code>, <code>#faq.returns</code> means “id faq with class returns”. The fix: <code>CSS.escape(id)</code> or <code>getElementById()</code>.')]
 ],
 init(st){
  const h=$('.ha-id-attr-box h3:last-of-type',st);
  if(h.dataset.haHref)$$('a',st)[1].setAttribute('href',h.dataset.haHref);
  return haBJump(st);
 },
 measure:st=>{
  const ids=$$('[id]',st),r=$$('a',st).map(a=>{
   const id=decodeURIComponent(a.getAttribute('href').slice(1)),n=ids.filter(x=>x.id===id).length;
   return `#${id} → ${n===0?tx('kein Ziel','no target'):n===1?tx('1 Ziel','1 target'):tx(`${n} Ziele, das erste gewinnt`,`${n} targets, the first one wins`)}`;
  });
  const h=$('.ha-id-attr-box h3:last-of-type',st);
  if(h.id.includes('.')){let q=false;try{q=!!st.querySelector('#'+h.id)}catch(e){}r.push(tx(`querySelector("#${h.id}") findet ${q?'es':'nichts'}, mit CSS.escape() schon`,`querySelector("#${h.id}") finds ${q?'it':'nothing'}, with CSS.escape() it does`))}
  return r.join(' · ');
 },
 tip:tx('Angular-Falle: Mit <code>&lt;base href="/"&gt;</code> im Kopf löst sich <code>href="#faq"</code> gegen die Basis auf – zu <code>/#faq</code>, also zur Startseite. Nimm <code>&lt;a [routerLink]="[]" fragment="faq"&gt;</code> und schalte das Scrollen mit <code>withInMemoryScrolling({ anchorScrolling: "enabled" })</code> ein.','Angular trap: with <code>&lt;base href="/"&gt;</code> in the head, <code>href="#faq"</code> resolves against the base – to <code>/#faq</code>, i.e. the home page. Use <code>&lt;a [routerLink]="[]" fragment="faq"&gt;</code> and enable scrolling with <code>withInMemoryScrolling({ anchorScrolling: "enabled" })</code>.')});

HTMLA.push({id:'data-attr',cat:'global',name:'data-*',sub:tx('Eigene Daten am Element','Your own data on the element'),mdn:'Global_attributes/data-*',keys:'data dataset eigene attribute custom attributes camelcase string',
 desc:tx('<code>data-</code> plus ein eigener Name speichert Daten am Element, die Skript oder CSS brauchen – eine Produkt-ID, einen Zustand. Im Skript liest du sie über <code>element.dataset</code>.','<code>data-</code> plus a name of your own stores data on the element that scripts or CSS need – a product ID, a state. In scripts you read them via <code>element.dataset</code>.'),
 stage:`<div class="ha-data-attr-card"><h3>${tx('Espressotasse','Espresso cup')}</h3><p class="ha-data-attr-price">12,90 €</p><button type="button" class="btn btn-primary">${tx('In den Warenkorb','Add to cart')}</button></div>`,
 t:'.ha-data-attr-card',
 vals:[
  ['data-product-id',{'data-product-id':'4711','data-in-stock':null,'data-state':null},tx('Aus <code>data-product-id</code> wird <code>dataset.productId</code>: Präfix weg, Bindestrich plus Buchstabe wird zum Großbuchstaben (camelCase). Klick den Button – das Skript liest die ID aus.','<code>data-product-id</code> becomes <code>dataset.productId</code>: prefix gone, hyphen plus letter becomes a capital (camelCase). Click the button – the script reads the ID.')],
  ['data-in-stock="false"',{'data-product-id':'4711','data-in-stock':'false','data-state':null},tx('Werte sind immer Strings. <code>"false"</code> ist ein nicht-leerer String und damit wahr – vergleiche ausdrücklich: <code>dataset.inStock === "true"</code>.','Values are always strings. <code>"false"</code> is a non-empty string and therefore truthy – compare explicitly: <code>dataset.inStock === "true"</code>.')],
  ['data-state="sold-out"',{'data-product-id':'4711','data-in-stock':'false','data-state':'sold-out'},tx('Auch CSS kann darauf reagieren: <code>[data-state="sold-out"]</code> graut die Karte aus. Der Button bleibt aber bedienbar – „ausverkauft“ braucht zusätzlich Text und <code>disabled</code>.','CSS can react too: <code>[data-state="sold-out"]</code> greys out the card. But the button stays operable – “sold out” also needs text and <code>disabled</code>.')]
 ],
 init(st){
  const on=ev=>{if(!ev.target.closest('button'))return;const d=$('.ha-data-attr-card',st).dataset;toast({msg:tx(`addToCart("${d.productId}") – auf Lager laut if (dataset.inStock): ${d.inStock?'ja':'nein'}`,`addToCart("${d.productId}") – in stock per if (dataset.inStock): ${d.inStock?'yes':'no'}`),type:'info'})};
  st.addEventListener('click',on);return ()=>st.removeEventListener('click',on);
 },
 measure:st=>{
  const d=$('.ha-data-attr-card',st).dataset;
  let s=`dataset = ${JSON.stringify({...d})}`;
  if('inStock' in d)s+=tx(` · if (dataset.inStock) → ${!!d.inStock}, weil "${d.inStock}" ein nicht-leerer String ist`,` · if (dataset.inStock) → ${!!d.inStock}, because "${d.inStock}" is a non-empty string`);
  return s;
 },
 tip:tx('<code>data-*</code> ist für Skript und CSS, nicht für Menschen: Screenreader lesen es nie vor. In Angular geht <code>[data-id]="x"</code> nicht, weil es keine gleichnamige Property gibt – richtig ist <code>[attr.data-id]="x"</code>.','<code>data-*</code> is for scripts and CSS, not for people: screen readers never read it. In Angular, <code>[data-id]="x"</code> doesn’t work because there is no property of that name – use <code>[attr.data-id]="x"</code>.')});

const haBTrash=(attrs,text)=>`<p><button type="button" class="btn btn-secondary"${attrs} data-ha-hl>${ic('trash')}${text?' '+text:''}</button></p>`;
HTMLA.push({id:'title-attr',cat:'global',name:'title',sub:tx('Tooltip mit Tücken','A tooltip with catches'),mdn:'Global_attributes/title',keys:'tooltip hover beschreibung description name icon button maus mouse touch',
 desc:tx('<code>title</code> zeigt beim Überfahren mit der Maus nach kurzer Verzögerung einen Tooltip und landet im Accessibility Tree – als Name, wenn sonst keiner da ist, sonst als Beschreibung. Per Tastatur und auf Touch-Geräten sieht man ihn nicht.','<code>title</code> shows a tooltip after a short delay when hovering with the mouse, and it lands in the accessibility tree – as the name if there is no other, otherwise as the description. With a keyboard or on touch devices it can’t be seen.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['title',haBTrash(` title="${tx('Löschen','Delete')}"`,''),tx('Der Name kommt aus <code>title</code> – für den Screenreader reicht das. Sehende bekommen den Tooltip aber nur mit der Maus: nicht per Tastatur, nicht am Handy. Fahr drüber und warte kurz.','The name comes from <code>title</code> – enough for the screen reader. But sighted people only get the tooltip with a mouse: not by keyboard, not on a phone. Hover and wait a moment.')],
  ['aria-label',haBTrash(` aria-label="${tx('Löschen','Delete')}"`,''),tx('Name für den Screenreader, aber gar kein Hinweis für Sehende. Beim bekannten Mistkübel geht das gerade noch – bei weniger eindeutigen Icons raten die Leute.','A name for the screen reader but no hint at all for sighted people. With the familiar bin icon that just about works – with less obvious icons people guess.')],
  [tx('sichtbarer Text','visible text'),haBTrash('',tx('Löschen','Delete')),tx('Die robusteste Lösung: sichtbarer Text. Alle sehen und hören dasselbe.','The most robust solution: visible text. Everyone sees and hears the same thing.')],
  [tx('Text + title','text + title'),haBTrash(` title="${tx('Eintrag endgültig löschen','Delete entry permanently')}"`,tx('Löschen','Delete')),tx('Zusatzinfo im <code>title</code> wird zur Beschreibung: Der Screenreader liest sie nach dem Namen vor, die Maus zeigt sie als Tooltip – alle anderen bekommen sie nie. Wichtiges gehört in sichtbaren Text.','Extra info in <code>title</code> becomes the description: the screen reader reads it after the name, the mouse shows it as a tooltip – everyone else never gets it. Important things belong in visible text.')]
 ],
 measure:st=>$('[data-ha-hl]',st).hasAttribute('title')
  ?tx('Tooltip: nur beim Überfahren mit der Maus, nach etwa einer Sekunde – nicht bei Tastaturfokus, nicht auf Touch-Geräten','Tooltip: only when hovering with the mouse, after about a second – not on keyboard focus, not on touch devices')
  :tx('Kein Tooltip','No tooltip'),
 tip:tx(`<code>title</code> ist kein Ersatz für ein sichtbares Label. Brauchst du einen echten Tooltip, bau einen eigenen, der auch bei Fokus erscheint, per <kbd>Esc</kbd> verschwindet und stehen bleibt, solange man ihn liest (${haBW('1.4.13')}).`,`<code>title</code> is no substitute for a visible label. If you need a real tooltip, build one that also appears on focus, disappears on <kbd>Esc</kbd> and stays while it’s being read (${haBW('1.4.13')}).`)});

HTMLA.push({id:'tabindex-attr',cat:'global',name:'tabindex',sub:tx('Wer den Fokus bekommt – und wann','Who gets focus – and when'),mdn:'Global_attributes/tabindex',keys:'tab reihenfolge order fokus focus fokussierbar focusable tastatur keyboard roving',
 desc:tx('<code>tabindex</code> macht Elemente fokussierbar oder nimmt sie aus der Tab-Reihenfolge. <code>0</code> reiht ein, <code>-1</code> erlaubt Fokus nur per Klick oder Skript, positive Zahlen drängeln sich vor. Drück in der Vorschau Tab und schau auf die Messzeile.','<code>tabindex</code> makes elements focusable or takes them out of the tab order. <code>0</code> joins the order, <code>-1</code> allows focus only by click or script, positive numbers jump the queue. Press Tab in the preview and watch the line below.'),
 stage:`<div class="ha-tabindex-attr-row"><button type="button" class="btn btn-secondary">${tx('Zurück','Back')}</button><div class="ha-tabindex-attr-card">${tx('Karte','Card')}</div><button type="button" class="btn btn-secondary">${tx('Weiter','Next')}</button><a href="/help">${tx('Hilfe','Help')}</a></div>`,
 t:'.ha-tabindex-attr-card',show:'.ha-tabindex-attr-row',ax:true,
 vals:[
  [tx('ohne','none'),null,tx('Ein <code>&lt;div&gt;</code> ist nicht fokussierbar: Tab springt von „Zurück“ direkt zu „Weiter“.','A <code>&lt;div&gt;</code> isn’t focusable: Tab jumps from “Back” straight to “Next”.')],
  ['0','0',tx('Fokussierbar, in der Reihenfolge des Quelltexts. Aber fokussierbar heißt nicht bedienbar: Die Karte hat keine Rolle und reagiert nicht auf Enter.','Focusable, in source order. But focusable doesn’t mean operable: the card has no role and doesn’t react to Enter.')],
  ['-1','-1',tx('Nicht per Tab, aber per Klick oder <code>element.focus()</code> – klick die Karte an. Richtig für Sprungziele, Dialog-Überschriften und Roving Tabindex (nur ein Element einer Gruppe ist per Tab erreichbar).','Not by Tab, but by click or <code>element.focus()</code> – click the card. Right for jump targets, dialog headings and roving tabindex (only one item of a group is reachable by Tab).')],
  ['3','3',tx('Positive Werte kommen <em>vor</em> allem mit <code>0</code> – auf der ganzen Seite. Die Karte ist jetzt das erste Tab-Ziel des Atlas, noch vor der Seitenleiste, und nach ihr geht es zurück an den Seitenanfang. Nie verwenden.','Positive values come <em>before</em> everything with <code>0</code> – on the whole page. The card is now the atlas’s first tab stop, even before the sidebar, and after it focus goes back to the top of the page. Never use this.')]
 ],
 measure:st=>{
  const card=$('.ha-tabindex-attr-card',st);
  const f=$$('a[href],button,[tabindex]',st).filter(el=>el.tabIndex>=0).sort((a,b)=>a.tabIndex>0&&b.tabIndex>0?a.tabIndex-b.tabIndex:a.tabIndex>0?-1:b.tabIndex>0?1:0);
  let s=tx('Tab-Reihenfolge: ','Tab order: ')+f.map((el,i)=>`${i+1} ${clean(el.textContent)}`).join(' → ');
  if(!f.includes(card))s+=card.hasAttribute('tabindex')?tx(' · „Karte“ nur per Klick oder focus()',' · “Card” only by click or focus()'):tx(' · „Karte“ gar nicht fokussierbar',' · “Card” not focusable at all');
  if(document.activeElement===card)s+=tx(' · Fokus auf der Karte',' · focus is on the card');
  return s;
 },
 tip:tx(`Faustregel: nur <code>0</code> und <code>-1</code>. Die Reihenfolge änderst du im Quelltext, nicht mit Zahlen (${haBW('2.4.3')}). Und <code>tabindex="0"</code> auf einem eigenen Bedienelement braucht dazu Rolle, Name und Tastatur-Handler – ein <code>&lt;button&gt;</code> bringt das alles schon mit.`,`Rule of thumb: only <code>0</code> and <code>-1</code>. Change the order in the source, not with numbers (${haBW('2.4.3')}). And <code>tabindex="0"</code> on a custom control also needs a role, a name and key handlers – a <code>&lt;button&gt;</code> already has all of that.`)});

HTMLA.push({id:'accesskey-attr',cat:'global',name:'accesskey',sub:tx('Tastenkürzel, die keiner findet','Shortcuts nobody finds'),mdn:'Global_attributes/accesskey',keys:'tastenkürzel shortcut hotkey tastatur keyboard alt',
 desc:tx('<code>accesskey</code> legt ein Tastenkürzel fest, das ein Element auslöst oder fokussiert. Welche Modifier-Taste dazugehört, entscheiden Browser und Betriebssystem – die Messzeile sagt, welche es bei dir ist.','<code>accesskey</code> sets a keyboard shortcut that activates or focuses an element. Browser and operating system decide which modifier key goes with it – the line below says which one applies for you.'),
 stage:`<p><button type="button" class="btn btn-primary ha-accesskey-attr-btn">${tx('Speichern','Save')}</button></p>`,
 t:'.ha-accesskey-attr-btn',fresh:true,
 vals:[
  [tx('ohne','none'),{accesskey:null,'data-ha-mn':null},tx('Kein Kürzel – der Normalfall.','No shortcut – the normal case.')],
  ['accesskey="s"',{accesskey:'s','data-ha-mn':null},tx('Drück das Kürzel aus der Messzeile: Der Button wird ausgelöst, als hättest du geklickt. Bei einem Eingabefeld würde es nur den Fokus bekommen.','Press the shortcut from the line below: the button is activated as if clicked. An input field would just receive focus.')],
  [tx('+ sichtbar','+ visible'),{accesskey:'s','data-ha-mn':true},tx('Ein unterstrichener Buchstabe verrät das Kürzel wie in Desktop-Programmen. Ohne so einen Hinweis findet es niemand – die Modifier-Taste kennt aber trotzdem kaum jemand.','An underlined letter reveals the shortcut like in desktop programs. Without such a hint nobody finds it – but hardly anyone knows the modifier key anyway.')]
 ],
 init(st){
  const b=$('.ha-accesskey-attr-btn',st),t=tx('Speichern','Save');
  if(b.hasAttribute('data-ha-mn'))b.innerHTML=`<span><span class="ha-accesskey-attr-mn">${t[0]}</span>${t.slice(1)}</span>`;
  b.addEventListener('click',()=>{b.dataset.haCount=(+b.dataset.haCount||0)+1;toast({msg:tx('Gespeichert (Demo)','Saved (demo)'),type:'success'})});
 },
 measure:st=>{
  const b=$('.ha-accesskey-attr-btn',st),k=b.accessKey,n=+b.dataset.haCount||0,cnt=tx(` · ${n}× ausgelöst`,` · activated ${n}×`);
  if(!k)return tx('Kein Tastenkürzel','No shortcut')+cnt;
  const mac=/Mac|iPhone|iPad/.test(navigator.platform),combo=b.accessKeyLabel||(mac?tx('Ctrl+Option+','Control+Option+'):/Firefox/.test(navigator.userAgent)?tx('Alt+Umschalt+','Alt+Shift+'):'Alt+')+k.toUpperCase();
  return tx(`Kürzel in deinem Browser: ${combo}`,`Shortcut in your browser: ${combo}`)+cnt;
 },
 tip:tx(`<code>accesskey</code> ist fast immer eine schlechte Idee: Die Kürzel kollidieren mit Browser, Screenreader und Betriebssystem, sind unsichtbar, und die Modifier-Taste wechselt je nach Browser. Eigene Kürzel lieber per JavaScript mit Modifier (wie <kbd>Strg</kbd>+<kbd>K</kbd> für die Suche in diesem Atlas) und einer sichtbaren Liste. Kürzel aus Einzeltasten ohne Modifier brauchen laut ${haBW('2.1.4')} eine Möglichkeit zum Abschalten.`,`<code>accesskey</code> is almost always a bad idea: the shortcuts collide with the browser, screen reader and operating system, they’re invisible, and the modifier key changes from browser to browser. Better build your own shortcuts in JavaScript with a modifier (like <kbd>Ctrl</kbd>+<kbd>K</kbd> for search in this atlas) and a visible list. Single-key shortcuts without a modifier need a way to turn them off per ${haBW('2.1.4')}.`)});

HTMLA.push({id:'contenteditable-attr',cat:'global',name:'contenteditable',sub:tx('Jedes Element bearbeitbar','Any element editable'),mdn:'Global_attributes/contenteditable',keys:'bearbeitbar editable rich text editor wysiwyg plaintext-only',
 desc:tx('<code>contenteditable</code> macht ein beliebiges Element bearbeitbar – die Grundlage fast aller Rich-Text-Editoren. Das HTML darunter zeigt live, was der Browser beim Tippen erzeugt.','<code>contenteditable</code> makes any element editable – the basis of nearly every rich text editor. The HTML below shows live what the browser produces while you type.'),
 stage:`<div class="ha-contenteditable-attr-box">${tx('Notiz: <b>morgen</b> Milch kaufen.','Note: buy milk <b>tomorrow</b>.')}</div>`,
 t:'.ha-contenteditable-attr-box',
 vals:[
  [tx('ohne','none'),null,tx('Normaler Text, nicht bearbeitbar.','Normal text, not editable.')],
  ['true','true',tx('Klick hinein und tipp. <kbd>Strg</kbd>/<kbd>⌘</kbd>+<kbd>B</kbd> macht Text fett, eingefügter Text bringt seine Formatierung mit – schau im HTML, was dabei entsteht.','Click inside and type. <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>B</kbd> makes text bold, pasted text brings its formatting along – watch what appears in the HTML.')],
  ['plaintext-only','plaintext-only',tx('Nur Text: <kbd>Strg</kbd>/<kbd>⌘</kbd>+<kbd>B</kbd> tut nichts, Eingefügtes verliert seine Formatierung. Seit 2025 in allen großen Browsern (Firefox als letzter, Version 136); ältere behandeln den unbekannten Wert wie „nicht bearbeitbar“.','Text only: <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>B</kbd> does nothing, pasted content loses its formatting. In all major browsers since 2025 (Firefox last, version 136); older ones treat the unknown value as “not editable”.')]
 ],
 measure:st=>{const b=$('.ha-contenteditable-attr-box',st);return tx(`isContentEditable: ${b.isContentEditable} · ${b.children.length} Element(e) im Inhalt · ${clean(b.textContent).length} Zeichen`,`isContentEditable: ${b.isContentEditable} · ${b.children.length} element(s) inside · ${clean(b.textContent).length} characters`)},
 tip:tx('Ein bearbeitbares <code>&lt;div&gt;</code> ist kein Formularfeld: kein <code>&lt;label&gt;</code>, kein <code>name</code>, kein <code>required</code>, kein <code>ngModel</code> ohne eigenen <code>ControlValueAccessor</code>. Für Screenreader braucht es <code>role="textbox"</code>, <code>aria-multiline="true"</code> und einen Namen. Und <code>innerHTML</code> aus so einem Feld ist ungeprüftes HTML – vor dem Speichern bereinigen (XSS).','An editable <code>&lt;div&gt;</code> isn’t a form field: no <code>&lt;label&gt;</code>, no <code>name</code>, no <code>required</code>, no <code>ngModel</code> without your own <code>ControlValueAccessor</code>. Screen readers need <code>role="textbox"</code>, <code>aria-multiline="true"</code> and a name. And <code>innerHTML</code> from such a field is unchecked HTML – sanitise it before saving (XSS).')});

HTMLA.push({id:'spellcheck-attr',cat:'global',name:'spellcheck',sub:tx('Rote Wellenlinien an oder aus','Red squiggles on or off'),mdn:'Global_attributes/spellcheck',keys:'rechtschreibung spelling rechtschreibprüfung spell check tippfehler typo datenschutz privacy',
 desc:tx('<code>spellcheck</code> bittet den Browser, Tippfehler in bearbeitbarem Text zu markieren – oder es zu lassen. Es ist nur ein Hinweis: Hat jemand die Prüfung im Browser ausgeschaltet, bleibt sie aus.','<code>spellcheck</code> asks the browser to mark typos in editable text – or not to. It’s only a hint: if someone switched checking off in their browser, it stays off.'),
 stage:`<div class="field ha-spellcheck-attr-field"><label for="ha-spellcheck-attr-in">${tx('Nachricht','Message')}</label><textarea class="input ha-spellcheck-attr-ta" id="ha-spellcheck-attr-in" rows="3">${tx('Ich freu mich auf das Treffn am Dienstg.','Looking forward to the meetng on Tuesdy.')}</textarea></div>`,
 t:'textarea',show:'.ha-spellcheck-attr-field',fresh:true,
 vals:[
  [tx('ohne','none'),null,tx('Der Browser entscheidet: Mehrzeilige Felder und <code>contenteditable</code> prüft er, einzeilige je nach Browser (Firefox standardmäßig nicht). Klick ins Feld – die Tippfehler bekommen eine rote Wellenlinie.','The browser decides: it checks multi-line fields and <code>contenteditable</code>, single-line ones depending on the browser (Firefox doesn’t by default). Click into the field – the typos get a red squiggle.')],
  ['true','true',tx('Erzwingt die Prüfung, auch in einzeiligen Feldern.','Forces checking, in single-line fields too.')],
  ['false','false',tx('Keine Prüfung. Richtig für Namen, E-Mail-Adressen, Codes und Benutzernamen – und für alles Vertrauliche: Chromes optionale „erweiterte Rechtschreibprüfung“ schickt den Text an Google.','No checking. Right for names, email addresses, codes and user names – and for anything confidential: Chrome’s optional “enhanced spell check” sends the text to Google.')]
 ],
 measure:st=>{const t=$('textarea',st);return tx(`textarea.spellcheck: ${t.spellcheck}${t.hasAttribute('spellcheck')?'':' (Standard des Browsers)'}`,`textarea.spellcheck: ${t.spellcheck}${t.hasAttribute('spellcheck')?'':' (browser default)'}`)},
 tip:tx('Passwort-Felder prüft kein Browser – aber sobald ein „Passwort anzeigen“-Button <code>type="password"</code> auf <code>text</code> umschaltet, schon. Mit erweiterter Prüfung wandert das Passwort dann zum Server. Solche Felder bekommen <code>spellcheck="false"</code>.','No browser checks password fields – but as soon as a “show password” button switches <code>type="password"</code> to <code>text</code>, it does. With enhanced checking the password then travels to a server. Give such fields <code>spellcheck="false"</code>.')});

const haBCaps=(s,m)=>m==='characters'?s.toUpperCase():m==='words'?s.replace(/(^|\s)(\p{Ll})/gu,(x,a,b)=>a+b.toUpperCase()):m==='none'||m==='off'?s:s.replace(/(^|[.!?]\s+)(\p{Ll})/gu,(x,a,b)=>a+b.toUpperCase());
HTMLA.push({id:'autocapitalize-attr',cat:'global',name:'autocapitalize',sub:tx('Großschreibung am Handy','Capitalisation on phones'),mdn:'Global_attributes/autocapitalize',keys:'großschreibung capitalization capitalisation handy mobile tastatur keyboard ios android',
 desc:tx('<code>autocapitalize</code> sagt der Bildschirmtastatur am Handy, wann sie automatisch auf Großbuchstaben umschaltet (Safari auf iOS, Chrome auf Android). Mit einer echten Tastatur wirkt es nicht – die Messzeile simuliert darum, was eine Handy-Tastatur aus deiner Eingabe machen würde.','<code>autocapitalize</code> tells the on-screen keyboard on phones when to switch to capitals automatically (Safari on iOS, Chrome on Android). It has no effect with a physical keyboard – so the line below simulates what a phone keyboard would make of your input.'),
 stage:`<div class="field ha-autocapitalize-attr-field"><label for="ha-autocapitalize-attr-in">${tx('Eingabe (tipp ruhig klein)','Input (type in lower case)')}</label><input class="input" id="ha-autocapitalize-attr-in" value="${tx('anna huber aus graz. danke!','anna huber from leeds. thanks!')}"></div>`,
 t:'input',show:'.ha-autocapitalize-attr-field',
 vals:[
  [tx('ohne','none'),null,tx('Die meisten Handy-Tastaturen schreiben dann den Satzanfang groß.','Most phone keyboards then capitalise the start of each sentence.')],
  ['sentences','sentences',tx('Großbuchstabe am Satzanfang – für Nachrichten und Kommentare.','Capital at the start of a sentence – for messages and comments.')],
  ['words','words',tx('Jedes Wort beginnt groß – für Namen und Orte. Bei „van der Bellen“ oder „de la Cruz“ müssen die Leute dann korrigieren.','Every word starts with a capital – for names and places. With “van der Bellen” or “de la Cruz” people then have to correct it.')],
  ['characters','characters',tx('Alles groß – für Kennzeichen oder Buchungscodes.','All capitals – for licence plates or booking codes.')],
  ['none','none',tx('Nichts wird automatisch groß – für Benutzernamen und Codes, bei denen Groß/Klein zählt. Der alte Wert <code>off</code> bedeutet dasselbe.','Nothing is capitalised automatically – for user names and codes where case matters. The old value <code>off</code> means the same.')]
 ],
 measure:st=>{const i=$('input',st),m=i.getAttribute('autocapitalize')||'sentences';return tx(`Simulation Handy-Tastatur: „${haBCaps(i.value,m)}“`,`Simulated phone keyboard: “${haBCaps(i.value,m)}”`)},
 tip:tx('Es ist nur die Startstellung der Umschalttaste – man kann jederzeit umschalten. Normalisiere die Daten also trotzdem selbst (<code>toUpperCase()</code> für Codes). Bei <code>type="email"</code>, <code>url</code> und <code>password</code> wird <code>autocapitalize</code> ignoriert; dort bleibt die Tastatur ohnehin klein.','It’s only the initial state of the shift key – people can always switch. So normalise the data yourself anyway (<code>toUpperCase()</code> for codes). For <code>type="email"</code>, <code>url</code> and <code>password</code>, <code>autocapitalize</code> is ignored; the keyboard stays lower case there anyway.')});

HTMLA.push({id:'draggable-attr',cat:'global',name:'draggable',sub:tx('Ziehbar machen – und die Alternative','Make it draggable – and the alternative'),mdn:'Global_attributes/draggable',keys:'drag and drop ziehen ziehen und ablegen sortieren sort reorder maus mouse',
 desc:tx('<code>draggable="true"</code> macht ein Element mit der Maus ziehbar. Was beim Ablegen passiert, ist JavaScript (<code>dragstart</code>, <code>dragover</code>, <code>drop</code>). Bilder und Links sind von Haus aus ziehbar, alles andere nicht.','<code>draggable="true"</code> makes an element draggable with the mouse. What happens on drop is JavaScript (<code>dragstart</code>, <code>dragover</code>, <code>drop</code>). Images and links are draggable by default, everything else isn’t.'),
 stage:`<ol class="ha-draggable-attr-list"><li>${tx('Milch','Milk')}</li><li>${tx('Brot','Bread')}</li><li>${tx('Eier','Eggs')}</li></ol>`,
 t:'.ha-draggable-attr-list li',show:'.ha-draggable-attr-list',fresh:true,
 vals:[
  [tx('ohne','none'),{draggable:null,'data-ha-kb':null},tx('Nicht ziehbar: Ziehen mit der Maus markiert nur Text.','Not draggable: dragging with the mouse just selects text.')],
  ['true',{draggable:'true','data-ha-kb':null},tx('Zieh einen Eintrag mit der Maus an eine andere Stelle. Mit Tastatur, Sprachsteuerung und oft auch per Touch geht hier nichts.','Drag an item to another position with the mouse. Keyboard, voice control and often touch get nowhere here.')],
  [tx('true + Buttons','true + buttons'),{draggable:'true','data-ha-kb':true},tx(`Dazu Buttons zum Verschieben: Jetzt klappt es auch per Tastatur, Touch und Sprachsteuerung. ${haBW('2.5.7')} verlangt für jede Ziehbewegung eine Alternative mit einfachem Klick.`,`Plus buttons for moving: now it works by keyboard, touch and voice control too. ${haBW('2.5.7')} requires a single-pointer alternative for every dragging movement.`)]
 ],
 init(st){
  const list=$('ol',st),items=$$('li',st);let drag=null;
  if(items[0].hasAttribute('data-ha-kb'))items.forEach(li=>{
   const n=clean(li.textContent);
   li.insertAdjacentHTML('beforeend',`<button type="button" class="ha-draggable-attr-mv" data-dir="-1" aria-label="${tx(`${n} nach oben`,`Move ${n} up`)}">${ic('up')}</button><button type="button" class="ha-draggable-attr-mv" data-dir="1" aria-label="${tx(`${n} nach unten`,`Move ${n} down`)}">${ic('down')}</button>`);
  });
  const on={
   click:ev=>{const b=ev.target.closest('.ha-draggable-attr-mv');if(!b)return;const li=b.closest('li'),up=b.dataset.dir==='-1',sib=up?li.previousElementSibling:li.nextElementSibling;if(!sib)return;up?sib.before(li):sib.after(li);b.focus()},
   dragstart:ev=>{drag=ev.target.closest('li[draggable="true"]');if(!drag)return;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',clean(drag.textContent))},
   dragover:ev=>{if(drag){ev.preventDefault();ev.dataTransfer.dropEffect='move'}},
   drop:ev=>{if(!drag)return;ev.preventDefault();const li=ev.target.closest('li');if(li&&li!==drag){const r=li.getBoundingClientRect();ev.clientY<r.top+r.height/2?li.before(drag):li.after(drag)}drag=null},
   dragend:()=>{drag=null}
  };
  Object.entries(on).forEach(([k,f])=>list.addEventListener(k,f));
 },
 measure:st=>tx('Reihenfolge: ','Order: ')+$$('li',st).map(li=>clean(li.firstChild.textContent)).join(' · '),
 tip:tx('Kein boolesches Attribut: <code>draggable</code> allein (ohne <code>="true"</code>) wirkt nicht. HTML-Drag-and-Drop ist eine reine Maus-Technik und funktioniert auf Touch-Geräten je nach Browser unterschiedlich – plane die Alternative (Buttons, Menü „Verschieben nach …“) immer mit. Auch Angulars <code>cdkDrag</code> bringt von sich aus keine vollständige Tastaturbedienung mit.','Not a boolean attribute: <code>draggable</code> alone (without <code>="true"</code>) does nothing. HTML drag and drop is a mouse-only technique and behaves differently on touch devices depending on the browser – always plan the alternative (buttons, a “Move to …” menu). Angular’s <code>cdkDrag</code> doesn’t come with full keyboard support either.')});

/* cat: forms */
HTMLA.push({id:'label',cat:'forms',name:'<label>',sub:tx('Das Feld beim Namen nennen','Giving a field its name'),mdn:'Elements/label',keys:'label for id beschriftung beschriften feldname accessible name',
 desc:tx('Ein <code>&lt;label&gt;</code> gibt einem Feld den sichtbaren <em>und</em> den zugänglichen Namen – den sagt der Screenreader beim Fokus an. Verknüpft wird über <code>for</code> = <code>id</code> oder indem das Label das Feld umschließt. Bonus: Ein Klick aufs Label setzt den Fokus ins Feld.','A <code>&lt;label&gt;</code> gives a field its visible <em>and</em> its accessible name – the one the screen reader announces on focus. It’s linked via <code>for</code> = <code>id</code> or by wrapping the field. Bonus: clicking the label puts focus in the field.'),
 mode:'html',ax:'input',
 vals:[
  ['for + id',`<div class="field"><label for="ha-label-mail" data-ha-hl>${tx('E-Mail','Email')}</label><input class="input" id="ha-label-mail" type="email" name="email"></div>`,tx('Klick auf „E-Mail“: Der Fokus springt ins Feld. Der Name im Accessibility Tree kommt aus dem Label.','Click “Email”: focus jumps into the field. The name in the accessibility tree comes from the label.')],
  [tx('umschließend','wrapping'),`<label class="field ha-label-wrap" data-ha-hl><span>${tx('E-Mail','Email')}</span><input class="input" type="email" name="email"></label>`,tx('Kein <code>for</code>, keine <code>id</code> – das Label umschließt das Feld. Wirkt genauso und ist praktisch bei Checkboxen.','No <code>for</code>, no <code>id</code> – the label wraps the field. Works the same and is handy for checkboxes.')],
  [tx('ohne <label>','no <label>'),`<div class="field"><span class="ha-label-fake" data-ha-hl>${tx('E-Mail','Email')}</span><input class="input" type="email" name="email"></div>`,tx('Ein <code>&lt;span&gt;</code> sieht aus wie ein Label, ist aber keins: Das Feld hat keinen Namen, NVDA sagt nur „Eingabefeld“. Ein Klick auf den Text tut nichts.','A <code>&lt;span&gt;</code> looks like a label but isn’t one: the field has no name, NVDA only says “edit”. Clicking the text does nothing.')],
  ['for ≠ id',`<div class="field"><label for="ha-label-email" data-ha-hl>${tx('E-Mail','Email')}</label><input class="input" id="ha-label-mail" type="email" name="email"></div>`,tx('Tippfehler: <code>for="ha-label-email"</code>, aber <code>id="ha-label-mail"</code>. Keine Fehlermeldung, nirgends – nur ein namenloses Feld.','Typo: <code>for="ha-label-email"</code> but <code>id="ha-label-mail"</code>. No error anywhere – just a nameless field.')]
 ],
 measure:st=>{const n=$('input',st).labels.length;return tx(`input.labels.length: ${n} – ${n?'Label verknüpft':'kein Label verknüpft'}`,`input.labels.length: ${n} – ${n?'label linked':'no label linked'}`)},
 tip:tx('Steht eine Angular-Komponente mehrfach auf der Seite (<code>@for</code>, wiederverwendete Formularteile), sind fest eingetragene <code>id</code>s doppelt – und jedes <code>for</code> zeigt auf das <em>erste</em> Feld mit dieser ID. IDs pro Instanz eindeutig machen, z. B. mit einem Zähler. Und: ein Label pro Feld, nie zwei Felder in einem Label.','If an Angular component appears several times on the page (<code>@for</code>, reused form parts), hard-coded <code>id</code>s are duplicated – and every <code>for</code> points to the <em>first</em> field with that ID. Make IDs unique per instance, e.g. with a counter. And: one label per field, never two fields in one label.')});

HTMLA.push({id:'inputmode',cat:'forms',name:'inputmode',sub:tx('Die Handy-Tastatur wählen','Choosing the phone keyboard'),mdn:'Global_attributes/inputmode',keys:'tastatur keyboard handy mobile numeric decimal ziffern virtuelle bildschirmtastatur',
 desc:tx('<code>inputmode</code> wählt die Bildschirmtastatur am Handy, ohne den Feldtyp zu ändern – also ohne Prüfung, Pfeile oder verschluckte Nullen wie bei <code>type="number"</code>. Werte: <code>text</code>, <code>numeric</code>, <code>decimal</code>, <code>tel</code>, <code>email</code>, <code>url</code>, <code>search</code>, <code>none</code>. Die Tastatur unten ist eine Simulation – am Desktop ändert sich nichts.','<code>inputmode</code> picks the on-screen keyboard on phones without changing the field type – so no validation, no arrows and no swallowed zeros as with <code>type="number"</code>. Values: <code>text</code>, <code>numeric</code>, <code>decimal</code>, <code>tel</code>, <code>email</code>, <code>url</code>, <code>search</code>, <code>none</code>. The keyboard below is a simulation – on desktop nothing changes.'),
 stage:`<div class="field ha-inputmode-f"><label for="ha-inputmode-in">${tx('Deine Angabe','Your input')}</label><input class="input" id="ha-inputmode-in" type="text" name="value"></div>`,
 t:'#ha-inputmode-in',show:'.ha-inputmode-f',fresh:true,
 vals:[
  [tx('ohne','none set'),null,tx('Standard: die Buchstabentastatur. Echte Tastaturen sehen je nach System und Sprache anders aus.','Default: the letter keyboard. Real keyboards look different depending on system and language.')],
  ['numeric','numeric',tx('Nur Ziffern – für PIN, TAN oder PLZ. Am iPhone ohne Minus und ohne Komma.','Digits only – for PINs, one-time codes or postcodes. On the iPhone without minus or decimal separator.')],
  ['decimal','decimal',tx('Ziffern plus Dezimaltrennzeichen – je nach Sprache Komma oder Punkt. Für Beträge.','Digits plus a decimal separator – comma or dot depending on the language. For amounts.')],
  ['tel','tel',tx('Telefon-Tastenfeld mit <kbd>+</kbd>, <kbd>*</kbd> und <kbd>#</kbd>.','Phone keypad with <kbd>+</kbd>, <kbd>*</kbd> and <kbd>#</kbd>.')],
  ['email','email',tx('Buchstaben mit <kbd>@</kbd> und Punkt griffbereit – aber ohne die Formatprüfung von <code>type="email"</code>.','Letters with <kbd>@</kbd> and dot at hand – but without the format check of <code>type="email"</code>.')],
  ['none','none',tx('Gar keine Bildschirmtastatur. Nur sinnvoll, wenn die Seite ihre eigene Eingabe mitbringt, etwa einen Ziffernblock an der Kasse.','No on-screen keyboard at all. Only makes sense if the page brings its own input, like a number pad at a till.')]
 ],
 /* Simulierte Handy-Tastatur, auch von enterkeyhint benutzt */
 kb(mode,enter){
  const key=(s,c)=>`<span class="ha-kbsim-k${c?' '+c:''}">${s}</span>`,row=ks=>`<div class="ha-kbsim-r">${ks.join('')}</div>`,letters=s=>[...s].map(c=>key(c));
  let body;
  if(mode==='none')body=`<p class="ha-kbsim-none">${tx('Keine Bildschirmtastatur','No on-screen keyboard')}</p>`;
  else if(/^(numeric|decimal|tel)$/.test(mode)){
   const last={numeric:['','0','⌫'],decimal:[tx(',','.'),'0','⌫'],tel:['+ * #','0','⌫']}[mode];
   body=[['1','2','3'],['4','5','6'],['7','8','9'],last].map(r=>row(r.map(s=>key(s||'&nbsp;','ha-kbsim-pad'+(s?'':' ha-kbsim-empty'))))).join('');
  }else{
   const extra={email:['@','.'],url:['/','.com']}[mode]||[];
   body=row(letters(tx('qwertzuiopü','qwertyuiop')))+row(letters(tx('asdfghjklöä','asdfghjkl')))+row([key('⇧','ha-kbsim-fn'),...letters(tx('yxcvbnm','zxcvbnm')),key('⌫','ha-kbsim-fn')])
    +row([key('123','ha-kbsim-fn'),...extra.map(s=>key(s,'ha-kbsim-fn')),key(tx('Leerzeichen','space'),'ha-kbsim-space'),key(esc(enter||'⏎'),'ha-kbsim-enter')]);
  }
  return `<div class="ha-kbsim" data-ha-hide aria-hidden="true"><p class="ha-kbsim-cap">${tx('Simulation: Bildschirmtastatur am Handy','Simulation: on-screen keyboard on a phone')}</p>${body}</div>`;
 },
 init(st){const m=$('input',st).getAttribute('inputmode')||'text';st.insertAdjacentHTML('beforeend',this.kb(m,m==='search'?tx('Suchen','search'):''))},
 tip:tx('<code>inputmode</code> ist nur ein Wunsch an die Tastatur, keine Prüfung: Über eine echte Tastatur oder beim Einfügen kommt trotzdem jedes Zeichen ins Feld. Für PIN oder PLZ also <code>type="text" inputmode="numeric"</code> <em>plus</em> eine Prüfung, etwa mit <code>pattern</code>.','<code>inputmode</code> is only a wish for the keyboard, not a check: a hardware keyboard or pasting still gets any character into the field. For PINs or postcodes use <code>type="text" inputmode="numeric"</code> <em>plus</em> a check, e.g. with <code>pattern</code>.')});

HTMLA.push({id:'enterkeyhint',cat:'forms',name:'enterkeyhint',sub:tx('Was auf der Enter-Taste steht','What the enter key says'),mdn:'Global_attributes/enterkeyhint',keys:'enter taste tastatur keyboard handy mobile senden weiter fertig',
 desc:tx('<code>enterkeyhint</code> legt fest, was auf der Enter-Taste der Bildschirmtastatur steht: <code>enter</code>, <code>done</code>, <code>go</code>, <code>next</code>, <code>previous</code>, <code>search</code> oder <code>send</code>. Ob ein Wort oder ein Symbol erscheint, entscheidet das System – die Tastatur unten ist eine Simulation.','<code>enterkeyhint</code> sets what the enter key of the on-screen keyboard shows: <code>enter</code>, <code>done</code>, <code>go</code>, <code>next</code>, <code>previous</code>, <code>search</code> or <code>send</code>. Whether a word or an icon appears is up to the system – the keyboard below is a simulation.'),
 stage:`<div class="field ha-enterkeyhint-f"><label for="ha-enterkeyhint-in">${tx('Nachricht','Message')}</label><input class="input" id="ha-enterkeyhint-in" type="text" name="message"></div>`,
 t:'#ha-enterkeyhint-in',show:'.ha-enterkeyhint-f',fresh:true,
 vals:[
  [tx('ohne','none set'),null,tx('Ohne Angabe wählt der Browser selbst, was auf der Taste steht.','Without it the browser decides what the key shows.')],
  ['next','next',tx('Für mehrteilige Formulare. Aber nur die Beschriftung – dass der Fokus wirklich ins nächste Feld springt, legt das Attribut nicht fest.','For multi-part forms. But it’s only the label – the attribute doesn’t make focus actually move to the next field.')],
  ['done','done',tx('Passt zum letzten Feld eines Formulars.','Fits the last field of a form.')],
  ['search','search',tx('Für Suchfelder.','For search fields.')],
  ['send','send',tx('Für Chat- und Nachrichtenfelder.','For chat and message fields.')],
  ['go','go',tx('Für Felder, die sofort etwas auslösen, etwa eine Adresszeile.','For fields that trigger something right away, like an address bar.')]
 ],
 init(st){const h=$('input',st).getAttribute('enterkeyhint'),lab={next:tx('Weiter','next'),done:tx('Fertig','done'),search:tx('Suchen','search'),send:tx('Senden','send'),go:tx('Los','go')}[h]||'';st.insertAdjacentHTML('beforeend',HTMLA.find(x=>x.id==='inputmode').kb('text',lab))},
 tip:tx('Das Attribut ändert nur die Beschriftung, nie das Verhalten. Drückt jemand „Senden“, kommt ganz normal ein <code>keydown</code> mit <code>key === "Enter"</code> an – was dann passiert, bestimmt dein Code bzw. das Formular (Enter in einem Textfeld schickt es ab).','The attribute only changes the label, never the behaviour. When someone presses “send”, a plain <code>keydown</code> with <code>key === "Enter"</code> arrives – what happens next is up to your code or the form (enter in a text field submits it).')});

HTMLA.push({id:'autocomplete',cat:'forms',name:'autocomplete',sub:tx('Autofill statt Tippen','Autofill instead of typing'),mdn:'Attributes/autocomplete',keys:'autofill ausfüllen passwort manager password wcag 1.3.5 email given-name one-time-code new-password',
 desc:tx('<code>autocomplete</code> sagt dem Browser, <em>was</em> in ein Feld gehört. Dann kann er gespeicherte Daten einsetzen, und Passwort-Manager wissen, was zu tun ist. Für Angaben über die Person selbst verlangt es <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.3.5">WCAG 1.3.5</a>. Klick ins Feld: Hat dein Browser passende Daten gespeichert, schlägt er sie vor.','<code>autocomplete</code> tells the browser <em>what</em> belongs in a field. Then it can fill in saved data, and password managers know what to do. For data about the user themselves <a class="xlink" href="https://daniel-hopium.github.io/pattern-library/#wcag-kriterien/1.3.5">WCAG 1.3.5</a> requires it. Click into the field: if your browser has matching data saved, it suggests it.'),
 mode:'html',
 vals:[
  ['email',`<div class="field"><label for="ha-autocomplete-mail">${tx('E-Mail','Email')}</label><input class="input" id="ha-autocomplete-mail" type="email" name="email" autocomplete="email" data-ha-hl></div>`,tx('Der Klassiker. Zusammen mit <code>type="email"</code> gibt es die passende Tastatur <em>und</em> Autofill.','The classic. Together with <code>type="email"</code> you get the right keyboard <em>and</em> autofill.')],
  ['given-name',`<div class="ha-form-grid"><div class="field"><label for="ha-autocomplete-gn">${tx('Vorname','First name')}</label><input class="input" id="ha-autocomplete-gn" name="firstName" autocomplete="given-name" data-ha-hl></div><div class="field"><label for="ha-autocomplete-fn">${tx('Nachname','Last name')}</label><input class="input" id="ha-autocomplete-fn" name="lastName" autocomplete="family-name" data-ha-hl></div></div>`,tx('Vor- und Nachname getrennt: <code>given-name</code> und <code>family-name</code>. Ein einzelnes Feld für den ganzen Namen bekommt <code>name</code>.','First and last name separately: <code>given-name</code> and <code>family-name</code>. A single field for the full name gets <code>name</code>.')],
  ['street-address',`<div class="field"><label for="ha-autocomplete-addr">${tx('Adresse','Address')}</label><textarea class="ha-textarea" id="ha-autocomplete-addr" name="address" rows="3" autocomplete="street-address" data-ha-hl></textarea></div>`,tx('<code>street-address</code> ist die ganze Anschrift, mehrzeilig – passt zu <code>&lt;textarea&gt;</code>. Für einzeilige Felder gibt es <code>address-line1</code>, dazu <code>postal-code</code> und <code>address-level2</code> (Ort).','<code>street-address</code> is the whole address, multi-line – it fits a <code>&lt;textarea&gt;</code>. For single-line fields there is <code>address-line1</code>, plus <code>postal-code</code> and <code>address-level2</code> (city).')],
  ['one-time-code',`<div class="field"><label for="ha-autocomplete-otp">${tx('Code aus der SMS','Code from the text message')}</label><input class="input" id="ha-autocomplete-otp" name="code" inputmode="numeric" autocomplete="one-time-code" data-ha-hl></div>`,tx('Safari auf iPhone und Mac schlägt den Code aus der SMS direkt über der Tastatur vor. Kein WCAG-Muss – der Code beschreibt ja nicht die Person.','Safari on iPhone and Mac suggests the code from the text message right above the keyboard. Not a WCAG must – the code doesn’t describe the person.')],
  ['current-/new-password',`<div class="ha-form-grid"><div class="field"><label for="ha-autocomplete-cur">${tx('Aktuelles Passwort','Current password')}</label><input class="input" id="ha-autocomplete-cur" type="password" name="currentPassword" autocomplete="current-password" data-ha-hl></div><div class="field"><label for="ha-autocomplete-new">${tx('Neues Passwort','New password')}</label><input class="input" id="ha-autocomplete-new" type="password" name="newPassword" autocomplete="new-password" data-ha-hl></div></div>`,tx('Passwort ändern: Das alte Feld bekommt <code>current-password</code> (der Passwort-Manager füllt es aus), das neue <code>new-password</code> (er schlägt ein starkes vor und speichert es).','Changing a password: the old field gets <code>current-password</code> (the password manager fills it in), the new one <code>new-password</code> (it suggests a strong one and saves it).')],
  ['off',`<div class="field"><label for="ha-autocomplete-coupon">${tx('Gutscheincode','Voucher code')}</label><input class="input" id="ha-autocomplete-coupon" name="coupon" autocomplete="off" data-ha-hl></div>`,tx('Schaltet die Vorschläge aus dem Eingabeverlauf ab – sinnvoll für Einmal-Eingaben wie Gutscheincodes. Bei Login-Feldern ignorieren Browser und Passwort-Manager es meist.','Turns off suggestions from the input history – sensible for one-off entries like voucher codes. On login fields browsers and password managers mostly ignore it.')]
 ],
 tip:tx('Tippfehler im Token fallen nicht auf: <code>autocomplete="e-mail"</code> ist kein gültiger Wert, und der Browser rät dann selbst – oder gar nicht. Nur Werte aus der Liste der Spezifikation verwenden. Stehen zwei Adressen auf einer Seite, trennen Präfixe sie: <code>shipping street-address</code> und <code>billing street-address</code>.','Typos in the token go unnoticed: <code>autocomplete="e-mail"</code> is not a valid value, and the browser then guesses – or doesn’t. Only use values from the list in the spec. With two addresses on one page, prefixes keep them apart: <code>shipping street-address</code> and <code>billing street-address</code>.')});

HTMLA.push({id:'placeholder',cat:'forms',name:'placeholder',sub:tx('Beispiel, keine Beschriftung','An example, not a label'),mdn:'Elements/input#placeholder',keys:'platzhalter hinweis label beschriftung beispiel hint',
 desc:tx('<code>placeholder</code> zeigt einen Beispieltext im leeren Feld. Er verschwindet mit dem ersten Zeichen – deshalb ist er höchstens ein Hinweis, nie die Beschriftung.','<code>placeholder</code> shows sample text in an empty field. It disappears with the first character – so it’s a hint at most, never the label.'),
 mode:'html',ax:'input',
 vals:[
  [tx('nur placeholder','placeholder only'),`<div class="field"><input class="input" type="email" name="email" placeholder="${tx('E-Mail','Email')}" data-ha-hl></div>`,tx('Sieht aufgeräumt aus – bis du tippst: Dann ist weg, was das Feld wollte. Den Namen holt sich der Browser notgedrungen aus dem placeholder.','Looks tidy – until you type: then what the field wanted is gone. The browser falls back to the placeholder for the name.')],
  ['label + placeholder',`<div class="field"><label for="ha-placeholder-in">${tx('E-Mail','Email')}</label><input class="input" id="ha-placeholder-in" type="email" name="email" placeholder="${tx('name@beispiel.at','name@example.com')}" data-ha-hl></div>`,tx('Besser: Das Label bleibt stehen, der placeholder zeigt nur ein Beispiel. Aber auch das verschwindet beim Tippen, und ein grauer Text im Feld wirkt schnell wie schon ausgefüllt.','Better: the label stays, the placeholder only shows an example. But that disappears too while typing, and grey text in a field easily looks already filled in.')],
  [tx('label + Hinweis','label + hint'),`<div class="field"><label for="ha-placeholder-in">${tx('E-Mail','Email')}</label><p class="hint" id="ha-placeholder-hint">${tx('z. B. name@beispiel.at','e.g. name@example.com')}</p><input class="input" id="ha-placeholder-in" type="email" name="email" aria-describedby="ha-placeholder-hint" data-ha-hl></div>`,tx('Am besten: Das Beispiel steht dauerhaft unter dem Label und ist über <code>aria-describedby</code> verknüpft – der Screenreader liest es nach dem Namen vor.','Best: the example stays visible below the label and is linked via <code>aria-describedby</code> – the screen reader reads it after the name.')]
 ],
 measure:st=>{const i=$('input',st);return !i.placeholder?tx('Kein placeholder – nichts verschwindet beim Tippen.','No placeholder – nothing disappears while typing.'):i.matches(':placeholder-shown')?tx('Placeholder sichtbar – tipp etwas, dann ist er weg.','Placeholder visible – type something and it’s gone.'):tx('Placeholder ausgeblendet, weil das Feld Text enthält.','Placeholder hidden because the field contains text.')},
 tip:tx('Was im placeholder steht, fehlt genau dann, wenn man es braucht: beim Korrigieren. Füllt Autofill das Feld, sieht niemand mehr, welches Feld was war. Pflichtangaben, Formatregeln und Fehlermeldungen gehören in sichtbaren Text.','What’s in the placeholder is missing exactly when you need it: while correcting. When autofill fills the field, nobody can tell any more which field was which. Required markers, format rules and error messages belong in visible text.')});

HTMLA.push({id:'textarea',cat:'forms',name:'<textarea>',sub:tx('Mehrzeiliger Text','Multi-line text'),mdn:'Elements/textarea',keys:'mehrzeilig multiline rows cols nachricht kommentar textfeld',
 desc:tx('<code>&lt;textarea&gt;</code> ist das mehrzeilige Textfeld. Die Größe gibst du in Zeilen (<code>rows</code>, Standard 2) und Zeichen (<code>cols</code>, Standard 20) an – oder per CSS. Der Startinhalt steht zwischen den Tags.','<code>&lt;textarea&gt;</code> is the multi-line text field. You set its size in lines (<code>rows</code>, default 2) and characters (<code>cols</code>, default 20) – or with CSS. The initial content goes between the tags.'),
 stage:`<div class="field ha-textarea-f"><label for="ha-textarea-msg">${tx('Nachricht','Message')}</label><textarea class="ha-textarea" id="ha-textarea-msg" name="message">${tx('Hallo!','Hello!')}</textarea></div>`,
 t:'textarea',show:'.ha-textarea-f',
 vals:[
  [tx('Standard','default'),{rows:null,cols:null},tx('2 Zeilen hoch, rund 20 Zeichen breit. Die Ecke unten rechts zieht das Feld größer (CSS <code>resize</code>).','2 lines high, about 20 characters wide. The corner at the bottom right makes the field bigger (CSS <code>resize</code>).')],
  ['rows="5"',{rows:'5',cols:null},tx('Fünf Zeilen Platz – passt für eine kurze Nachricht. Längerer Text scrollt.','Room for five lines – fits a short message. Longer text scrolls.')],
  ['cols="32"',{rows:null,cols:'32'},tx('Breite in Zeichen. In der Praxis setzt man sie meist per CSS (<code>width: 100%</code>) – dann zählt <code>cols</code> nicht mehr.','Width in characters. In practice it’s usually set with CSS (<code>width: 100%</code>) – then <code>cols</code> no longer counts.')]
 ],
 measure:st=>{const t=$('textarea',st);return tx(`${t.value.length} Zeichen · ${t.value.split('\n').length} Zeile(n) · rows ${t.rows} · cols ${t.cols}`,`${t.value.length} characters · ${t.value.split('\n').length} line(s) · rows ${t.rows} · cols ${t.cols}`)},
 tip:tx('Ein <code>value</code>-Attribut gibt es nicht – der Startinhalt steht zwischen den Tags, und <em>jedes</em> Leerzeichen dort gehört dazu. Nur ein Zeilenumbruch direkt nach dem Start-Tag fällt weg. Wer <code>&lt;textarea&gt;</code> im Template hübsch einrückt, hat plötzlich Leerzeichen im Feld.','There is no <code>value</code> attribute – the initial content goes between the tags, and <em>every</em> space there counts. Only a line break right after the start tag is dropped. Indent a <code>&lt;textarea&gt;</code> nicely in your template and you suddenly have spaces in the field.')});

HTMLA.push({id:'select',cat:'forms',name:'<select>',sub:tx('Auswahlliste: size, multiple, optgroup','Select list: size, multiple, optgroup'),mdn:'Elements/select',keys:'dropdown auswahl option optgroup multiple size listbox combobox',
 desc:tx('<code>&lt;select&gt;</code> ist die Auswahlliste, <code>&lt;option&gt;</code> sind die Einträge, <code>&lt;optgroup label&gt;</code> fasst sie unter nicht wählbaren Überschriften zusammen. <code>size</code> und <code>multiple</code> machen aus der Aufklappliste eine offene Liste – die Rolle wechselt von <code>combobox</code> zu <code>listbox</code>.','<code>&lt;select&gt;</code> is the select list, <code>&lt;option&gt;</code> are the entries, <code>&lt;optgroup label&gt;</code> groups them under headings you can’t select. <code>size</code> and <code>multiple</code> turn the drop-down into an open list – the role changes from <code>combobox</code> to <code>listbox</code>.'),
 stage:`<form class="ha-form-grid" action="/order"><div class="field"><label for="ha-select-s">${tx('Obst &amp; Gemüse','Fruit &amp; veg')}</label><select id="ha-select-s" name="item"><optgroup label="${tx('Obst','Fruit')}"><option value="${tx('apfel','apple')}">${tx('Apfel','Apple')}</option><option value="${tx('birne','pear')}" selected>${tx('Birne','Pear')}</option><option value="${tx('kirsche','cherry')}">${tx('Kirsche','Cherry')}</option></optgroup><optgroup label="${tx('Gemüse','Vegetables')}"><option value="${tx('karotte','carrot')}">${tx('Karotte','Carrot')}</option><option value="${tx('lauch','leek')}">${tx('Lauch','Leek')}</option></optgroup></select></div><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,
 t:'select',show:'.field',ax:true,fresh:true,
 vals:[
  [tx('Standard','default'),{size:null,multiple:null},tx('Aufklappliste mit genau einer Auswahl. Die optgroup-Überschriften lassen sich nicht wählen.','Drop-down with exactly one choice. The optgroup headings can’t be selected.')],
  ['size="4"',{size:'4',multiple:null},tx('Immer offene Liste mit 4 sichtbaren Zeilen – die Rolle wird <code>listbox</code>.','Always-open list with 4 visible rows – the role becomes <code>listbox</code>.')],
  ['multiple',{size:null,multiple:true},tx('Mehrfachauswahl: <kbd>Strg</kbd>/<kbd>⌘</kbd> + Klick für einzelne, <kbd>Umschalt</kbd> + Klick für Bereiche. Beim Absenden steht <code>item</code> mehrfach im Toast.','Multiple choice: <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + click for single items, <kbd>Shift</kbd> + click for ranges. On submit, <code>item</code> appears several times in the toast.')]
 ],
 measure:st=>{const o=[...$('select',st).selectedOptions].map(o=>o.value);return tx(`Gewählt: ${o.join(', ')||'nichts'}`,`Selected: ${o.join(', ')||'nothing'}`)},
 tip:tx('Mehrfachauswahl per <kbd>Strg</kbd>-Klick kennt kaum jemand, und ein Klick ohne Taste wirft die ganze bisherige Auswahl weg. Für „mehrere wählen“ sind Checkboxen fast immer besser. Und für eine echte Pflichtauswahl: erste Option <code>&lt;option value=""&gt;Bitte wählen&lt;/option&gt;</code> plus <code>required</code>.','Hardly anyone knows <kbd>Ctrl</kbd>-click multi-selection, and a click without a key throws away the whole previous selection. For “pick several”, checkboxes are almost always better. And for a real required choice: first option <code>&lt;option value=""&gt;Please choose&lt;/option&gt;</code> plus <code>required</code>.')});

HTMLA.push({id:'datalist',cat:'forms',name:'<datalist>',sub:tx('Vorschläge, aber freie Eingabe','Suggestions, but free input'),mdn:'Elements/datalist',keys:'vorschläge suggestions autocomplete list combobox liste',
 desc:tx('<code>&lt;datalist&gt;</code> liefert Vorschläge für ein Textfeld, verknüpft über <code>list</code> = <code>id</code>. Anders als bei <code>&lt;select&gt;</code> bleibt jede Eingabe erlaubt – die Liste hilft nur beim Tippen.','<code>&lt;datalist&gt;</code> provides suggestions for a text field, linked via <code>list</code> = <code>id</code>. Unlike <code>&lt;select&gt;</code>, any input stays allowed – the list only helps with typing.'),
 stage:`<div class="field ha-datalist-f"><label for="ha-datalist-in">${tx('Stadt','City')}</label><input class="input" id="ha-datalist-in" name="city"><datalist id="ha-datalist-dl"><option value="${tx('Wien','Vienna')}"></option><option value="Graz"></option><option value="Linz"></option><option value="Salzburg"></option><option value="Innsbruck"></option></datalist></div>`,
 t:'#ha-datalist-in',show:'.ha-datalist-f',attr:'list',ax:true,
 vals:[
  [tx('ohne list','no list'),null,tx('Ein gewöhnliches Textfeld – die <code>&lt;datalist&gt;</code> steht nutzlos daneben.','An ordinary text field – the <code>&lt;datalist&gt;</code> sits there unused.')],
  ['list="…"','ha-datalist-dl',tx('Klick ins Feld oder tipp „G“: Vorschläge erscheinen. Tipp „Bregenz“ – geht trotzdem. Die Rolle wird <code>combobox</code>.','Click into the field or type “G”: suggestions appear. Type “Bregenz” – still allowed. The role becomes <code>combobox</code>.')]
 ],
 def:1,
 measure:st=>{const i=$('input',st),v=i.value.trim();if(!v)return tx('Noch leer.','Still empty.');const hit=$$('option',st).some(o=>o.value===v);return tx(`„${v}“ – ${hit?'aus der Liste':'freie Eingabe, trotzdem gültig'}`,`“${v}” – ${hit?'from the list':'free input, still valid'}`)},
 tip:tx('Aussehen und Filterlogik der Vorschläge bestimmt der Browser – stylen lässt sich die Liste nicht, und nicht jede Screenreader-Browser-Kombination sagt die Vorschläge zuverlässig an. Für eine echte Suche mit eigenen Treffern brauchst du ein Combobox-Muster mit ARIA.','Look and filtering of the suggestions are up to the browser – you can’t style the list, and not every screen reader and browser combination announces the suggestions reliably. For a real search with your own results you need a combobox pattern with ARIA.')});

HTMLA.push({id:'fieldset',cat:'forms',name:'<fieldset> / <legend>',sub:tx('Felder gruppieren und benennen','Grouping and naming fields'),mdn:'Elements/fieldset',keys:'gruppe group legend gruppieren radio gruppe disabled',
 desc:tx('<code>&lt;fieldset&gt;</code> gruppiert zusammengehörige Felder, <code>&lt;legend&gt;</code> ist die Überschrift der Gruppe – und ihr Name im Accessibility Tree. Der Screenreader sagt ihn an, wenn der Fokus in die Gruppe kommt. <code>disabled</code> am <code>&lt;fieldset&gt;</code> sperrt alle Felder darin auf einmal.','<code>&lt;fieldset&gt;</code> groups related fields, <code>&lt;legend&gt;</code> is the group’s heading – and its name in the accessibility tree. The screen reader announces it when focus enters the group. <code>disabled</code> on the <code>&lt;fieldset&gt;</code> disables every field inside at once.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  ['fieldset + legend',`<form class="ha-form-grid" action="/checkout"><fieldset class="ha-fieldset" data-ha-hl><legend>${tx('Versand','Shipping')}</legend><label class="check-row"><input type="radio" name="shipping" value="standard" checked> Standard</label><label class="check-row"><input type="radio" name="shipping" value="express"> Express</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Tab in die Gruppe: NVDA sagt zuerst „Versand, Gruppierung“, dann das Radio. Ohne die Frage wären „Standard“ und „Express“ rätselhaft.','Tab into the group: NVDA first says “Shipping, grouping”, then the radio. Without the question, “Standard” and “Express” would be puzzling.')],
  [tx('ohne legend','no legend'),`<form class="ha-form-grid" action="/checkout"><fieldset class="ha-fieldset" data-ha-hl><p class="ha-fieldset-q">${tx('Versand','Shipping')}</p><label class="check-row"><input type="radio" name="shipping" value="standard" checked> Standard</label><label class="check-row"><input type="radio" name="shipping" value="express"> Express</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Sieht fast gleich aus, aber die Überschrift ist nur ein Absatz: Die Gruppe hat keinen Namen, der Screenreader sagt bloß „Gruppierung“.','Looks almost the same, but the heading is just a paragraph: the group has no name, the screen reader only says “grouping”.')],
  ['disabled',`<form class="ha-form-grid" action="/checkout"><fieldset class="ha-fieldset" disabled data-ha-hl><legend>${tx('Versand','Shipping')}</legend><label class="check-row"><input type="radio" name="shipping" value="standard" checked> Standard</label><label class="check-row"><input type="radio" name="shipping" value="express"> Express</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Alle Felder darin sind gesperrt: Tab springt drüber, und beim Absenden fehlt <code>shipping</code> – deaktivierte Felder werden nicht gesendet.','Every field inside is disabled: tab skips them, and on submit <code>shipping</code> is missing – disabled fields aren’t sent.')]
 ],
 measure:st=>{const d=[...new FormData($('form',st))].map(([k,v])=>`${k}=${v}`).join('&');return tx(`Beim Absenden: ${d||'nichts'}`,`On submit: ${d||'nothing'}`)},
 tip:tx('Die <code>&lt;legend&gt;</code> muss das erste Kind des <code>&lt;fieldset&gt;</code> sein – eine Überschrift daneben zählt nicht als Gruppenname. Kleine Ausnahme bei <code>disabled</code>: Felder <em>in</em> der ersten <code>&lt;legend&gt;</code> bleiben bedienbar.','The <code>&lt;legend&gt;</code> must be the first child of the <code>&lt;fieldset&gt;</code> – a heading next to it doesn’t count as the group name. A small exception with <code>disabled</code>: fields <em>inside</em> the first <code>&lt;legend&gt;</code> stay usable.')});

HTMLA.push({id:'checkbox-radio',cat:'forms',name:'checkbox / radio',sub:tx('Ankreuzen und auswählen','Ticking and choosing'),mdn:'Elements/input/radio',keys:'checkbox radio kontrollkästchen auswahlschalter checked name gruppe pfeiltasten arrow keys',
 desc:tx('Checkboxen sind unabhängig, Radios schließen sich gegenseitig aus – aber nur, wenn sie denselben <code>name</code> haben. Der <code>name</code> bildet die Gruppe: <kbd>Tab</kbd> springt einmal hinein, die Pfeiltasten wechseln die Auswahl.','Checkboxes are independent, radios exclude each other – but only if they share the same <code>name</code>. The <code>name</code> forms the group: <kbd>Tab</kbd> enters it once, the arrow keys change the choice.'),
 mode:'html',ax:'[data-ha-hl]',
 vals:[
  [tx('radio, gleicher name','radio, same name'),`<form class="ha-form-grid" action="/cart"><fieldset class="ha-fieldset"><legend>${tx('Größe','Size')}</legend><label class="check-row"><input type="radio" name="size" value="s"> S</label><label class="check-row"><input type="radio" name="size" value="m" data-ha-hl> M</label><label class="check-row"><input type="radio" name="size" value="l"> L</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Tab in die Gruppe, dann <kbd>↓</kbd>/<kbd>↑</kbd>: Die Pfeile bewegen den Fokus <em>und</em> wählen aus. Ein zweites Tab verlässt die Gruppe.','Tab into the group, then <kbd>↓</kbd>/<kbd>↑</kbd>: the arrows move focus <em>and</em> select. A second tab leaves the group.')],
  [tx('radio ohne name','radio, no name'),`<form class="ha-form-grid" action="/cart"><fieldset class="ha-fieldset"><legend>${tx('Größe','Size')}</legend><label class="check-row"><input type="radio" value="s"> S</label><label class="check-row"><input type="radio" value="m" data-ha-hl> M</label><label class="check-row"><input type="radio" value="l"> L</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Jedes Radio ist seine eigene Gruppe: Alle drei lassen sich ankreuzen, keins wieder abwählen, jedes ist ein eigener Tab-Stopp – „1 von 1“. Und ohne <code>name</code> wird nichts gesendet.','Each radio is its own group: all three can be checked, none unchecked again, each is a separate tab stop – “1 of 1”. And without a <code>name</code> nothing is sent.')],
  ['checked',`<form class="ha-form-grid" action="/cart"><fieldset class="ha-fieldset"><legend>${tx('Größe','Size')}</legend><label class="check-row"><input type="radio" name="size" value="s"> S</label><label class="check-row"><input type="radio" name="size" value="m" checked data-ha-hl> M</label><label class="check-row"><input type="radio" name="size" value="l"> L</label></fieldset><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('<code>checked</code> wählt vor. Es ist aber nur der <em>Startwert</em>: Klick auf „L“ – im Code bleibt <code>checked</code> bei M stehen, im Accessibility Tree nicht. Das Attribut ändert sich nie, nur die Eigenschaft <code>.checked</code>.','<code>checked</code> preselects. But it’s only the <em>initial value</em>: click “L” – in the code <code>checked</code> stays on M, in the accessibility tree it doesn’t. The attribute never changes, only the <code>.checked</code> property does.')],
  ['checkbox',`<form class="ha-form-grid" action="/signup"><label class="check-row"><input type="checkbox" name="newsletter" data-ha-hl> Newsletter</label><label class="check-row"><input type="checkbox" name="terms" value="accepted"> ${tx('AGB gelesen','Read the terms')}</label><button class="btn btn-secondary">${tx('Senden','Send')}</button></form>`,tx('Jede Checkbox für sich, <kbd>Leertaste</kbd> schaltet um. Hak beide an: Die ohne <code>value</code> sendet <code>on</code>, die andere ihren <code>value</code>.','Each checkbox on its own, <kbd>Space</kbd> toggles. Tick both: the one without <code>value</code> sends <code>on</code>, the other its <code>value</code>.')]
 ],
 measure:st=>{const d=[...new FormData($('form',st))].map(([k,v])=>`${k}=${v}`).join('&');return tx(`Beim Absenden: ${d||'nichts'}`,`On submit: ${d||'nothing'}`)},
 tip:tx('Eine nicht angehakte Checkbox sendet gar nichts – nicht <code>false</code>, nicht <code>off</code>. Der Server muss „fehlt“ als „nein“ lesen. Und ist in einer Radio-Gruppe einmal etwas gewählt, führt kein Weg zurück zu „nichts gewählt“ – ist das eine gültige Antwort, braucht sie eine eigene Option.','An unticked checkbox sends nothing at all – not <code>false</code>, not <code>off</code>. The server has to read “missing” as “no”. And once something in a radio group is selected, there’s no way back to “nothing selected” – if that’s a valid answer, it needs its own option.')});

HTMLA.push({id:'range-color',cat:'forms',name:'type="range" / "color"',sub:tx('Schieberegler und Farbwähler','Slider and colour picker'),mdn:'Elements/input/range',keys:'range slider schieberegler color farbe farbwähler colour picker min max step',
 desc:tx('Zwei Felder ohne Tipparbeit: <code>range</code> ist ein Schieberegler zwischen <code>min</code> und <code>max</code> in Schritten von <code>step</code>, <code>color</code> öffnet den Farbwähler des Systems.','Two fields without typing: <code>range</code> is a slider between <code>min</code> and <code>max</code> in steps of <code>step</code>, <code>color</code> opens the system’s colour picker.'),
 mode:'html',
 vals:[
  ['range',`<div class="field"><label for="ha-range-color-r">${tx('Lautstärke','Volume')}</label><input id="ha-range-color-r" type="range" name="volume" min="0" max="100" step="10" value="40" data-ha-hl></div>`,tx('Mit der Tastatur: Pfeiltasten um einen Schritt, <kbd>Pos1</kbd>/<kbd>Ende</kbd> springen zu min/max. Den Wert zeigt der Regler selbst nicht an – dafür gibt es <code>&lt;output&gt;</code>.','With the keyboard: arrow keys move one step, <kbd>Home</kbd>/<kbd>End</kbd> jump to min/max. The slider doesn’t show its value itself – that’s what <code>&lt;output&gt;</code> is for.')],
  [tx('range ohne Angaben','range, no attributes'),`<div class="field"><label for="ha-range-color-r">${tx('Lautstärke','Volume')}</label><input id="ha-range-color-r" type="range" name="volume" data-ha-hl></div>`,tx('Ohne Angaben: 0 bis 100, Schritt 1, Startwert genau in der Mitte – 50.','Without attributes: 0 to 100, step 1, initial value right in the middle – 50.')],
  ['color',`<div class="field"><label for="ha-range-color-c">${tx('Akzentfarbe','Accent colour')}</label><input id="ha-range-color-c" type="color" name="accent" value="#c2410c" data-ha-hl></div>`,tx('Der Wert ist immer eine Hex-Farbe in Kleinbuchstaben, <code>#rrggbb</code> – keine Farbnamen, keine Transparenz. Ohne <code>value</code> ist er <code>#000000</code>.','The value is always a lowercase hex colour, <code>#rrggbb</code> – no colour names, no transparency. Without <code>value</code> it’s <code>#000000</code>.')]
 ],
 measure:st=>{const i=$('input',st);return i.type==='range'?tx(`value „${i.value}“ (ein String) · valueAsNumber ${i.valueAsNumber} · min ${i.min||'–'} · max ${i.max||'–'} · step ${i.step||'–'}`,`value “${i.value}” (a string) · valueAsNumber ${i.valueAsNumber} · min ${i.min||'–'} · max ${i.max||'–'} · step ${i.step||'–'}`):tx(`value „${i.value}“`,`value “${i.value}”`)},
 tip:tx('Ein Schieberegler ist ungenau – für exakte Werte wie Preise oder Mengen ein Zahlenfeld daneben stellen oder stattdessen nehmen. Hat der Wert eine Einheit, sagt <code>aria-valuetext="40 Prozent"</code> (per Skript aktuell gehalten) dem Screenreader mehr als die nackte Zahl.','A slider is imprecise – for exact values like prices or quantities put a number field next to it or use one instead. If the value has a unit, <code>aria-valuetext="40 percent"</code> (kept up to date by script) tells the screen reader more than the bare number.')});

HTMLA.push({id:'input-file',cat:'forms',name:'type="file"',sub:tx('Dateien hochladen','Uploading files'),mdn:'Elements/input/file',keys:'upload datei file accept multiple capture kamera camera enctype multipart',
 desc:tx('<code>&lt;input type="file"&gt;</code> öffnet den Dateidialog. <code>accept</code> filtert die angebotenen Dateitypen, <code>multiple</code> erlaubt mehrere Dateien, <code>capture</code> öffnet am Handy direkt die Kamera.','<code>&lt;input type="file"&gt;</code> opens the file dialog. <code>accept</code> filters the file types on offer, <code>multiple</code> allows several files, <code>capture</code> opens the camera directly on phones.'),
 stage:`<form class="ha-form-grid" action="/upload" method="post" enctype="multipart/form-data"><div class="field"><label for="ha-input-file-in">${tx('Beleg','Receipt')}</label><input id="ha-input-file-in" type="file" name="receipt"></div><button class="btn btn-secondary">${tx('Hochladen','Upload')}</button></form>`,
 t:'#ha-input-file-in',show:'form',fresh:true,
 vals:[
  [tx('ohne','none'),{accept:null,multiple:null,capture:null},tx('Jede Datei, genau eine.','Any file, exactly one.')],
  ['accept="image/*"',{accept:'image/*'},tx('Der Dateidialog bietet vorrangig Bilder an – ein Filter, keine Prüfung: „Alle Dateien“ lässt sich meist trotzdem wählen.','The file dialog mainly offers images – a filter, not a check: “All files” can usually still be chosen.')],
  ['accept=".pdf,.docx"',{accept:'.pdf,.docx'},tx('Dateiendungen und MIME-Typen lassen sich mischen, getrennt durch Kommas.','File extensions and MIME types can be mixed, separated by commas.')],
  ['multiple',{multiple:true},tx('Mehrere Dateien auf einmal. Gesendet wird <code>receipt</code> dann mehrfach.','Several files at once. <code>receipt</code> is then sent several times.')],
  ['capture',{accept:'image/*',capture:'environment'},tx('Am Handy öffnet sich direkt die Rückkamera (<code>user</code> wäre die Frontkamera). Am Desktop wirkungslos.','On phones the back camera opens directly (<code>user</code> would be the front camera). No effect on desktop.')]
 ],
