const VOID=new Set(['area','base','br','col','embed','hr','img','input','link','meta','source','track','wbr']);
const INLINE=new Set(['a','abbr','b','bdi','bdo','br','cite','code','data','del','dfn','em','i','ins','kbd','mark','q','s','samp','small','span','strong','sub','sup','time','u','var','wbr','label','output','meter','progress','img','input','button','select','textarea']);
/* Wert eines Eintrags: [Label, Wert, Hinweis]. Wert: String setzt das Attribut e.attr, null entfernt es,
   true setzt es leer (boolesches Attribut), ein Objekt setzt mehrere Attribute. Im Modus 'html' ist der Wert Markup. */
function haVal(e,v){
  if(!Array.isArray(v))v=[v];
  const [label,val=label,note='']=v;
  if(e.mode==='html')return {label,html:val,note};
  const attrs=val!==null&&typeof val==='object'?val:{[e.attr||e.name]:val};
  return {label,attrs,note};
}
const haAttrOut=(n,v)=>v===''?esc(n):`${esc(n)}="${esc(v)}"`;
/* Serialisiert den Live-DOM der Vorschau als lesbares HTML. hl: Attribute, die hervorgehoben werden */
function haSerialize(el,hl,ind=''){
  if(el.nodeType===3){const t=el.textContent.replace(/\s+/g,' ').trim();return t?ind+esc(t.length>90?t.slice(0,88)+'…':t):''}
  if(el.nodeType!==1||el.hasAttribute('data-ha-hide'))return '';
  const tag=el.localName,mark=el.hasAttribute('data-ha-hl');
  const attrs=[...el.attributes].filter(a=>!a.name.startsWith('data-ha-')).map(a=>{const s=haAttrOut(a.name,a.value);return hl?.has(a.name)?`<span class="ha-hl">${s}</span>`:s});
  let open=`&lt;${tag}${attrs.length?' '+attrs.join(' '):''}&gt;`;
  if(mark)open=`<span class="ha-hl">${open}</span>`;
  if(VOID.has(tag))return ind+open;
  const close=mark?`<span class="ha-hl">&lt;/${tag}&gt;</span>`:`&lt;/${tag}&gt;`;
  if(tag==='svg')return `${ind}${open}…${close}`;
  const kids=[...(tag==='template'?el.content:el).childNodes].filter(n=>n.nodeType===1?!n.hasAttribute('data-ha-hide'):n.nodeType===3&&n.textContent.trim());
  if(!kids.length)return ind+open+close;
  /* Kurzer Fließtext bleibt auf einer Zeile: <p>Text <strong>fett</strong></p> */
  const flat=kids.every(n=>n.nodeType===3||(INLINE.has(n.localName)&&[...n.childNodes].every(c=>c.nodeType===3)));
  if(flat){
    const inner=[...(tag==='template'?el.content:el).childNodes].map(n=>n.nodeType===3?esc(n.textContent.replace(/\s+/g,' ')):n.nodeType===1&&!n.hasAttribute('data-ha-hide')?haSerialize(n,hl):'').join('').trim();
    if(inner.replace(/<[^>]+>/g,'').length<=90)return ind+open+inner+close;
  }
  return `${ind}${open}\n${kids.map(n=>haSerialize(n,hl,ind+'  ')).filter(Boolean).join('\n')}\n${ind}${close}`;
}
function haAx(el){
  if(!el)return '';
  const i=inspect(el),src=i.name.src?` <span class="ha-ax-src">${esc(i.name.src==='content'?tx('aus dem Inhalt','from content'):tx('aus ','from ')+i.name.src)}</span>`:'';
  if(i.role==='presentation'||i.role==='none')return `<span class="ha-ax-k">${tx('Accessibility Tree','Accessibility tree')}</span> <span>${tx('Rolle','Role')} <code>${esc(i.role)}</code></span><span>${tx('nicht im Tree – der Screenreader überspringt das Element','not in the tree – the screen reader skips the element')}</span>`;
  if(i.hidden)return `<span class="ha-ax-k">${tx('Accessibility Tree','Accessibility tree')}</span> <span>${tx('versteckt – der Screenreader sagt nichts','hidden – the screen reader says nothing')}</span>`;
  return `<span class="ha-ax-k">${tx('Accessibility Tree','Accessibility tree')}</span> <span>${tx('Rolle','Role')} <code>${esc(i.role||'generic')}</code></span>${i.name.name?`<span>Name ${tx('„','“')}${esc(i.name.name)}${tx('“','”')}${src}</span>`:''}${i.states.length?`<span>${i.states.map(s=>`<code>${esc(s.k)}=${esc(s.v)}</code>`).join(' ')}</span>`:''}<span class="ha-ax-say">NVDA: ${tx('„','“')}${esc(i.say||clean(contentText(el))||'—')}${tx('“','”')}</span>`;
}
function haRender(e,art){
  const st=$('.ha-stage',art),i=+art.dataset.v,v=haVal(e,e.vals[i]);
  let code;
  if(e.code)code=esc(e.code(st,v));
  else{
    const hl=v.attrs?new Set(Object.keys(v.attrs)):null;
    const show=e.mode==='html'?[...st.childNodes]:$$(e.show||e.t,st);
    code=show.map(n=>haSerialize(n,hl)).filter(Boolean).join('\n');
  }
  $('.ha-pre code',art).innerHTML=code||tx('&lt;!-- leer --&gt;','&lt;!-- empty --&gt;');
  const m=$('.ha-meas',art),txt=e.measure?e.measure(st):'';
  if(m.textContent!==txt)m.textContent=txt;
  m.hidden=!txt;
  const ax=$('.ha-ax',art);
  if(ax){const html=haAx(e.ax===true?$(e.t,st):$(e.ax,st));if(ax.innerHTML!==html)ax.innerHTML=html}
}
function haApply(e,art,i){
  const st=$('.ha-stage',art),v=haVal(e,e.vals[i]),prev=art.dataset.v;
  art.dataset.v=i;
  if(e.mode==='html'||e.fresh||prev===undefined){
    art._clean?.();art._clean=null;
    st.innerHTML=e.mode==='html'?v.html:e.stage;
  }
  if(v.attrs){
    const keys=[...new Set(e.vals.flatMap(x=>Object.keys(haVal(e,x).attrs)))];
    $$(e.t,st).forEach(el=>{
      keys.forEach(k=>el.removeAttribute(k));
      Object.entries(v.attrs).forEach(([k,x])=>{if(x===true)el.setAttribute(k,'');else if(x!==null&&x!==false)el.setAttribute(k,x)});
    });
  }
  if(!art._clean&&e.init){const c=e.init(st,v);art._clean=typeof c==='function'?c:()=>{}}
  const note=$('.ha-note',art);note.hidden=!v.note;note.innerHTML=v.note;
  haRender(e,art);
}
const haEntryHTML=e=>`<article class="ha-entry" id="ha-${e.id}" data-id="${e.id}" aria-labelledby="ha-${e.id}-h">
  <h2 id="ha-${e.id}-h" tabindex="-1"><code>${esc(e.name)}</code><span class="ha-sub">${e.sub}</span></h2>
  <p class="ha-desc">${e.desc}</p>
  <fieldset class="ha-vals"><legend class="sr-only">${tx(`Variante für ${esc(e.name)} wählen`,`Choose a variant for ${esc(e.name)}`)}</legend>${e.vals.map((v,i)=>`<label><input type="radio" name="ha-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}><code>${esc(haVal(e,v).label)}</code></label>`).join('')}</fieldset>
  <div class="ha-stage" id="ha-st-${e.id}"></div>
  <p class="ha-meas" role="status" hidden></p><p class="ha-note" hidden></p>
  ${e.ax?'<p class="ha-ax"></p>':''}
  <div class="ha-codebox"><pre class="code ha-pre" tabindex="0" role="region" aria-label="${tx('HTML zu','HTML for')} ${esc(e.name)}"><code></code></pre></div>
  ${e.tip?`<p class="ha-tip"><b>${tx('Stolperfalle','Gotcha')}:</b> ${e.tip}</p>`:''}
  <p class="ha-links"><a href="${haMdn(e.mdn)}">MDN: ${esc(e.name)}${tx(' (englisch)','')}</a> · <a href="#${e.cat}/${e.id}">${tx('Link zu diesem Eintrag','Link to this entry')}</a></p>
</article>`;
function haCatHTML(cat){
  const c=CAT_BY[cat],i=HA_CATS.indexOf(c),prev=HA_CATS[i-1],next=HA_CATS[i+1],es=HTMLA.filter(e=>e.cat===cat);
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx(`Kapitel ${i+1} von ${HA_CATS.length}`,`Chapter ${i+1} of ${HA_CATS.length}`)}</p>
  <h1 id="lesson-title" tabindex="-1">${c.title}</h1>
  <p class="rule">${c.intro}</p>
  <nav aria-label="${tx('Einträge in','Entries in')} ${c.title}" class="ha-toc"><ul class="chips">${es.map(e=>`<li><a href="#${cat}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul></nav>
  ${es.map(haEntryHTML).join('')}
  <nav class="pager" aria-label="${tx('Weitere Kapitel','More chapters')}">${prev?`<a class="prev" href="#${prev.id}"><small>${tx('← Voriges Kapitel','← Previous chapter')}</small>${prev.title}</a>`:`<a class="prev" href="#start"><small>${tx('← Zurück zum','← Back to the')}</small>${tx('Überblick','overview')}</a>`}${next?`<a class="next" href="#${next.id}"><small>${tx('Nächstes Kapitel →','Next chapter →')}</small>${next.title}</a>`:`<a class="next" href="#start"><small>${tx('Zurück zum','Back to the')}</small>${tx('Überblick','overview')}</a>`}</nav>
</article>`;
}
function haCatInit(root,sub){
  const offs=[];
  $$('.ha-entry',root).forEach(art=>{
    const e=HA_BY[art.dataset.id],st=$('.ha-stage',art);
    art.addEventListener('change',ev=>{if(ev.target.name===`ha-${e.id}`)haApply(e,art,+ev.target.value)});
    /* Die Vorschau navigiert und sendet nicht wirklich; ein Formular meldet stattdessen, was es senden würde */
    st.addEventListener('click',ev=>{const a=ev.target.closest('a[href]');if(a&&!a.getAttribute('href').startsWith('#'))ev.preventDefault()});
    st.addEventListener('submit',ev=>{
      const f=ev.target;if(f.method==='dialog')return;
      ev.preventDefault();
      const pairs=[...new FormData(f,ev.submitter)].map(([k,v])=>`${k}=${v instanceof File?v.name:v}`);
      toast({msg:tx(`Formular abgeschickt (Demo) – gesendet würde: ${pairs.join('&')||'nichts'}`,`Form submitted (demo) – it would send: ${pairs.join('&')||'nothing'}`),type:'success',duration:5000});
    });
    /* Messwert, Code und Accessibility-Zeile folgen jeder Änderung in der Vorschau */
    let t=0;const upd=()=>{if(!t)t=setTimeout(()=>{t=0;haRender(e,art)},30)};
    const mo=new MutationObserver(upd);mo.observe(st,{subtree:true,childList:true,attributes:true,characterData:true});
    ['input','change','toggle','close','focusin','load'].forEach(n=>st.addEventListener(n,upd,true));
    offs.push(()=>{mo.disconnect();clearTimeout(t);art._clean?.()});
    haApply(e,art,e.def||0);
  });
  const hit=HA_BY[sub]&&$('#ha-'+sub,root);
  if(hit){hit.classList.add('ha-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
  return ()=>offs.forEach(f=>f());
}
function haStartHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Überblick','Overview')}</p>
  <h1 id="lesson-title" tabindex="-1">${tx('HTML zum Anfassen','HTML you can touch')}</h1>
  <p class="rule">${tx(`${HTMLA.length} Elemente und Attribute, jedes mit einer Live-Vorschau: Variante anklicken, Wirkung sehen, das HTML darunter ablesen. Viele Einträge zeigen dazu, was im Accessibility Tree ankommt – also was ein Screenreader vorliest.`,`${HTMLA.length} elements and attributes, each with a live preview: click a variant, see the effect, read the HTML below. Many entries also show what reaches the accessibility tree – what a screen reader reads out.`)}</p>
  <div class="start-grid">${HA_CATS.map(c=>`<div class="tile"><h3>${c.title}</h3><p>${c.intro}</p><a class="btn btn-secondary" href="#${c.id}">${tx(`${HTMLA.filter(e=>e.cat===c.id).length} Einträge`,`${HTMLA.filter(e=>e.cat===c.id).length} entries`)}<span class="sr-only"> in ${c.title}</span></a></div>`).join('')}</div>
  <h2>${tx('Alle Einträge','All entries')}</h2>
  <div class="field ha-find"><label for="ha-q">${tx('Element oder Attribut suchen','Search elements and attributes')} <span class="opt">${tx('Name oder Stichwort','name or keyword')}</span></label><input class="input" id="ha-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ha-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${tx('Alle Einträge im HTML-Atlas','All entries in the HTML Atlas')}"><table class="table ha-index"><caption class="sr-only">${tx('Alle Einträge im HTML-Atlas','All entries in the HTML Atlas')}</caption><thead><tr><th scope="col">${tx('Element / Attribut','Element / attribute')}</th><th scope="col">${tx('Was es tut','What it does')}</th><th scope="col">${tx('Kapitel','Chapter')}</th></tr></thead><tbody>${HTMLA.map(e=>`<tr data-q="${esc(norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title} ${e.desc.replace(/<[^>]+>/g,'')}`))}"><td><a href="#${e.cat}/${e.id}"><code>${esc(e.name)}</code></a></td><td>${e.sub}</td><td>${CAT_BY[e.cat].title}</td></tr>`).join('')}</tbody></table></div>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  <div class="start-grid sisters">${SISTERS.map(s=>`<div class="tile"><h3>${ic(s.icon)} ${s.name}</h3><p>${s.text}</p><a class="btn btn-secondary" href="${s.url}?lang=${LANG}">${s.open}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div>`).join('')}</div>
  <nav class="pager" aria-label="${tx('Weiter','Next')}"><a class="next" href="#${HA_CATS[0].id}"><small>${tx('Erstes Kapitel →','First chapter →')}</small>${HA_CATS[0].title}</a></nav>
</article>`;
}
function haStartInit(root){
  const q=$('#ha-q',root),rows=$$('tbody tr',root),count=$('#ha-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${HTMLA.length} Einträgen`,`${n} of ${HTMLA.length} entries`):tx(`${HTMLA.length} Einträge`,`${HTMLA.length} entries`)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}
const SISTERS=[
  {name:'Daumenregel',icon:'button',url:'https://daniel-hopium.github.io/pattern-library/',open:tx('Daumenregel öffnen','Open Daumenregel'),text:tx('UI-Regeln mit Live-Beispielen und Negativbeispielen – dazu der WCAG-Kompass und Gut &amp; Schlecht mit Quiz.','UI rules with live examples and counter-examples – plus the WCAG compass and Good &amp; Bad with a quiz.')},
  {name:'CSS-Atlas',icon:'palette',url:'https://daniel-hopium.github.io/css-atlas/',open:tx('CSS-Atlas öffnen','Open CSS Atlas'),text:tx('Die CSS-Referenz mit Live-Vorschau: über 100 Eigenschaften und Selektoren – Wert anklicken, Wirkung sehen.','The CSS reference with live previews: over 100 properties and selectors – click a value, see the effect.')},
  {name:tx('ARIA-Kompass','ARIA Compass'),icon:'compass',url:'https://daniel-hopium.github.io/aria-compass/',open:tx('ARIA-Kompass öffnen','Open ARIA Compass'),text:tx('WAI-ARIA zum Anfassen: Rollen, Namen und Zustände mit Live-Beispielen und einem Inspektor, der zeigt, was der Screenreader hört.','WAI-ARIA hands-on: roles, names and states with live examples and an inspector that shows what the screen reader hears.')},
  {name:'Angular-Patterns',icon:'code',url:'https://daniel-hopium.github.io/angular-patterns/',open:tx('Angular-Patterns öffnen','Open Angular Patterns'),text:tx('Modernes Angular mit Signals, Control Flow, RxJS und Forms – jedes Muster mit „So nicht – so“ und einer Live-Simulation.','Modern Angular with signals, control flow, RxJS and forms – every pattern with “don’t – do” and a live simulation.')}
];

/* ---------- Seitenleiste ---------- */
const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let current=null,statusTimer=null;
function renderList(){
  const q=norm(search.value.trim());
  const hit=e=>!q||norm(`${e.name} ${e.sub} ${CAT_BY[e.cat].title} ${e.keys||''}`).includes(q);
  let html=q?'':`<ul class="items"><li><a class="item item-page" href="#start" data-id="start"><span class="item-title">${tx('Überblick','Overview')}</span><span class="item-short">${tx('Alle Kapitel und eine Tabelle aller Einträge.','All chapters and a table of all entries.')}</span></a></li></ul>`,count=0;
  HA_CATS.forEach(c=>{
    const es=HTMLA.filter(e=>e.cat===c.id&&hit(e));if(!es.length)return;count+=es.length;
    html+=`<a class="grp" id="grp-${c.id}" href="#${c.id}" data-id="${c.id}">${c.title}</a><ul class="items" aria-labelledby="grp-${c.id}">${es.map(e=>`<li><a class="item" href="#${c.id}/${e.id}" data-id="${c.id}/${e.id}"><code>${esc(e.name)}</code></a></li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">${tx(`Nichts zu „${esc(search.value.trim())}“`,`Nothing for “${esc(search.value.trim())}”`)}</p><p class="hint">${tx('Probier ein Element wie „dialog“, ein Attribut wie „autocomplete“ oder ein Stichwort wie „Tastatur“.','Try an element like “dialog”, an attribute like “autocomplete” or a keyword like “keyboard”.')}</p><button type="button" class="btn btn-secondary" id="q-reset">${tx('Suche zurücksetzen','Clear search')}</button></div>`;
  listEl.innerHTML=html;
  markActive(current,false);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?tx(count===1?'1 Treffer':`${count} Treffer`,count===1?'1 result':`${count} results`):tx(`${HTMLA.length} Einträge in ${HA_CATS.length} Kapiteln`,`${HTMLA.length} entries in ${HA_CATS.length} chapters`)},q?450:0);
}
function markActive(id,reveal){
  $$('[data-id]',listEl).forEach(a=>{
    if(a.dataset.id===id){a.setAttribute('aria-current','page');if(reveal)a.scrollIntoView({block:'nearest'})}
    else a.removeAttribute('aria-current');
  });
}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Detailansicht ---------- */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=null;
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.`,`There is no entry at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zum Überblick','Go to overview')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Eintrag suchen','Search entries')}</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=HA_BY[sub];
  document.title=c?(e?`${e.name} · ${c.title} · HTML-Atlas`:`${c.title} · HTML-Atlas`):base==='start'?tx('HTML-Atlas – HTML zum Anfassen','HTML Atlas – HTML you can touch'):tx('Nicht gefunden · HTML-Atlas','Not found · HTML Atlas');
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #loading springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&HA_BY[base]){location.replace(`#${HA_BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=haStartHTML();cleanup=haStartInit(view)}
  else if(CAT_BY[base]){
    if(HA_BY[sub]?.cat!==base)sub='';
    view.innerHTML=haCatHTML(base);cleanup=haCatInit(view,sub);
    focusEl=sub&&$('#ha-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  withLang(view);
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Start ---------- */
withLang(document);
updateLangLink();
renderList();
route(false);
})();
</script>
